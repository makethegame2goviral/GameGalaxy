<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GameGalaxy Game</title>
<meta name="theme-color" content="#070b14">
<style>
:root{--bg:#070b14;--panel:#101827;--panel2:#151e30;--text:#fff;--muted:#93a4bd;--accent:#6c5ce7;--accent2:#00d4ff;--border:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at top,#101b33 0,#070b14 55%,#05070d 100%);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;touch-action:manipulation}body{padding:14px}.shell{max-width:1100px;margin:auto}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.logo{font-weight:900;font-size:22px}.logo span{color:var(--accent2)}.spacer{flex:1}.btn{border:1px solid var(--border);background:linear-gradient(135deg,#6c5ce7,#8b5cf6);color:#fff;border-radius:14px;padding:11px 15px;font-weight:850;cursor:pointer}.btn.secondary{background:#121b2b}.btn.danger{background:#5a1422}.panel{background:linear-gradient(180deg,#121b2b,#0c1320);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.23)}#title{font-size:30px;font-weight:950;margin:0 0 4px}.muted{color:var(--muted)}#stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stat{background:#0d1422;border:1px solid var(--border);padding:10px 12px;border-radius:13px}.big{font-size:58px;font-weight:950;text-align:center;margin:12px 0}.gamezone{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:manipulation}.canvas{display:block;max-width:100%;width:min(960px,100%);border-radius:18px;border:1px solid var(--border);background:#0b1120;touch-action:none}.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.choice{padding:15px 18px;border-radius:16px;border:1px solid var(--border);background:#151e30;color:#fff;font-weight:850;cursor:pointer}.input{width:100%;max-width:430px;padding:15px;border-radius:14px;border:1px solid var(--border);background:#0c1422;color:#fff;font-size:20px;text-align:center;margin:7px 0;outline:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:600px;width:100%}.mem{aspect-ratio:1;border:0;border-radius:15px;background:#1a263b;color:#fff;font-size:32px;font-weight:900;cursor:pointer}.board2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#8c6f4e;padding:8px;border-radius:16px;max-width:420px;width:100%}.tile{aspect-ratio:1;border-radius:10px;background:#c8b199;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:950;color:#241a12}.boardTTT{display:grid;grid-template-columns:repeat(3,110px);gap:10px}.ttt{width:110px;height:110px;border-radius:18px;border:1px solid var(--border);background:#131d2d;color:#fff;font-size:54px;font-weight:900}.connect{display:grid;grid-template-columns:repeat(7,52px);gap:6px;background:#1656bb;padding:9px;border-radius:18px}.connect button{width:52px;height:52px;border:0;border-radius:50%;background:#07142b;cursor:pointer}.status{min-height:28px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:18px;z-index:99}.box{width:min(440px,100%);background:#101827;border:1px solid var(--border);border-radius:22px;padding:20px}.notice{background:#0c1422;color:#aab7ca;padding:12px;border-radius:13px;margin:8px 0;font-size:13px}
@media(max-width:700px){body{padding:10px}.gamezone{min-height:520px}.boardTTT{grid-template-columns:repeat(3,84px)}.ttt{width:84px;height:84px;font-size:42px}.connect{grid-template-columns:repeat(7,40px)}.connect button{width:40px;height:40px}.cards{grid-template-columns:repeat(4,1fr)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell"><div class="bar"><button class="btn secondary" onclick="location.href='index.html'">← Zur Startseite</button><div class="logo">Game<span>Galaxy</span></div><div class="spacer"></div><div id="user" class="muted"></div><button id="authBtn" class="btn secondary">Anmelden</button></div>
<div class="panel"><h1 id="title">GameGalaxy</h1><div id="desc" class="muted"></div><div id="stats"><div class="stat">Score: <b id="score">0</b></div><div class="stat">Level: <b id="level">1</b></div><div class="stat status" id="status">Bereit</div></div><div id="game" class="gamezone"></div></div></div>
<div id="modal" class="modal hidden"><div class="box" id="box"></div></div>
<script>
const names={galaxy:['🚀 Galaxy Blaster','Arcade'],snake:['🐍 Snake','Classic'],perfect:['⏱️ Perfect Time','Skill'],reaction:['⚡ Reaction Rush','Speed'],memory:['🧠 Memory','Brain'],"2048":['🔢 2048','Puzzle'],brick:['🧱 Brick Blast','Arcade'],tictactoe:['⭕ Tic-Tac-Toe','Strategy'],pong:['🏓 Pong','Classic'],flappy:['🐦 Flappy Sky','Skill'],lightsout:['💡 Lights Out','Puzzle'],colormatch:['🎨 Color Match','Speed'],whack:['🔨 Whack Spot','Skill'],connect4:['🟡 Vier Gewinnt','Strategy'],simon:['🔊 Simon','Memory'],higherlower:['🃏 Higher or Lower','Cards'],quickmath:['🧮 Quick Math','Math'],coincatch:['🪙 Coin Catch','Arcade'],safetiles:['💣 Safe Tiles','Memory'],connectdots:['🔵 Connect Dots','Speed'],guessnumber:['🔢 Guess the Number','Brain'],diceduel:['🎲 Dice Duel','Dice'],oddoneout:['🟣 Odd One Out','Speed'],numbersprint:['🔢 Number Sprint','Speed'],holdmeter:['💪 Hold Meter','Skill'],wordscramble:['🔤 Word Scramble','Words'],aimtrainer:['🎯 Aim Trainer','Skill'],laneracer:['🏎️ Lane Racer','Racing'],helicave:['🚁 Heli Cave','Arcade'],fishdash:['🐟 Fish Dash','Arcade'],basketshot:['🏀 Basket Shot','Sports'],goalkeeper:['🥅 Goal Keeper','Sports'],neonrunner:['🏃 Neon Runner','Runner']};
const gameId=new URLSearchParams(location.search).get('game')||'galaxy';
const gameEl=document.getElementById('game');const scoreEl=document.getElementById('score');const levelEl=document.getElementById('level');const statusEl=document.getElementById('status');const titleEl=document.getElementById('title');const descEl=document.getElementById('desc');let animationFrame=0;let cleanup=()=>{};
const rand=(a,b)=>Math.random()*(b-a)+a;const ri=(a,b)=>Math.floor(rand(a,b+1));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function score(v){scoreEl.textContent=v}function level(v){levelEl.textContent=v}function status(v){statusEl.textContent=v}function desc(v){descEl.textContent=v}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function canvas(){const c=document.createElement('canvas');c.width=Math.min(960,Math.max(320,innerWidth-34));c.height=Math.min(590,Math.max(360,Math.round(c.width*.58)));c.className='canvas';gameEl.appendChild(c);return [c,c.getContext('2d')]}function pos(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function btn(text,fn,cl=''){const b=document.createElement('button');b.className='btn '+cl;b.textContent=text;b.onclick=fn;gameEl.appendChild(b);return b}
function restart(fn){btn('↻ Nochmal',fn,'secondary')}
async function hash(s){const b=new TextEncoder().encode(s);const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function refreshUser(){const u=localStorage.getItem('gg_user');document.getElementById('user').textContent=u?'👤 '+u:'';const b=document.getElementById('authBtn');b.textContent=u?'Abmelden':'Anmelden';b.onclick=u?()=>{localStorage.removeItem('gg_user');refreshUser()}:showAuth}
function openModal(html){document.getElementById('box').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function login(){const u=document.getElementById('au').value.trim();const p=document.getElementById('ap').value;const h=await hash(u.toLowerCase()+':'+p);if(localStorage.getItem('gg_account_'+u.toLowerCase())===h){localStorage.setItem('gg_user',u);closeModal();refreshUser()}else document.getElementById('am').textContent='Anmeldung fehlgeschlagen.'}
async function reg(){const u=document.getElementById('au').value.trim();const p=document.getElementById('ap').value;if(!u||p.length<4){document.getElementById('am').textContent='Name + Passwort (mind. 4 Zeichen).';return}const h=await hash(u.toLowerCase()+':'+p);localStorage.setItem('gg_account_'+u.toLowerCase(),h);localStorage.setItem('gg_user',u);closeModal();refreshUser()}
function showAuth(){openModal('<h2>Anmelden</h2><div class="muted">Lokal auf diesem Gerät gespeichert.</div><input id="au" class="input" placeholder="Benutzername"><input id="ap" class="input" type="password" placeholder="Passwort"><div id="am" class="notice"></div><div class="row"><button class="btn" onclick="login()">Anmelden</button><button class="btn secondary" onclick="reg()">Konto erstellen</button><button class="btn danger" onclick="closeModal()">Schließen</button></div>')}
function reset(){cancelAnimationFrame(animationFrame);window.onkeydown=null;cleanup();cleanup=()=>{};gameEl.innerHTML='';score(0);level(1);status('Bereit')}
function setup(){reset();const n=names[gameId]||names.galaxy;titleEl.textContent=n[0];desc(n[1]);refreshUser();const fn=starts[gameId]||starts.galaxy;fn()}

const starts={};
starts.galaxy=()=>{const [c,x]=canvas();let shipX=c.width/2,enemies=[],bullets=[],last=performance.now(),sp=0,sc=0,lives=3,run=true;status('Auto-Schuss • bewege dich links/rechts');level('1');c.onpointermove=e=>{shipX=pos(c,e).x};c.onpointerdown=e=>{shipX=pos(c,e).x};window.onkeydown=e=>{if(e.key==='ArrowLeft')shipX-=35;if(e.key==='ArrowRight')shipX+=35;};function loop(t){if(!run)return;const dt=Math.min(.03,(t-last)/1000);last=t;sp+=dt;shipX=clamp(shipX,25,c.width-25);if(sp>.85){sp=0;enemies.push({x:ri(30,c.width-30),y:-30,r:16,v:70+sc*1.8})}bullets.push({x:shipX,y:c.height-65,v:430});for(let i=bullets.length-1;i>=0;i--){bullets[i].y-=bullets[i].v*dt;if(bullets[i].y<0)bullets.splice(i,1)}for(let i=enemies.length-1;i>=0;i--){enemies[i].y+=enemies[i].v*dt;if(enemies[i].y>c.height+30){enemies.splice(i,1);lives--;if(lives<=0){run=false;status('Game Over');restart(starts.galaxy);return}}}for(let i=enemies.length-1;i>=0;i--)for(let j=bullets.length-1;j>=0;j--)if(Math.hypot(enemies[i].x-bullets[j].x,enemies[i].y-bullets[j].y)<enemies[i].r+4){enemies.splice(i,1);bullets.splice(j,1);sc++;score(sc);break}x.clearRect(0,0,c.width,c.height);x.fillStyle='#071224';x.fillRect(0,0,c.width,c.height);for(let i=0;i<40;i++){x.fillStyle='rgba(255,255,255,.18)';x.fillRect((i*97)%c.width,(i*47+t*.02)%c.height,2,2)}x.fillStyle='#30d5ff';x.beginPath();x.moveTo(shipX,c.height-95);x.lineTo(shipX-25,c.height-40);x.lineTo(shipX,c.height-52);x.lineTo(shipX+25,c.height-40);x.closePath();x.fill();x.fillStyle='#fff';bullets.forEach(b=>x.fillRect(b.x-2,b.y-12,4,12));enemies.forEach(e=>{x.fillStyle='#ff375f';x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillRect(e.x-7,e.y-4,5,5);x.fillRect(e.x+2,e.y-4,5,5)});level('❤️'.repeat(lives)+'🖤'.repeat(3-lives));animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.snake=()=>{const [c,x]=canvas();let s=[{x:8,y:8}],dir={x:1,y:0},next={x:1,y:0},food={x:ri(1,18),y:ri(1,12)},sc=0,last=0,acc=0;status('Swipe oder Pfeiltasten');function move(e){const p=pos(c,e);const cx= s[0].x*c.width/20+c.width/40,cy=s[0].y*c.height/14+c.height/28;if(Math.abs(p.x-cx)>Math.abs(p.y-cy))next=p.x>cx?{x:1,y:0}:{x:-1,y:0};else next=p.y>cy?{x:0,y:1}:{x:0,y:-1}}c.onpointerdown=move;window.onkeydown=e=>{if(e.key==='ArrowUp')next={x:0,y:-1};if(e.key==='ArrowDown')next={x:0,y:1};if(e.key==='ArrowLeft')next={x:-1,y:0};if(e.key==='ArrowRight')next={x:1,y:0}};function loop(t){if(!last)last=t;acc+=(t-last)/1000;last=t;if(acc>.12){acc=0;dir=next;let h={x:(s[0].x+dir.x+20)%20,y:(s[0].y+dir.y+14)%14};if(s.some((q,i)=>i>0&&q.x===h.x&&q.y===h.y)){status('Game Over');restart(starts.snake);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){sc++;score(sc);food={x:ri(0,19),y:ri(0,13)}}else s.pop()}x.clearRect(0,0,c.width,c.height);x.fillStyle='#0a1725';x.fillRect(0,0,c.width,c.height);const cw=c.width/20,ch=c.height/14;s.forEach((q,i)=>{x.fillStyle=i?'#31d158':'#8aff9b';rr(x,q.x*cw+3,q.y*ch+3,cw-6,ch-6,8);x.fill()});x.fillStyle='#ff375f';x.beginPath();x.arc(food.x*cw+cw/2,food.y*ch+ch/2,Math.min(cw,ch)*.28,0,Math.PI*2);x.fill();animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.perfect=()=>{gameEl.innerHTML='<div class="big">10.000</div><div class="muted">Stoppe so nah wie möglich bei 10 Sekunden.</div><div class="row" style="margin-top:18px"><button id="pstart" class="btn">Start</button><button id="pstop" class="btn secondary">Stop</button></div>';const b=gameEl.querySelector('.big'),a=document.getElementById('pstart'),z=document.getElementById('pstop');let on=false,t0=0;function loop(){if(on){b.textContent=((performance.now()-t0)/1000).toFixed(3);animationFrame=requestAnimationFrame(loop)}}a.onclick=()=>{on=true;t0=performance.now();status('Läuft…');cancelAnimationFrame(animationFrame);loop()};z.onclick=()=>{if(on){on=false;const v=(performance.now()-t0)/1000;const d=Math.abs(v-10);b.textContent=v.toFixed(3);score(Math.max(0,1000-Math.round(d*100)));status(d<.03?'Perfekt!':'Gestoppt');}};};
starts.reaction=()=>{const b=document.createElement('button');b.className='btn';b.style.cssText='font-size:32px;padding:70px 100px;border-radius:30px';b.textContent='Warten…';gameEl.appendChild(b);let ready=false,t0=0;status('Warte auf Grün…');let tid=setTimeout(()=>{ready=true;t0=performance.now();b.textContent='JETZT!';status('KLICK!')},ri(1200,3500));b.onclick=()=>{if(!ready){clearTimeout(tid);status('Zu früh!');restart(starts.reaction)}else{const ms=Math.round(performance.now()-t0);score(Math.max(0,1000-ms));b.textContent=ms+' ms';status('Reaktionszeit');restart(starts.reaction)}}};
starts.memory=()=>{const symbols=['🚀','🐍','⚡','🧠','🏀','🎲','🎯','🌈'];let arr=[...symbols,...symbols].sort(()=>Math.random()-.5),open=[],done=0;const g=document.createElement('div');g.className='cards';arr.forEach((s,i)=>{const b=document.createElement('button');b.className='mem';b.textContent='?';b.onclick=()=>{if(open.length>=2||b.dataset.done)return;b.textContent=s;open.push([i,b]);if(open.length===2){if(arr[open[0][0]]===arr[open[1][0]]){open.forEach(q=>q[1].dataset.done=1);done++;score(done);open=[];if(done===symbols.length){status('Gewonnen 🎉');restart(starts.memory)}}else setTimeout(()=>{open.forEach(q=>q[1].textContent='?');open=[]},650)}};g.appendChild(b)});gameEl.appendChild(g);status('Finde alle Paare')};
starts['2048']=()=>{let a=Array(16).fill(0);const board=document.createElement('div');board.className='board2048';function tile(v){const d=document.createElement('div');d.className='tile';d.textContent=v||'';if(v)d.style.background=['','#eee4da','#ede0c8','#f2b179','#f59563','#f67c5f','#f65e3b','#edcf72','#edcc61','#edc850','#edc53f'][Math.min(v/1,10)]||'#3cba92';return d}function draw(){board.innerHTML='';a.forEach(v=>board.appendChild(tile(v)));}function add(){const z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[ri(0,z.length-1)]]=2}function slide(row){let q=row.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;score(scoreElValue()+q[i]);q.splice(i+1,1)}while(q.length<4)q.push(0);return q}function scoreElValue(){return Number(scoreEl.textContent)||0}function move(d){let n=Array(16).fill(0);if(d==='left'||d==='right')for(let r=0;r<4;r++){let row=a.slice(r*4,r*4+4);if(d==='right')row.reverse();row=slide(row);if(d==='right')row.reverse();row.forEach((v,c)=>n[r*4+c]=v)}else for(let c=0;c<4;c++){let col=[a[c],a[c+4],a[c+8],a[c+12]];if(d==='down')col.reverse();col=slide(col);if(d==='down')col.reverse();col.forEach((v,r)=>n[r*4+c]=v)}a=n;add();draw()}add();add();draw();status('Wische oder nutze Pfeiltasten');let sx=0,sy=0;board.onpointerdown=e=>{const p=pos(board,e);sx=e.clientX;sy=e.clientY};board.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))};window.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key==='ArrowUp'?'up':'down')}};gameEl.appendChild(board)};
starts.brick=()=>{const [c,x]=canvas();let paddle=c.width/2,ball={x:c.width/2,y:c.height-70,vx:210,vy:-210,r:8},blocks=[],sc=0,last=performance.now(),life=3;for(let r=0;r<6;r++)for(let k=0;k<9;k++)blocks.push({x:10+k*((c.width-20)/9),y:35+r*30,w:(c.width-30)/9,h:22,live:true});c.onpointermove=e=>paddle=pos(c,e).x;function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r||ball.x>c.width-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy*=-1;if(ball.y>c.height+20){life--;if(life<=0){status('Game Over');restart(starts.brick);return}ball={x:paddle,y:c.height-70,vx:210*(Math.random()<.5?-1:1),vy:-210,r:8}}if(ball.y+ball.r>c.height-35&&ball.x>paddle-55&&ball.x<paddle+55){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-paddle)*2.5}for(const b of blocks)if(b.live&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.live=false;ball.vy*=-1;sc++;score(sc);break}x.clearRect(0,0,c.width,c.height);x.fillStyle='#0a1120';x.fillRect(0,0,c.width,c.height);blocks.filter(b=>b.live).forEach((b,i)=>{x.fillStyle=`hsl(${200+i*10},75%,58%)`;rr(x,b.x,b.y,b.w,b.h,6);x.fill()});x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.fillStyle='#7c3aed';rr(x,paddle-55,c.height-30,110,14,7);x.fill();if(!blocks.some(b=>b.live)){status('Gewonnen 🎉');restart(starts.brick);return}level('❤️'.repeat(life)+'🖤'.repeat(3-life));animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.tictactoe=()=>{let a=Array(9).fill('');let human='X',ai='O';const b=document.createElement('div');b.className='boardTTT';for(let i=0;i<9;i++){const q=document.createElement('button');q.className='ttt';q.onclick=()=>{if(a[i]||winner(a))return;a[i]=human;draw();if(winner(a)){status('Du gewinnst 🎉');restart(starts.tictactoe);return}if(a.every(Boolean)){status('Unentschieden');restart(starts.tictactoe);return}const m=best();a[m]=ai;draw();if(winner(a)){status('Computer gewinnt');restart(starts.tictactoe)}else if(a.every(Boolean)){status('Unentschieden');restart(starts.tictactoe)}};b.appendChild(q)}gameEl.appendChild(b);function draw(){[...b.children].forEach((q,i)=>q.textContent=a[i])}function winner(z){for(const p of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(z[p[0]]&&z[p[0]]===z[p[1]]&&z[p[1]]===z[p[2]])return z[p[0]];return ''}function mm(z,max){const w=winner(z);if(w==='O')return 1;if(w==='X')return -1;if(z.every(Boolean))return 0;let v=max?-9:9;for(let i=0;i<9;i++)if(!z[i]){z[i]=max?ai:human;const s=mm(z,!max);z[i]='';v=max?Math.max(v,s):Math.min(v,s)}return v}function best(){let bi=0,bv=-9;for(let i=0;i<9;i++)if(!a[i]){a[i]=ai;const s=mm(a,false);a[i]='';if(s>bv){bv=s;bi=i}}return bi}status('Du bist X');draw()};

starts.aimtrainer=()=>{const [c,x]=canvas();let sc=0,t0=performance.now(),target=null;const spawn=()=>target={x:ri(40,c.width-40),y:ri(40,c.height-40),r:ri(20,32)};spawn();c.onpointerdown=e=>{const p=pos(c,e);if(Math.hypot(p.x-target.x,p.y-target.y)<target.r){sc++;score(sc);spawn()}};function loop(now){const left=30-(now-t0)/1000;x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.05)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ff375f';x.beginPath();x.arc(target.x,target.y,target.r,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(target.x,target.y,target.r*.45,0,Math.PI*2);x.fill();x.fillStyle='#ff375f';x.beginPath();x.arc(target.x,target.y,target.r*.18,0,Math.PI*2);x.fill();level(Math.max(0,left).toFixed(1)+'s');if(left<=0){status('Zeit vorbei');restart(starts.aimtrainer);return}animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.laneracer=()=>{const [c,x]=canvas();let lane=1,cars=[],sc=0,sp=240,last=performance.now(),run=true;c.onpointerdown=e=>lane=clamp(Math.floor(pos(c,e).x/(c.width/3)),0,2);function loop(t){if(!run)return;const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.02)cars.push({lane:ri(0,2),y:-80,h:70});cars.forEach(q=>q.y+=sp*dt);for(let i=cars.length-1;i>=0;i--){const q=cars[i];if(q.y>c.height+20){cars.splice(i,1);sc++;score(sc);sp+=3}else if(q.lane===lane&&q.y+q.h>c.height-110&&q.y<c.height-20){status('Crash');restart(starts.laneracer);return}}x.clearRect(0,0,c.width,c.height);x.fillStyle='#171a22';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(255,255,255,.15)';x.setLineDash([30,30]);for(let i=1;i<3;i++){x.beginPath();x.moveTo(i*c.width/3,0);x.lineTo(i*c.width/3,c.height);x.stroke()}x.setLineDash([]);cars.forEach(q=>{x.fillStyle='#ff453a';rr(x,q.lane*c.width/3+c.width/6-28,q.y,56,q.h,12);x.fill()});x.fillStyle='#0a84ff';rr(x,lane*c.width/3+c.width/6-30,c.height-100,60,78,15);x.fill();level('Speed '+Math.round(sp));animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.helicave=()=>{const [c,x]=canvas();let y=c.height/2,vy=0,walls=[],dist=0,last=performance.now();const flap=()=>vy=-220;c.onpointerdown=flap;window.onkeydown=e=>{if(e.key==='ArrowUp'||e.key===' '){e.preventDefault();flap()}};function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;vy+=420*dt;y+=vy*dt;if(Math.random()<.018){const gap=175,mid=ri(110,c.height-110);walls.push({x:c.width+20,top:mid-gap/2,bottom:mid+gap/2,w:75})}walls.forEach(w=>w.x-=220*dt);for(const w of walls){if(w.x+w.w<0)continue;if(120+18>w.x&&120-18<w.x+w.w&&(y-14<w.top||y+14>w.bottom)){status('Absturz');restart(starts.helicave);return}}if(y<0||y>c.height){status('Absturz');restart(starts.helicave);return}x.clearRect(0,0,c.width,c.height);x.fillStyle='#08121d';x.fillRect(0,0,c.width,c.height);walls.forEach(w=>{x.fillStyle='#273244';x.fillRect(w.x,0,w.w,w.top);x.fillRect(w.x,w.bottom,w.w,c.height-w.bottom)});x.fillStyle='#7c3aed';x.beginPath();x.ellipse(120,y,25,15,0,0,Math.PI*2);x.fill();x.fillStyle='#c4b5fd';x.fillRect(104,y-22,32,4);dist+=dt*20;score(Math.floor(dist));level(Math.floor(dist)+'m');animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.fishdash=()=>{const [c,x]=canvas();let fy=c.height/2,objs=[],sc=0,sp=190,last=performance.now();c.onpointermove=e=>fy=clamp(pos(c,e).y,30,c.height-30);c.onpointerdown=c.onpointermove;function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.03)objs.push({x:c.width+20,y:ri(30,c.height-30),good:Math.random()<.75,r:Math.random()<.75?11:18});objs.forEach(o=>o.x-=sp*dt);for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(Math.hypot(o.x-120,o.y-fy)<o.r+18){if(o.good){sc++;score(sc)}else{status('Mine!');restart(starts.fishdash);return}objs.splice(i,1)}}x.clearRect(0,0,c.width,c.height);x.fillStyle='#05324b';x.fillRect(0,0,c.width,c.height);objs.forEach(o=>{x.fillStyle=o.good?'#5de4ff':'#ff375f';x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()});x.fillStyle='#ff9f0a';x.beginPath();x.ellipse(120,fy,28,16,0,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(130,fy-5,4,0,Math.PI*2);x.fill();animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.basketshot=()=>{const [c,x]=canvas();let ball={x:100,y:c.height-60},drag=false,sx=0,sy=0,vx=0,vy=0,fly=false,sc=0;function reset(){ball={x:100,y:c.height-60};vx=vy=0;fly=false}c.onpointerdown=e=>{if(fly)return;const p=pos(c,e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<45){drag=true;sx=p.x;sy=p.y}};c.onpointermove=e=>{if(drag){const p=pos(c,e);ball.x=p.x;ball.y=p.y}};c.onpointerup=e=>{if(!drag)return;const p=pos(c,e);vx=(sx-p.x)*3;vy=(sy-p.y)*3;drag=false;fly=true};function loop(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#78b8ff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#59a84b';x.fillRect(0,c.height-85,c.width,85);const hx=c.width*.72,hy=c.height*.36;x.strokeStyle='#ff4d00';x.lineWidth=8;x.beginPath();x.arc(hx,hy,30,0,Math.PI*2);x.stroke();x.strokeStyle='#8b4a21';x.beginPath();x.moveTo(hx+30,hy);x.lineTo(hx+30,hy+120);x.stroke();if(fly){vy+=9;ball.x+=vx/60;ball.y+=vy/60;if(Math.hypot(ball.x-hx,ball.y-hy)<30){sc++;score(sc);status('Korb!');reset()}if(ball.y>c.height+50||ball.x>c.width+50)reset()}x.fillStyle='#ff9f0a';x.beginPath();x.arc(ball.x,ball.y,18,0,Math.PI*2);x.fill();animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
starts.goalkeeper=()=>{const [c,x]=canvas();let keeper=c.width/2,shot=null,shots=10,saved=0,cool=0;c.onpointerdown=e=>keeper=pos(c,e).x;function newShot(){shot={target:ri(0,2),p:0}}newShot();function loop(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#218c43';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#fff';x.strokeRect(30,30,c.width-60,c.height-50);x.fillStyle='#ffd60a';x.beginPath();x.arc(keeper,c.height-100,28,0,Math.PI*2);x.fill();if(shot){shot.p+=.02;const tx=[c.width*.25,c.width*.5,c.width*.75][shot.target];const bx=c.width*.5+(tx-c.width*.5)*shot.p,by=70+(c.height-170)*shot.p;x.fillStyle='#fff';x.beginPath();x.arc(bx,by,12,0,Math.PI*2);x.fill();if(shot.p>=1){const kz=keeper<c.width/3?0:keeper<c.width*2/3?1:2;if(kz===shot.target)saved++;shots--;score(saved);level(shots+' Schüsse');shot=null;cool=20}}else{cool--;if(cool<=0)newShot()}if(shots<=0){status('Fertig');restart(starts.goalkeeper);return}animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop);status('Halte links, mitte oder rechts')};
starts.neonrunner=()=>{const [c,x]=canvas();let py=c.height-50,vy=0,obs=[],sc=0,sp=260,last=performance.now();const jump=()=>{if(py>=c.height-50){vy=-520}};c.onpointerdown=jump;window.onkeydown=e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}};function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.02)obs.push({x:c.width+20,w:ri(25,42),h:ri(38,80)});vy+=1400*dt;py+=vy*dt;if(py>c.height-50){py=c.height-50;vy=0}obs.forEach(o=>o.x-=sp*dt);for(let i=obs.length-1;i>=0;i--){const o=obs[i];if(o.x+o.w<0){obs.splice(i,1);sc++;score(sc)}if(o.x<140&&o.x+o.w>100&&py>c.height-50-o.h){status('Crash');restart(starts.neonrunner);return}}x.clearRect(0,0,c.width,c.height);x.fillStyle='#171033';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ff2bd6';obs.forEach(o=>x.fillRect(o.x,c.height-50-o.h,o.w,o.h));x.fillStyle='#30d5ff';rr(x,100,py-40,40,40,10);x.fill();level('Speed '+Math.round(sp));animationFrame=requestAnimationFrame(loop)}animationFrame=requestAnimationFrame(loop)};
