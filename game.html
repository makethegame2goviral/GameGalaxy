<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>GameGalaxy – Spiel</title>
<style>
:root{--bg:#050814;--panel:#0d1627;--panel2:#101b30;--text:#f7faff;--muted:#92a5bf;--line:rgba(255,255,255,.09);--a:#7c5cff;--b:#19d8ff;--good:#43e184;--danger:#ff5277;--shadow:0 24px 80px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,#26376d 0,transparent 35%),radial-gradient(circle at 100% 0,#123b58 0,transparent 30%),linear-gradient(160deg,#080b15,#050814 70%,#03050b);color:#fff}body{padding:10px;overflow-x:hidden;transition:filter .5s}.shell{max-width:1320px;margin:auto}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}.logo{font-size:23px;font-weight:950;letter-spacing:-.8px}.logo span{color:var(--b)}.spacer{flex:1}.btn{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 15px;color:#fff;background:linear-gradient(135deg,#785dfb,#5c41d6);font-weight:900;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(108,92,231,.22)}.btn.secondary{background:#10182a}.btn.danger{background:#60162b}.panel{border:1px solid var(--line);border-radius:28px;padding:18px;background:linear-gradient(180deg,rgba(17,27,46,.94),rgba(8,14,26,.97));box-shadow:var(--shadow);overflow:hidden}.topRow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.title{margin:0;font-size:clamp(27px,4vw,40px);line-height:1.04;letter-spacing:-1px}.muted{color:var(--muted)}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 9px}.stat{padding:9px 12px;border:1px solid var(--line);border-radius:13px;background:#091120;color:#aebbd0}.stat b{color:#fff}.levelBar{width:min(720px,100%);height:11px;border-radius:999px;background:#081120;overflow:hidden;border:1px solid var(--line);margin:8px 0 16px}.levelFill{height:100%;width:10%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}.zone{min-height:590px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.canvas{display:block;width:min(1100px,100%);border-radius:22px;border:1px solid var(--line);background:#07101a;box-shadow:0 18px 60px rgba(0,0,0,.2);touch-action:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}.big{font-size:clamp(52px,9vw,92px);font-weight:1000;line-height:1;margin:12px 0}.input{width:min(450px,100%);padding:15px 16px;border-radius:15px;border:1px solid var(--line);background:#081120;color:#fff;font-size:22px;text-align:center;outline:0;margin:8px 0}.choice{border:1px solid var(--line);background:#121d32;color:#fff;border-radius:15px;padding:14px 18px;font-weight:900;cursor:pointer}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(430px,100%)}.tile{aspect-ratio:1;border:1px solid var(--line);border-radius:13px;background:#101a2d;color:#fff;font-size:25px;font-weight:900;cursor:pointer}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(520px,100%)}.memory button{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;background:#13203a;color:#fff;font-size:30px;font-weight:900;cursor:pointer}.board2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(430px,100%);padding:8px;background:#8d7252;border-radius:18px}.t2048{aspect-ratio:1;border-radius:10px;background:#cdbda5;color:#241a12;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:950}.ttt{display:grid;grid-template-columns:repeat(3,100px);gap:8px}.ttt button{width:100px;height:100px;border:1px solid var(--line);border-radius:17px;background:#111d32;color:#fff;font-size:55px;font-weight:950;cursor:pointer}.connect4{display:grid;grid-template-columns:repeat(7,52px);gap:6px;background:#1556bb;padding:9px;border-radius:18px}.connect4 button{width:52px;height:52px;border:0;border-radius:50%;background:#07142b;cursor:pointer}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.68);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px}.modal.hidden{display:none}.box{width:min(600px,100%);max-height:85vh;overflow:auto;background:#0c1424;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.field{width:100%;padding:13px 14px;margin:7px 0 10px;border:1px solid var(--line);border-radius:14px;background:#081120;color:#fff}.notice{padding:12px 14px;border-radius:14px;background:#091120;color:#a9b8cc;font-size:13px}.leader{display:grid;gap:7px}.leaderRow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#091321}.codeList{display:grid;gap:8px}.codeRow{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#091321}.codeRow code{color:#8eeeff;font-weight:900}.shakeY{animation:shakeY .7s ease-in-out 2}.rainbowMode{background:linear-gradient(120deg,#ff3158,#ff9f0a,#ffe600,#2fe477,#19d8ff,#7c5cff,#ff3bd4,#ff3158);background-size:900% 900%;animation:rainbowBg 9s linear infinite}.secretLayer{position:fixed;inset:0;z-index:2500;pointer-events:none;overflow:hidden}.s67{position:absolute;bottom:-100px;font-weight:1000;text-shadow:0 0 22px currentColor;animation:rise67 2.25s cubic-bezier(.15,.75,.2,1) forwards}.razor{position:absolute;left:50%;bottom:-150px;transform:translateX(-50%);font-size:min(22vw,150px);animation:razorRise 3.2s ease-in-out forwards}.tnt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(25vw,180px);animation:tntBlast 1.7s ease-in-out forwards}.pixel{position:absolute;width:12px;height:12px;animation:pixelFall 1.8s linear forwards}.foot{position:absolute;bottom:20%;font-size:54px;animation:moonWalk 3.2s linear forwards}.indiePiece{position:absolute;font-size:38px;animation:indieFloat 2s ease-in-out infinite}.secretText{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,9vw,110px);font-weight:1000;text-align:center}@keyframes rise67{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-115vh) rotate(12deg);opacity:0}}@keyframes shakeY{0%,100%{transform:translateY(0)}25%{transform:translateY(-28px)}50%{transform:translateY(28px)}75%{transform:translateY(-18px)}}@keyframes razorRise{0%{transform:translate(-50%,30vh) rotate(-18deg)}50%{transform:translate(-50%,-18vh) rotate(12deg)}100%{transform:translate(-50%,-125vh) rotate(-10deg)}}@keyframes tntBlast{0%{transform:translate(-50%,-50%) scale(.7)}55%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(3.6);opacity:0}}@keyframes pixelFall{to{transform:translateY(120vh) rotate(360deg);opacity:0}}@keyframes moonWalk{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}@keyframes indieFloat{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-30px) rotate(7deg)}}@keyframes rainbowBg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:760px){body{padding:7px}.panel{padding:12px;border-radius:22px}.zone{min-height:540px}.ttt{grid-template-columns:repeat(3,82px)}.ttt button{width:82px;height:82px;font-size:44px}.connect4{grid-template-columns:repeat(7,40px)}.connect4 button{width:40px;height:40px}}
</style>
</head>
<body>
<div class="shell"><div class="bar"><button class="btn secondary" id="homeBtn">← Startseite</button><div class="logo">Game<span>Galaxy</span> 🚀</div><div class="spacer"></div><button class="btn secondary" id="leaderBtn">🏆 Rangliste</button><button class="btn secondary" id="codeBtn">🔐 Codes</button><button class="btn secondary" id="fullBtn">⛶ Vollbild</button><button class="btn secondary" id="soundBtn">🔊 Sound</button><button class="btn secondary" id="authBtn">👤 Anmelden</button></div>
<section class="panel"><div class="topRow"><div><h1 class="title" id="title">GameGalaxy</h1><div class="muted" id="desc"></div></div><div class="muted" id="userOut"></div></div><div class="stats"><div class="stat">Score <b id="score">0</b></div><div class="stat">Level <b id="level">1</b></div><div class="stat">XP <b id="xp">0</b></div><div class="stat">Bestwert <b id="best">0</b></div><div class="stat" id="status">Bereit</div></div><div class="levelBar"><div class="levelFill" id="levelFill"></div></div><div class="zone" id="zone"></div></section></div>
<div class="modal hidden" id="modal"><div class="box" id="box"></div></div>
<script>
const G=[
{id:'galaxy',name:'Galaxy Blaster',icon:'🚀',cat:'Arcade'},{id:'snake',name:'Snake',icon:'🐍',cat:'Classic'},{id:'perfect',name:'Perfect Time',icon:'⏱️',cat:'Skill'},{id:'reaction',name:'Reaction Rush',icon:'⚡',cat:'Speed'},{id:'memory',name:'Memory',icon:'🧠',cat:'Brain'},{id:'2048',name:'2048',icon:'🔢',cat:'Puzzle'},{id:'brick',name:'Brick Blast',icon:'🧱',cat:'Arcade'},{id:'tictactoe',name:'Tic-Tac-Toe',icon:'⭕',cat:'Strategy'},{id:'pong',name:'Pong',icon:'🏓',cat:'Classic'},{id:'flappy',name:'Flappy Sky',icon:'🐦',cat:'Skill'},{id:'lightsout',name:'Lights Out',icon:'💡',cat:'Puzzle'},{id:'colormatch',name:'Color Match',icon:'🎨',cat:'Speed'},{id:'whack',name:'Whack Spot',icon:'🔨',cat:'Skill'},{id:'connect4',name:'Vier Gewinnt',icon:'🟡',cat:'Strategy'},{id:'simon',name:'Simon',icon:'🔊',cat:'Memory'},{id:'higherlower',name:'Higher or Lower',icon:'🃏',cat:'Cards'},{id:'quickmath',name:'Quick Math',icon:'🧮',cat:'Math'},{id:'coincatch',name:'Coin Catch',icon:'🪙',cat:'Arcade'},{id:'safetiles',name:'Safe Tiles',icon:'💣',cat:'Memory'},{id:'connectdots',name:'Connect Dots',icon:'🔵',cat:'Speed'},{id:'guessnumber',name:'Guess the Number',icon:'🔢',cat:'Brain'},{id:'diceduel',name:'Dice Duel',icon:'🎲',cat:'Dice'},{id:'oddoneout',name:'Odd One Out',icon:'🟣',cat:'Speed'},{id:'numbersprint',name:'Number Sprint',icon:'🔢',cat:'Speed'},{id:'holdmeter',name:'Hold Meter',icon:'💪',cat:'Skill'},{id:'wordscramble',name:'Word Scramble',icon:'🔤',cat:'Words'},{id:'aimtrainer',name:'Aim Trainer',icon:'🎯',cat:'Skill'},{id:'laneracer',name:'Lane Racer',icon:'🏎️',cat:'Racing'},{id:'helicave',name:'Heli Cave',icon:'🚁',cat:'Arcade'},{id:'fishdash',name:'Fish Dash',icon:'🐟',cat:'Arcade'},{id:'basketshot',name:'Basket Shot',icon:'🏀',cat:'Sports'},{id:'goalkeeper',name:'Goal Keeper',icon:'🥅',cat:'Sports'},{id:'neonrunner',name:'Neon Runner',icon:'🏃',cat:'Runner'}];
const params=new URLSearchParams(location.search),gameId=params.get('game')||'galaxy',meta=G.find(g=>g.id===gameId)||G[0];document.title='GameGalaxy – '+meta.name;document.getElementById('title').textContent=meta.icon+' '+meta.name;document.getElementById('desc').textContent=meta.cat;
const zone=document.getElementById('zone'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),xpEl=document.getElementById('xp'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),levelFill=document.getElementById('levelFill');let raf=0,timers=new Set(),ended=false,sound=true,audioCtx=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,rand=(a,b)=>Math.random()*(b-a)+a;
function totalXP(){return Number(localStorage.getItem('gg_xp')||0)}function playerLevel(){return Math.floor(totalXP()/250)+1}function beep(freq=520,dur=.06,type='sine'){if(!sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}}
function updateHUD(){levelEl.textContent=playerLevel();xpEl.textContent=totalXP();const rel=(totalXP()%250)/250;levelFill.style.width=Math.max(7,rel*100)+'%'}function addXP(n){const before=playerLevel(),next=totalXP()+Math.max(1,Math.floor(n));localStorage.setItem('gg_xp',next);updateHUD();if(playerLevel()>before)levelUp(playerLevel())}
function levelUp(l){const e=document.createElement('div');e.className='secretLayer';e.innerHTML='<div class="secretText">✨ LEVEL UP<br><span style="font-size:.45em">LEVEL '+l+'</span></div>';document.body.appendChild(e);beep(880,.12,'triangle');setTimeout(()=>e.remove(),1600)}
function bestKey(){return'gg_best_'+gameId}function saveBest(score){const key=bestKey(),old=Number(localStorage.getItem(key)||0);if(score>old){localStorage.setItem(key,String(score));bestEl.textContent=String(score)}}
function lbKey(){return'gg_lb_'+gameId}function saveLeader(score){if(score<=0)return;const name=localStorage.getItem('gg_user')||'Gast';let arr=JSON.parse(localStorage.getItem(lbKey())||'[]');arr.push({name,score});arr.sort((a,b)=>b.score-a.score);arr=arr.slice(0,30);localStorage.setItem(lbKey(),JSON.stringify(arr))}
function finish(score,msg){if(ended)return;ended=true;cancelAnimationFrame(raf);for(const t of timers)clearTimeout(t);timers.clear();score=Math.max(0,Math.floor(score||0));scoreEl.textContent=String(score);saveBest(score);saveLeader(score);addXP(Math.max(10,Math.floor(score*.8)+20));statusEl.textContent=msg;beep(760,.08,'triangle');showEndButtons()}
function showEndButtons(){zone.querySelectorAll('.endTools').forEach(e=>e.remove());const wrap=document.createElement('div');wrap.className='endTools row';wrap.innerHTML='<button class="btn" id="again">↻ Nochmal</button><button class="btn secondary" id="rank">🏆 Rangliste</button>';zone.appendChild(wrap);document.getElementById('again').onclick=()=>boot(gameId);document.getElementById('rank').onclick=showLeaderboard}
function setScore(v){scoreEl.textContent=String(Math.max(0,Math.floor(v)))}function setStatus(v){statusEl.textContent=v}function setLevel(v){levelEl.textContent=String(v)}
function timer(fn,ms){const t=setTimeout(()=>{timers.delete(t);fn()},ms);timers.add(t);return t}function clearGame(){cancelAnimationFrame(raf);for(const t of timers)clearTimeout(t);timers.clear();window.onkeydown=null;ended=false;zone.innerHTML=''}
function makeCanvas(){const c=document.createElement('canvas'),w=Math.min(1100,Math.max(320,innerWidth-35)),h=Math.min(650,Math.max(380,Math.round(w*.56))),d=Math.min(2,devicePixelRatio||1);c.width=Math.floor(w*d);c.height=Math.floor(h*d);c.style.width=w+'px';c.style.height=h+'px';c.className='canvas';const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);zone.appendChild(c);return {c,x,w,h}}
function ptr(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.clientWidth/r.width,y:(e.clientY-r.top)*c.clientHeight/r.height}}
function roundRect(x,cx,x0,y,w,h,r,fill){cx.beginPath();cx.moveTo(x0+r,y);cx.arcTo(x0+w,y,x0+w,y+h,r);cx.arcTo(x0+w,y+h,x0,y+h,r);cx.arcTo(x0,y+h,x0,y,r);cx.arcTo(x0,y,x0+w,y,r);cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}}
function btn(text,fn,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=fn;zone.appendChild(b);return b}
function setupGame(){clearGame();updateHUD();bestEl.textContent=localStorage.getItem(bestKey())||'0';setStatus('Bereit')}
function full(){if(document.fullscreenElement){document.exitFullscreen?.();return}document.documentElement.requestFullscreen?.()}
async function hash(v){const data=new TextEncoder().encode(v),buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function modal(html){document.getElementById('box').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function close(){document.getElementById('modal').classList.add('hidden')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')close()};
async function auth(create){const n=document.getElementById('an').value.trim(),p=document.getElementById('ap').value;if(!n||p.length<3){alert('Bitte Name + mindestens 3 Zeichen Passwort.');return}const k='gg_acc_'+n.toLowerCase(),h=await hash(p);if(create&&localStorage.getItem(k)){alert('Name ist schon angelegt.');return}if(!create&&localStorage.getItem(k)!==h){alert('Name oder Passwort falsch.');return}localStorage.setItem(k,h);localStorage.setItem('gg_user',n);close();refreshUser()}
function showAuth(){const u=localStorage.getItem('gg_user');if(u){modal(`<h3>👤 ${u}</h3><p class="notice">Lokaler GameGalaxy-Account.<br>Level ${playerLevel()} • XP ${totalXP()}</p><div class="row"><button class="btn danger" id="logout">Abmelden</button><button class="btn secondary" id="close">Schließen</button></div>`);document.getElementById('logout').onclick=()=>{localStorage.removeItem('gg_user');close();refreshUser()};document.getElementById('close').onclick=close;return}modal('<h3>👤 Anmelden</h3><p class="notice">Mit deinem Namen werden deine Scores in den lokalen Ranglisten gespeichert.</p><input id="an" class="field" placeholder="Name"><input id="ap" class="field" type="password" placeholder="Passwort"><div class="row"><button class="btn" id="create">Konto erstellen</button><button class="btn secondary" id="login">Anmelden</button></div><button class="btn ghost" id="close" style="margin-top:8px">Schließen</button>');document.getElementById('create').onclick=()=>auth(true);document.getElementById('login').onclick=()=>auth(false);document.getElementById('close').onclick=close}
function refreshUser(){document.getElementById('userOut').textContent=localStorage.getItem('gg_user')?'👤 '+localStorage.getItem('gg_user'):'';document.getElementById('authBtn').textContent=localStorage.getItem('gg_user')?'👤 '+localStorage.getItem('gg_user'):'👤 Anmelden';document.getElementById('authBtn').onclick=showAuth}
function showLeaderboard(){const arr=JSON.parse(localStorage.getItem(lbKey())||'[]').sort((a,b)=>b.score-a.score).slice(0,10);modal(`<h3>🏆 Rangliste – ${meta.name}</h3>${arr.length?`<div class="leader">${arr.map((x,i)=>`<div class="leaderRow"><b>#${i+1}</b><span>${String(x.name).replace(/[&<>"']/g,'')}</span><strong>${x.score}</strong></div>`).join('')}</div>`:'<p class="notice">Noch keine Scores auf diesem Gerät.</p>'}<p class="notice" style="margin-top:10px">Die Version auf GitHub Pages speichert die Rangliste lokal im Browser. Für eine echte gemeinsame Online-Rangliste braucht GameGalaxy einen Server.</p><button class="btn secondary" id="close">Schließen</button>`);document.getElementById('close').onclick=close}
const CODE_INFO={'6 7':'Vertikaler 6/7-Boost: unten → oben','low taper fade':'Rasierer fährt langsam unten → oben','minecraft':'TNT + Explosion','yusufcreater':'Zeigt alle Codes','galaxyghost':'Geister-Sternenmodus','neonparty':'Neon-Party','pixelstorm':'Pixelregen','moonwalk':'Mond + Fußspuren','rainbow':'Rainbow an/aus','indiebox':'Retro-Indie-Box'};
function normCode(v){return v.trim().toLowerCase().replace(/\s+/g,' ')}
function showCodes(){modal(`<h3>🔐 Secret-Codes</h3><div class="codeList">${Object.entries(CODE_INFO).map(([c,d])=>`<div class="codeRow"><code>${c}</code><span>${d}</span></div>`).join('')}</div><p class="notice">Code eingeben und Enter drücken.</p><button class="btn secondary" id="close">Schließen</button>`);document.getElementById('close').onclick=close}
function secret(raw){let code=normCode(raw);if(code==='six seven'||code==='sex seven')code='6 7';if(!CODE_INFO[code])return false;if(code==='yusufcreater'){showCodes();return true}const layer=document.createElement('div');layer.className='secretLayer';document.body.appendChild(layer);if(code==='rainbow'){const on=document.body.classList.toggle('rainbowMode');const t=document.createElement('div');t.className='secretText';t.textContent=on?'🌈 RAINBOW ON':'🌈 RAINBOW OFF';layer.appendChild(t);setTimeout(()=>layer.remove(),1400);return true}if(code==='6 7'){document.body.classList.add('shakeY');for(let i=0;i<8;i++){const e=document.createElement('div');e.className='s67';e.textContent=i%2?'7':'6';e.style.left=(7+i*12)+'%';e.style.color=i%2?'#19d8ff':'#7c5cff';e.style.fontSize=(42+i*4)+'px';e.style.animationDelay=(i*.08)+'s';layer.appendChild(e)}timer(()=>{document.body.classList.remove('shakeY');layer.remove()},2350);return true}if(code==='low taper fade'){const e=document.createElement('div');e.className='razor';e.textContent='🪒';layer.appendChild(e);timer(()=>layer.remove(),3300);return true}if(code==='minecraft'){const e=document.createElement('div');e.className='tnt';e.textContent='🧨';layer.appendChild(e);timer(()=>{e.textContent='💥';e.style.animation='none';e.style.transform='translate(-50%,-50%) scale(2.8)'},850);timer(()=>layer.remove(),1700);return true}if(code==='galaxyghost'){const t=document.createElement('div');t.className='secretText';t.textContent='👻 GALAXY GHOST';layer.appendChild(t);for(let i=0;i<55;i++){const e=document.createElement('div');e.className='pixel';e.textContent='✦';e.style.left=rand(0,100)+'%';e.style.top=rand(0,40)+'%';e.style.color='#c7b7ff';e.style.background='transparent';e.style.animationDelay=rand(0,1.2)+'s';layer.appendChild(e)}timer(()=>layer.remove(),2500);return true}if(code==='neonparty'){const t=document.createElement('div');t.className='secretText';t.textContent='🪩 NEON PARTY';layer.appendChild(t);document.body.animate([{filter:'hue-rotate(0deg) saturate(1)'},{filter:'hue-rotate(180deg) saturate(2)'},{filter:'hue-rotate(360deg) saturate(1)'}],{duration:1800});timer(()=>layer.remove(),1900);return true}if(code==='pixelstorm'){for(let i=0;i<90;i++){const e=document.createElement('div');e.className='pixel';e.style.left=rand(0,100)+'%';e.style.top='-20px';e.style.background=['#19d8ff','#7c5cff','#ff5277','#43e184','#ffd60a'][i%5];e.style.animationDelay=rand(0,.9)+'s';layer.appendChild(e)}timer(()=>layer.remove(),2600);return true}if(code==='moonwalk'){const t=document.createElement('div');t.className='secretText';t.textContent='🌙 MOONWALK';layer.appendChild(t);for(let i=0;i<10;i++){const e=document.createElement('div');e.className='foot';e.textContent='👣';e.style.left=(-10+i*11)+'%';e.style.animationDelay=(i*.14)+'s';layer.appendChild(e)}timer(()=>layer.remove(),3500);return true}if(code==='indiebox'){const t=document.createElement('div');t.className='secretText';t.innerHTML='📦<br><span style="font-size:.38em;color:#8eeeff">INDIE BOX</span>';layer.appendChild(t);['🎮','🕹️','👾','💿','⭐','🧩','⚡','🌟'].forEach((v,i)=>{const e=document.createElement('div');e.className='indiePiece';e.textContent=v;e.style.left=(7+i*11)+'%';e.style.top=(18+(i%4)*18)+'%';e.style.animationDelay=(i*.12)+'s';layer.appendChild(e)});timer(()=>layer.remove(),2800);return true}return true}

function startGalaxy(){setupGame();const {c,x,w,h}=makeCanvas();let ship=w/2,bul=[],en=[],score=0,last=performance.now(),spawn=0,fire=0,bombs=3;c.onpointermove=e=>ship=clamp(ptr(c,e).x,35,w-35);c.onpointerdown=e=>ship=clamp(ptr(c,e).x,35,w-35);window.onkeydown=e=>{if(e.key==='ArrowLeft')ship=clamp(ship-42,35,w-35);if(e.key==='ArrowRight')ship=clamp(ship+42,35,w-35);if(e.code==='Space'&&bombs){e.preventDefault();bombs--;en=[];beep(120,.1,'square')}};function loop(t){if(ended)return;const dt=Math.min(.03,(t-last)/1000);last=t;fire+=dt;spawn+=dt;if(fire>.18){fire=0;bul.push({x:ship,y:h-70})}const gap=Math.max(.28,.95-playerLevel()*.035);if(spawn>gap){spawn=0;en.push({x:ri(25,w-25),y:-25,r:ri(15,25),v:90+playerLevel()*8})}x.clearRect(0,0,w,h);x.fillStyle='#050a18';x.fillRect(0,0,w,h);for(let i=0;i<45;i++){x.fillStyle='rgba(255,255,255,.35)';x.fillRect((i*97)%w,(i*53+t*.02)%h,2,2)}bul.forEach(b=>b.y-=530*dt);bul=bul.filter(b=>b.y>-20);for(let i=en.length-1;i>=0;i--){const e=en[i];e.y+=e.v*dt;for(let j=bul.length-1;j>=0;j--)if(Math.hypot(e.x-bul[j].x,e.y-bul[j].y)<e.r+7){en.splice(i,1);bul.splice(j,1);score++;break}if(en[i]&&en[i].y>h+30)en.splice(i,1)}for(const b of bul){x.fillStyle='#19d8ff';x.fillRect(b.x-2,b.y-11,4,22)}for(const e of en){x.fillStyle='#ff5277';x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill()}x.fillStyle='#7c5cff';x.beginPath();x.moveTo(ship,h-95);x.lineTo(ship-27,h-45);x.lineTo(ship,h-57);x.lineTo(ship+27,h-45);x.closePath();x.fill();x.fillStyle='#19d8ff';x.fillRect(ship-5,h-45,10,16);setScore(score);setLevel(Math.floor(score/10)+1);setStatus('💣 '+bombs+' • Auto-Fire');if(en.some(e=>e.y>h-115&&Math.abs(e.x-ship)<28)){finish(score,'Treffer 💥');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startSnake(){setupGame();const {c,x,w,h}=makeCanvas(),cell=24,cols=Math.floor(w/cell),rows=Math.floor((h-12)/cell);let snake,dir={x:1,y:0},next={x:1,y:0},food,score=0,last=0,acc=0;function reset(){snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)}];for(let i=1;i<4;i++)snake.push({x:snake[0].x-i,y:snake[0].y});food={x:ri(0,cols-1),y:ri(0,rows-1)}}function turn(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy};beep(340,.02)}reset();c.onpointerdown=e=>{const p=ptr(c,e),dx=p.x-w/2,dy=p.y-h/2;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))};window.onkeydown=e=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(k)turn(k[0],k[1])};function loop(t){if(!last)last=t;acc+=(t-last)/1000;last=t;const tick=Math.max(.06,.145-playerLevel()*.004);while(acc>=tick){acc-=tick;dir=next;const head={x:(snake[0].x+dir.x+cols)%cols,y:(snake[0].y+dir.y+rows)%rows};if(snake.some((s,i)=>i>0&&s.x===head.x&&s.y===head.y)){finish(score,'Game Over');return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;food={x:ri(0,cols-1),y:ri(0,rows-1)}}else snake.pop()}x.clearRect(0,0,w,h);x.fillStyle='#071119';x.fillRect(0,0,w,h);for(const s of snake){x.fillStyle='#43e184';roundRect(null,x,s.x*cell+2,s.y*cell+2,cell-4,cell-4,7,true)}x.fillStyle='#ff5277';x.beginPath();x.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.3,0,Math.PI*2);x.fill();setScore(score);setLevel(Math.floor(score/5)+1);setStatus('Wischen: ↑ ↓ ← →');raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startPerfect(){setupGame();zone.innerHTML='<div class="big" id="clock">0.000</div><p class="muted">Ziel: exakt 10.000 Sekunden</p><div class="row"><button class="btn" id="go">▶ Start</button><button class="btn secondary" id="stop">■ Stop</button></div>';codeInput(zone);let running=false,t0=0;function tick(){if(!running)return;document.getElementById('clock').textContent=((performance.now()-t0)/1000).toFixed(3);raf=requestAnimationFrame(tick)}document.getElementById('go').onclick=()=>{if(running)return;running=true;t0=performance.now();setStatus('Läuft…');tick()};document.getElementById('stop').onclick=()=>{if(!running)return;running=false;cancelAnimationFrame(raf);const s=(performance.now()-t0)/1000,sc=Math.max(0,10000-Math.round(Math.abs(s-10)*1000));finish(sc,s.toFixed(3)+' s • '+Math.round(Math.abs(s-10)*1000)+' ms daneben')}}

function startMemory(){setupGame();const sy=['🚀','🐍','🧠','🎯','🏀','🐟','⚡','🌈'],deck=[...sy,...sy].sort(()=>Math.random()-.5);zone.innerHTML='<div class="memory" id="mem"></div>';const g=document.getElementById('mem');let open=[],matched=0,moves=0;deck.forEach((s,i)=>{const b=document.createElement('button');b.textContent='?';g.appendChild(b);b.onclick=()=>{if(b.disabled||open.length===2||open.some(o=>o.i===i))return;b.textContent=s;open.push({i,s,b});if(open.length===2){moves++;if(open[0].s===open[1].s){open.forEach(o=>o.b.disabled=true);matched+=2;setScore(matched/2);open=[];if(matched===deck.length)finish(Math.max(1,120-moves),'Alle Paare!')}else timer(()=>{open.forEach(o=>o.b.textContent='?');open=[]},550)}}});setStatus('Finde alle Paare');codeInput(zone)}
function start2048(){setupGame();const a=Array(16).fill(0);let score=0;zone.innerHTML='<div class="board2048" id="b2048"></div>';const b=document.getElementById('b2048');function add(){const e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[ri(0,e.length-1)]]=Math.random()<.9?2:4}function render(){b.innerHTML=a.map(v=>`<div class="t2048">${v||''}</div>`).join('');setScore(score);setLevel(Math.floor(score/500)+1)}function move(dir){let changed=false;const go=line=>{let x=dir==='right'||dir==='down'?line.reverse():line;x=x.filter(Boolean);for(let i=0;i<x.length-1;i++)if(x[i]===x[i+1]){x[i]*=2;score+=x[i];x.splice(i+1,1)}while(x.length<4)x.push(0);return dir==='right'||dir==='down'?x.reverse():x};for(let r=0;r<4;r++){let line;if(dir==='left'||dir==='right')line=a.slice(r*4,r*4+4);else line=[a[r],a[r+4],a[r+8],a[r+12]];const out=go(line);for(let i=0;i<4;i++){const idx=dir==='left'||dir==='right'?r*4+i:i*4+r;if(a[idx]!==out[i])changed=true;a[idx]=out[i]}}if(changed){add();render();if(a.some(v=>v>=2048))finish(score,'2048 geschafft!')}}add();add();render();let sx=0,sy=0;zone.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};zone.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};window.onkeydown=e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}};setStatus('Wische oder Pfeile');codeInput(zone)}
function startBrick(){setupGame();const {c,x,w,h}=makeCanvas();let paddle=w/2,bx=w/2,by=h-60,vx=230,vy=-240,last=performance.now(),score=0,lives=3,bricks=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:16+col*(w-32)/10,y:30+r*30,w:(w-42)/10,h:22,on:1});c.onpointermove=e=>paddle=clamp(ptr(c,e).x,60,w-60);function loop(t){const dt=Math.min(.025,(t-last)/1000);last=t;bx+=vx*dt;by+=vy*dt;if(bx<8||bx>w-8)vx*=-1;if(by<8)vy*=-1;if(by>h-55&&vy>0&&Math.abs(bx-paddle)<75)vy=-Math.abs(vy);if(by>h+20){lives--;if(lives<=0){finish(score,'Alle Bälle verloren');return}bx=paddle;by=h-60;vy=-240}for(const br of bricks)if(br.on&&bx>br.x&&bx<br.x+br.w&&by>br.y&&by<br.y+br.h){br.on=0;vy*=-1;score++;break}x.clearRect(0,0,w,h);for(const br of bricks)if(br.on){x.fillStyle='#7c5cff';roundRect(null,x,br.x,br.y,br.w,br.h,7,true)}x.fillStyle='#19d8ff';roundRect(null,x,paddle-55,h-28,110,15,8,true);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,7,0,Math.PI*2);x.fill();setScore(score);setLevel(Math.floor(score/10)+1);setStatus('❤️'.repeat(lives));if(!bricks.some(b=>b.on)){finish(score+100,'Alles zerstört!');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startTTT(){setupGame();zone.innerHTML='<div class="ttt" id="ttt"></div>';const b=document.getElementById('ttt'),a=Array(9).fill('');let over=false;function win(p){for(const q of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(q.every(i=>a[i]===p))return true;return false}function fullBoard(){return a.every(Boolean)}function render(){b.innerHTML=a.map((v,i)=>`<button data-i="${i}">${v}</button>`).join('');b.querySelectorAll('button').forEach(x=>x.onclick=()=>move(Number(x.dataset.i)))}function minimax(turn){if(win('O'))return 10;if(win('X'))return -10;if(fullBoard())return 0;let best=turn==='O'?-99:99;for(let i=0;i<9;i++)if(!a[i]){a[i]=turn;const s=minimax(turn==='O'?'X':'O');a[i]='';best=turn==='O'?Math.max(best,s):Math.min(best,s)}return best}function ai(){let best=-99,idx=-1;for(let i=0;i<9;i++)if(!a[i]){a[i]='O';const s=minimax('X');a[i]='';if(s>best){best=s;idx=i}}if(idx<0)idx=a.findIndex(v=>!v);if(idx>=0)a[idx]='O'}function move(i){if(over||a[i])return;a[i]='X';render();if(win('X')){over=true;finish(100,'Du gewinnst!');return}if(fullBoard()){over=true;finish(50,'Unentschieden');return}ai();render();if(win('O')){over=true;finish(10,'Computer gewinnt')}else if(fullBoard()){over=true;finish(50,'Unentschieden')}}render();setStatus('Du = X • Computer = O');codeInput(zone)}
function startPong(){setupGame();const {c,x,w,h}=makeCanvas();let py=h/2,cy=h/2,bx=w/2,by=h/2,vx=310,vy=180,pScore=0,cScore=0,last=performance.now();c.onpointermove=e=>py=clamp(ptr(c,e).y,55,h-55);function reset(dir){bx=w/2;by=h/2;vx=310*dir;vy=ri(-220,220)}function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;cy+=((by-cy)*.06);bx+=vx*dt;by+=vy*dt;if(by<10||by>h-10)vy*=-1;if(Math.abs(bx-38)<16&&Math.abs(by-py)<65)vx=Math.abs(vx)*1.02;if(Math.abs(bx-(w-38))<16&&Math.abs(by-cy)<65)vx=-Math.abs(vx)*1.02;if(bx<0){cScore++;reset(1)}if(bx>w){pScore++;reset(-1)}x.clearRect(0,0,w,h);x.fillStyle='#081120';x.fillRect(0,0,w,h);x.fillStyle='#19d8ff';roundRect(null,x,18,py-55,16,110,8,true);x.fillStyle='#ff5277';roundRect(null,x,w-34,cy-55,16,110,8,true);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,10,0,Math.PI*2);x.fill();setScore(pScore);setLevel(Math.max(1,Math.floor(pScore/3)+1));setStatus('Du '+pScore+' • CPU '+cScore);if(pScore>=7){finish(100,'Du gewinnst Pong!');return}if(cScore>=7){finish(10,'CPU gewinnt');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startFlappy(){setupGame();const {c,x,w,h}=makeCanvas();let bird={x:w*.25,y:h/2,vy:0},pipes=[],score=0,last=performance.now(),spawn=0;function flap(){bird.vy=-390}c.onpointerdown=flap;window.onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();flap()}};function pipe(){const gap=Math.max(155,205-playerLevel()*4),cy=ri(110,h-110);pipes.push({x:w+30,w:74,top:cy-gap/2,bottom:cy+gap/2,passed:false})}function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;spawn+=dt;if(spawn>.95){spawn=0;pipe()}bird.vy+=940*dt;bird.y+=bird.vy*dt;for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=245*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++}if(p.x+p.w<0)pipes.splice(i,1);if(p.x<bird.x+20&&p.x+p.w>bird.x-20&&(bird.y-17<p.top||bird.y+17>p.bottom)){finish(score,'Vogel getroffen');return}}if(bird.y<0||bird.y>h){finish(score,'Absturz');return}x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#7ed6ff');sky.addColorStop(1,'#d9f7ff');x.fillStyle=sky;x.fillRect(0,0,w,h);for(const p of pipes){x.fillStyle='#0b5b31';roundRect(null,x,p.x,0,p.w,p.top,7,true);roundRect(null,x,p.x,p.bottom,p.w,h-p.bottom,7,true);x.fillStyle='#5fd48c';x.fillRect(p.x+14,0,p.w-28,p.top-8);x.fillRect(p.x+14,p.bottom+8,p.w-28,h-p.bottom-8);x.fillStyle='#0b5b31';roundRect(null,x,p.x-8,p.top-15,p.w+16,24,8,true);roundRect(null,x,p.x-8,p.bottom-9,p.w+16,24,8,true)}x.save();x.translate(bird.x,bird.y);x.rotate(clamp(bird.vy/900,-.45,.45));x.fillStyle='#ffcc4d';x.beginPath();x.ellipse(0,0,24,17,0,0,Math.PI*2);x.fill();x.fillStyle='#ff9f0a';x.beginPath();x.moveTo(20,0);x.lineTo(38,7);x.lineTo(20,12);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-6,5,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(9,-6,2,0,Math.PI*2);x.fill();x.fillStyle='#ef6b2f';x.beginPath();x.ellipse(-8,8,13,7,.3,0,Math.PI*2);x.fill();x.restore();setScore(score);setLevel(Math.floor(score/5)+1);setStatus('Tippe / Leertaste zum Fliegen');raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startLights(){setupGame();const n=5,a=Array(n*n).fill(false);zone.innerHTML='<div class="tiles" id="lights"></div>';const g=document.getElementById('lights');function toggle(i){const r=Math.floor(i/n),c=i%n;for(const [dr,dc] of [[0,0],[-1,0],[1,0],[0,-1],[0,1]]){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<n&&cc>=0&&cc<n)a[rr*n+cc]=!a[rr*n+cc]}}function render(){g.innerHTML=a.map((v,i)=>`<button class="tile" data-i="${i}" style="background:${v?'#ffd60a':'#101a2d'}">${v?'●':''}</button>`).join('');g.querySelectorAll('button').forEach(b=>b.onclick=()=>{toggle(Number(b.dataset.i));render();setScore(a.filter(Boolean).length);if(a.every(v=>!v))finish(100,'Alle Lichter aus!')})}for(let i=0;i<12;i++)toggle(ri(0,24));render();setStatus('Schalte alle Lichter aus');codeInput(zone)}

function startWhack(){setupGame();const {c,x,w,h}=makeCanvas();let tar={x:w/2,y:h/2,r:35},score=0,end=performance.now()+30000;c.onpointerdown=e=>{const p=ptr(c,e);if(Math.hypot(p.x-tar.x,p.y-tar.y)<=tar.r){score++;tar={x:ri(40,w-40),y:ri(55,h-45),r:ri(22,37)};beep(720,.03)}};function loop(){x.clearRect(0,0,w,h);x.fillStyle='#081120';x.fillRect(0,0,w,h);x.fillStyle='#19d8ff';x.shadowColor='#19d8ff';x.shadowBlur=25;x.beginPath();x.arc(tar.x,tar.y,tar.r,0,Math.PI*2);x.fill();x.shadowBlur=0;const left=Math.max(0,(end-performance.now())/1000);setScore(score);setLevel(Math.floor(score/8)+1);setStatus(left.toFixed(1)+' s');if(left<=0){finish(score,'Zeit vorbei');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startConnect4(){setupGame();const R=6,C=7,a=Array(R*C).fill(0);zone.innerHTML='<div class="connect4" id="c4"></div>';const g=document.getElementById('c4');function win(p){for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let ok=true;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||a[rr*C+cc]!==p)ok=false}if(ok)return true}return false}function drop(c,p){for(let r=R-1;r>=0;r--)if(!a[r*C+c]){a[r*C+c]=p;return true}return false}function render(){g.innerHTML=Array.from({length:42},(_,i)=>`<button data-c="${i%7}" style="background:${a[i]===1?'#ff453a':a[i]===2?'#ffd60a':'#07142b'}"></button>`).join('');g.querySelectorAll('button').forEach(b=>b.onclick=()=>play(Number(b.dataset.c)))}function ai(){for(const c of [3,2,4,1,5,0,6]){if(!a[c]){const snap=a.slice();drop(c,2);if(win(2))return;for(let i=0;i<a.length;i++)a[i]=snap[i]}}for(const c of [3,2,4,1,5,0,6]){if(!a[c]){const snap=a.slice();drop(c,1);if(win(1)){for(let i=0;i<a.length;i++)a[i]=snap[i];drop(c,2);return}for(let i=0;i<a.length;i++)a[i]=snap[i]}}for(const c of [3,2,4,1,5,0,6])if(drop(c,2))return}function play(c){if(!drop(c,1))return;render();if(win(1)){finish(100,'Du gewinnst!');return}if(a.every(Boolean)){finish(50,'Unentschieden');return}ai();render();if(win(2)){finish(10,'Computer gewinnt')}}render();setStatus('Du 🔴 • Computer 🟡');codeInput(zone)}
function startSimon(){setupGame();const colors=['#30d158','#ff453a','#0a84ff','#ffd60a'],seq=[];zone.innerHTML='<div class="tiles" style="grid-template-columns:repeat(2,1fr);max-width:410px" id="sim"></div>';const g=document.getElementById('sim');let input=0,accept=false,score=0;function render(){g.innerHTML=colors.map((c,i)=>`<button class="tile" data-i="${i}" style="background:${c};opacity:.78"></button>`).join('');g.querySelectorAll('button').forEach(b=>b.onpointerdown=()=>{if(accept)click(Number(b.dataset.i))})}function flash(i){const b=g.querySelector(`[data-i="${i}"]`);if(!b)return;b.style.opacity='1';setTimeout(()=>b.style.opacity='.78',240)}function round(){accept=false;input=0;seq.push(ri(0,3));setStatus('Merken…');seq.forEach((v,i)=>timer(()=>flash(v),450+i*430));timer(()=>{accept=true;setStatus('Jetzt nachmachen')},500+seq.length*430)}function click(i){flash(i);if(i!==seq[input]){finish(score,'Falsch');return}input++;score++;setScore(score);if(input===seq.length)timer(round,550)}render();round();codeInput(zone)}
function startHigher(){setupGame();let current=ri(1,100),score=0;zone.innerHTML=`<div class="big" id="hn">${current}</div><div class="row"><button class="choice" id="lo">⬇️ Niedriger</button><button class="choice" id="hi">⬆️ Höher</button></div>`;const next=dir=>{const n=ri(1,100);if(n===current)return;const ok=dir==='hi'?n>current:n<current;if(!ok){finish(score,'Falsch');return}current=n;score++;setScore(score);setLevel(Math.floor(score/4)+1);document.getElementById('hn').textContent=n;beep(500,.03)};document.getElementById('lo').onclick=()=>next('lo');document.getElementById('hi').onclick=()=>next('hi');setStatus('Was kommt als Nächstes?');codeInput(zone)}
function startMath(){setupGame();let score=0;zone.innerHTML='<div class="big" id="mq"></div><input class="input" id="mi" inputmode="numeric" placeholder="Antwort"><button class="btn" id="mb">Prüfen</button>';const q=document.getElementById('mq'),i=document.getElementById('mi');function make(){const t=ri(0,3),a=ri(2,10+playerLevel()*2),b=ri(2,10+playerLevel()*2);let text,ans;if(t===0){text=`${a} + ${b}`;ans=a+b}else if(t===1){text=`${a+b} − ${b}`;ans=a}else if(t===2){text=`${a} × ${b}`;ans=a*b}else{text=`${a*b} ÷ ${b}`;ans=a}q.textContent=text;q.dataset.a=ans;i.value='';i.focus()}function check(){if(Number(i.value)===Number(q.dataset.a)){score++;setScore(score);setLevel(Math.floor(score/5)+1);make();beep(650,.03)}else finish(score,'Falsch')}document.getElementById('mb').onclick=check;i.onkeydown=e=>{if(e.key==='Enter')check()};make();setStatus('Rechne so schnell du kannst');codeInput(zone)}
function startCoin(){setupGame();const {c,x,w,h}=makeCanvas();let basket=w/2,coins=[],score=0,lives=3,last=performance.now();c.onpointermove=e=>basket=clamp(ptr(c,e).x,50,w-50);c.onpointerdown=c.onpointermove;function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.035)coins.push({x:ri(12,w-12),y:-10,v:160+playerLevel()*10});x.clearRect(0,0,w,h);x.fillStyle='#061426';x.fillRect(0,0,w,h);for(let i=coins.length-1;i>=0;i--){const o=coins[i];o.y+=o.v*dt;x.fillStyle='#ffd60a';x.beginPath();x.arc(o.x,o.y,11,0,Math.PI*2);x.fill();if(o.y>h-70&&Math.abs(o.x-basket)<58){score++;coins.splice(i,1)}else if(o.y>h+30){coins.splice(i,1);lives--;if(lives<=0){finish(score,'Game Over');return}}}x.fillStyle='#19d8ff';roundRect(null,x,basket-55,h-30,110,16,8,true);setScore(score);setLevel(Math.floor(score/10)+1);setStatus('❤️'.repeat(lives));raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}

function startDots(){setupGame();const {c,x,w,h}=makeCanvas();const dots=[];for(let i=1;i<=20;i++){let p;let tries=0;do{p={x:ri(35,w-35),y:ri(45,h-35)};tries++}while(dots.some(d=>Math.hypot(d.x-p.x,d.y-p.y)<44)&&tries<120);dots.push({...p,n:i,hit:false})}let next=1,t0=performance.now();c.onpointerdown=e=>{const p=ptr(c,e),d=dots.find(q=>q.n===next);if(d&&Math.hypot(d.x-p.x,d.y-p.y)<24){d.hit=true;next++;setScore(next-1);if(next>20){const time=(performance.now()-t0)/1000;finish(Math.max(1,120-Math.floor(time*4)),'Zeit '+time.toFixed(2)+' s');return}}};function loop(){x.clearRect(0,0,w,h);for(const d of dots){x.fillStyle=d.hit?'#43e184':'#111c30';x.beginPath();x.arc(d.x,d.y,23,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 15px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(d.n,d.x,d.y)}setLevel(Math.floor((performance.now()-t0)/4000)+1);if(!ended)raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}

function startDice(){setupGame();let round=0,p=0,cpu=0;zone.innerHTML='<div class="row"><div class="big" id="pd">🎲</div><div class="big" id="cd">🎲</div></div><button class="btn" id="db">Würfeln</button>';document.getElementById('db').onclick=()=>{if(round>=10)return;round++;const a=ri(1,6),b=ri(1,6),E=['','⚀','⚁','⚂','⚃','⚄','⚅'];document.getElementById('pd').textContent=E[a];document.getElementById('cd').textContent=E[b];if(a>b)p++;if(b>a)cpu++;setScore(p);setLevel(round);setStatus('Du '+p+' • CPU '+cpu);if(round===10)finish(p,'Endstand '+p+'–'+cpu)};setStatus('10 Runden');codeInput(zone)}

function startWords(){setupGame();const words=['GALAXY','ROCKET','PIXEL','NEON','THUNDER','SPEED','GAMER','PLANET','MEMORY','BRICK','LASER','TIGER','DRAGON','COMPUTER'];let score=0,current='';zone.innerHTML='<div class="big" id="sw"></div><input id="wi" class="input" placeholder="Wort"><button class="btn" id="wb">Prüfen</button>';const s=document.getElementById('sw'),i=document.getElementById('wi');function next(){current=words[ri(0,words.length-1)];let m=current.split('').sort(()=>Math.random()-.5).join('');if(m===current)m=current.split('').reverse().join('');s.textContent=m;i.value='';i.focus()}function go(){if(i.value.trim().toUpperCase()===current){score++;setScore(score);setLevel(Math.floor(score/4)+1);next()}else finish(score,'Falsch')}document.getElementById('wb').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};next();codeInput(zone)}
function startAim(){setupGame();const {c,x,w,h}=makeCanvas();let tar={x:w/2,y:h/2,r:28},score=0,end=performance.now()+30000;c.onpointerdown=e=>{const p=ptr(c,e);if(Math.hypot(p.x-tar.x,p.y-tar.y)<=tar.r){score++;tar={x:ri(40,w-40),y:ri(50,h-40),r:ri(20,32)};beep(740,.025)}};function loop(){x.clearRect(0,0,w,h);x.fillStyle='#081120';x.fillRect(0,0,w,h);x.fillStyle='#ff5277';x.beginPath();x.arc(tar.x,tar.y,tar.r,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(tar.x,tar.y,tar.r*.38,0,Math.PI*2);x.fill();const left=Math.max(0,(end-performance.now())/1000);setScore(score);setLevel(Math.floor(score/8)+1);setStatus(left.toFixed(1)+' s');if(left<=0){finish(score,'Zeit vorbei');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startLane(){setupGame();const {c,x,w,h}=makeCanvas();let lane=1,cars=[],score=0,speed=240,last=performance.now(),spawn=0;c.onpointerdown=e=>lane=clamp(Math.floor(ptr(c,e).x/(w/3)),0,2);function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;spawn+=dt;if(spawn>.7){spawn=0;cars.push({lane:ri(0,2),y:-90,h:70})}x.clearRect(0,0,w,h);x.fillStyle='#151a25';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=3;x.setLineDash([25,25]);for(let i=1;i<3;i++){x.beginPath();x.moveTo(i*w/3,0);x.lineTo(i*w/3,h);x.stroke()}x.setLineDash([]);for(let i=cars.length-1;i>=0;i--){const q=cars[i];q.y+=speed*dt;const cx=q.lane*w/3+w/6;if(q.lane===lane&&q.y+q.h>h-100&&q.y<h-20){finish(score,'Crash 💥');return}if(q.y>h+30){cars.splice(i,1);score++;speed+=4}}for(const q of cars){const cx=q.lane*w/3+w/6;x.fillStyle='#ff453a';roundRect(null,x,cx-27,q.y,54,q.h,12,true)}const px=lane*w/3+w/6;x.fillStyle='#19d8ff';roundRect(null,x,px-28,h-92,56,72,13,true);setScore(score);setLevel(Math.floor(score/8)+1);setStatus('Tippe links / mitte / rechts');raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startHeli(){setupGame();const {c,x,w,h}=makeCanvas();let y=h/2,vy=0,walls=[],dist=0,last=performance.now();function flap(){vy=-270}c.onpointerdown=flap;window.onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();flap()}};function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;vy+=520*dt;y+=vy*dt;if(Math.random()<.022)walls.push({x:w+20,center:ri(120,h-120),gap:Math.max(145,190-playerLevel()*5)});for(let i=walls.length-1;i>=0;i--){const q=walls[i];q.x-=225*dt;if(q.x+70<0){walls.splice(i,1);continue}if(q.x<135&&q.x+70>100&&(y<q.center-q.gap/2||y>q.center+q.gap/2)){finish(Math.floor(dist),'Absturz');return}}x.clearRect(0,0,w,h);x.fillStyle='#080e18';x.fillRect(0,0,w,h);for(const q of walls){x.fillStyle='#1b2333';x.fillRect(q.x,0,70,q.center-q.gap/2);x.fillRect(q.x,q.center+q.gap/2,70,h)}x.fillStyle='#7c5cff';x.beginPath();x.ellipse(110,y,27,16,0,0,Math.PI*2);x.fill();x.fillStyle='#c4b5fd';x.fillRect(96,y-24,28,5);dist+=dt*20;setScore(Math.floor(dist));setLevel(Math.floor(dist/50)+1);setStatus(Math.floor(dist)+' m');if(y<0||y>h){finish(Math.floor(dist),'Absturz');return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startFish(){setupGame();const {c,x,w,h}=makeCanvas();let y=h/2,items=[],score=0,speed=190,last=performance.now();c.onpointermove=e=>y=clamp(ptr(c,e).y,30,h-30);c.onpointerdown=c.onpointermove;function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.027)items.push({x:w+20,y:ri(25,h-25),good:Math.random()<.72,r:ri(10,17)});x.clearRect(0,0,w,h);x.fillStyle='#06283d';x.fillRect(0,0,w,h);for(let i=items.length-1;i>=0;i--){const q=items[i];q.x-=speed*dt;if(Math.hypot(q.x-120,q.y-y)<q.r+19){if(!q.good){finish(score,'Mine erwischt 💥');return}score++;items.splice(i,1)}}for(const q of items){x.fillStyle=q.good?'#5de4ff':'#ff375f';x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fill()}x.fillStyle='#ff9f0a';x.beginPath();x.ellipse(120,y,28,16,0,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(130,y-5,4,0,Math.PI*2);x.fill();speed+=dt*2;setScore(score);setLevel(Math.floor(score/8)+1);raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}
function startBasket(){setupGame();const {c,x,w,h}=makeCanvas();let ball={x:w*.15,y:h-65},drag=false,startP=null,vx=0,vy=0,flying=false,score=0;const hoop={x:w*.75,y:h*.36,r:30};c.onpointerdown=e=>{const p=ptr(c,e);if(!flying&&Math.hypot(p.x-ball.x,p.y-ball.y)<45){drag=true;startP=p}};c.onpointermove=e=>{if(drag){const p=ptr(c,e);ball.x=p.x;ball.y=p.y}};c.onpointerup=e=>{if(!drag)return;const p=ptr(c,e);vx=(startP.x-p.x)*3.0;vy=(startP.y-p.y)*3.0;drag=false;flying=true};function reset(){ball={x:w*.15,y:h-65};vx=vy=0;flying=false}function loop(){x.clearRect(0,0,w,h);x.fillStyle='#86c5ff';x.fillRect(0,0,w,h);x.fillStyle='#58a64b';x.fillRect(0,h-95,w,95);x.strokeStyle='#ff5c00';x.lineWidth=8;x.beginPath();x.arc(hoop.x,hoop.y,hoop.r,0,Math.PI*2);x.stroke();x.strokeStyle='white';x.lineWidth=2;x.strokeRect(hoop.x-40,hoop.y-95,80,95);if(flying){vy+=12;ball.x+=vx/60;ball.y+=vy/60;if(Math.hypot(ball.x-hoop.x,ball.y-hoop.y)<hoop.r){score++;setScore(score);reset()}else if(ball.y>h+50||ball.x>w+50||ball.x<-50)reset()}x.fillStyle='#ff9f0a';x.beginPath();x.arc(ball.x,ball.y,18,0,Math.PI*2);x.fill();x.fillStyle='#8a4300';x.font='bold 12px system-ui';x.fillText('🏀',ball.x-10,ball.y+4);setLevel(Math.floor(score/5)+1);raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);setStatus('Ziehe den Ball und lasse los');codeInput(zone)}
function startGoal(){setupGame();const {c,x,w,h}=makeCanvas();let zonePick=1,shots=10,saved=0,shot=null,t=0;c.onpointerdown=e=>{const p=ptr(c,e);zonePick=p.x<w/3?0:p.x<w*2/3?1:2};function newShot(){shot={x:w/2,y:70,target:ri(0,2),p:0}}newShot();function loop(){x.clearRect(0,0,w,h);x.fillStyle='#18843d';x.fillRect(0,0,w,h);x.strokeStyle='white';x.lineWidth=4;x.strokeRect(24,40,w-48,h-75);const spots=[w*.25,w*.5,w*.75];x.fillStyle='#ffd60a';x.beginPath();x.arc(spots[zonePick],h-95,29,0,Math.PI*2);x.fill();if(shot){shot.p+=.028;shot.x+=(spots[shot.target]-shot.x)*.07;shot.y+=(h-95-shot.y)*.07;x.fillStyle='#fff';x.beginPath();x.arc(shot.x,shot.y,13,0,Math.PI*2);x.fill();if(shot.p>=1){if(zonePick===shot.target)saved++;shots--;setScore(saved);setLevel(11-shots);if(!shots){finish(saved,'Gehalten: '+saved+' / 10');return}shot=null;t=20}}else if(--t<=0)newShot();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);setStatus('Tippe links, mitte oder rechts');codeInput(zone)}
function startNeon(){setupGame();const {c,x,w,h}=makeCanvas();let y=h-50,vy=0,obs=[],score=0,speed=260,last=performance.now(),sp=0;c.onpointerdown=()=>{if(y>=h-50)vy=-560};window.onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();if(y>=h-50)vy=-560}};function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;sp+=dt;if(sp>.72){sp=0;obs.push({x:w+20,w:ri(24,40),h:ri(35,82)})}vy+=1500*dt;y+=vy*dt;if(y>h-50){y=h-50;vy=0}for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.x-=speed*dt;if(o.x+o.w<0){obs.splice(i,1);score++;speed+=4}if(120+18>o.x&&120-18<o.x+o.w&&y>h-50-o.h-2){finish(score,'Crash 💥');return}}x.clearRect(0,0,w,h);x.fillStyle='#090d22';x.fillRect(0,0,w,h);x.fillStyle='#17142e';x.fillRect(0,h-50,w,50);for(const o of obs){x.fillStyle='#ff2bd6';x.shadowColor='#ff2bd6';x.shadowBlur=18;x.fillRect(o.x,h-50-o.h,o.w,o.h);x.shadowBlur=0}x.fillStyle='#30d5ff';roundRect(null,x,100,y-42,40,42,10,true);setScore(score);setLevel(Math.floor(score/6)+1);setStatus('Tippe zum Springen');raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);codeInput(zone)}

function boot(id){const map={galaxy:startGalaxy,snake:startSnake,perfect:startPerfect,reaction:startReaction,memory:startMemory,'2048':start2048,brick:startBrick,tictactoe:startTTT,pong:startPong,flappy:startFlappy,lightsout:startLights,colormatch:startColor,whack:startWhack,connect4:startConnect4,simon:startSimon,higherlower:startHigher,quickmath:startMath,coincatch:startCoin,safetiles:startSafe,connectdots:startDots,guessnumber:startGuess,diceduel:startDice,oddoneout:startOdd,numbersprint:startNumSprint,holdmeter:startHold,wordscramble:startWords,aimtrainer:startAim,laneracer:startLane,helicave:startHeli,fishdash:startFish,basketshot:startBasket,goalkeeper:startGoal,neonrunner:startNeon};(map[id]||startGalaxy)()}
