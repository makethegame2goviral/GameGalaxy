  }

  animationFrame=requestAnimationFrame(loop);
}


function startLaneRacer(){
  const {canvas,ctx}=createCanvas();
  const lanes=3;
  const laneW=canvas.width/lanes;
  let player=1;
  let cars=[];
  let score=0;
  let speed=230;
  let last=performance.now();
  let spawnTimer=0;
  let running=true;

  setScore(0);
  setLevel("Level 1");
  setStatus("Weiche den Fahrzeugen aus");

  canvas.onpointerdown=e=>{
    const p=pointerPosition(canvas,e);
    player=clamp(Math.floor(p.x/laneW),0,2);
  };

  canvas.onpointermove=e=>{
    if(e.buttons||e.pointerType==="touch"){
      const p=pointerPosition(canvas,e);
      player=clamp(Math.floor(p.x/laneW),0,2);
    }
  };

  function loop(now){
    if(!running)return;

    const dt=Math.min(.03,(now-last)/1000);
    last=now;
    spawnTimer+=dt;

    if(spawnTimer>.72){
      spawnTimer=0;
      cars.push({
        lane:randInt(0,2),
        y:-90,
        h:75
      });
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#141821";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle="rgba(255,255,255,.16)";
    ctx.lineWidth=3;
    ctx.setLineDash([25,25]);

    for(let i=1;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(i*laneW,0);
      ctx.lineTo(i*laneW,canvas.height);
      ctx.stroke();
    }

    ctx.setLineDash([]);

    for(let i=cars.length-1;i>=0;i--){
      const car=cars[i];
      car.y+=speed*dt;

      if(
        car.lane===player &&
        car.y+car.h>canvas.height-100 &&
        car.y<canvas.height-20
      ){
        running=false;
        setStatus("Crash 💥");
        setMessage("Punkte: "+score);
        addRestartButton(startLaneRacer);
        return;
      }

      if(car.y>canvas.height+100){
        cars.splice(i,1);
        score++;
        setScore(score);
        speed+=3;
        continue;
      }

      const x=car.lane*laneW+laneW/2;

      ctx.fillStyle="#ff453a";
      ctx.beginPath();
      ctx.roundRect(x-28,car.y,56,car.h,14);
      ctx.fill();

      ctx.fillStyle="#b9e7ff";
      ctx.fillRect(x-20,car.y+12,40,20);

      ctx.fillStyle="#111";
      ctx.fillRect(x-27,car.y+50,9,14);
      ctx.fillRect(x+18,car.y+50,9,14);
    }

    const px=player*laneW+laneW/2;

    ctx.fillStyle="#0a84ff";
    ctx.beginPath();
    ctx.roundRect(px-30,canvas.height-95,60,75,16);
    ctx.fill();

    ctx.fillStyle="#d7f1ff";
    ctx.fillRect(px-20,canvas.height-78,40,22);

    setLevel("Speed "+Math.round(speed));

    animationFrame=requestAnimationFrame(loop);
  }

  animationFrame=requestAnimationFrame(loop);
}


function startHeliCave(){
  const {canvas,ctx}=createCanvas();
  let heli={x:130,y:canvas.height/2,vy:0};
  let walls=[];
  let distance=0;
  let last=performance.now();
  let running=true;

  setScore(0);
  setStatus("Halte den Helikopter durch die Höhle");
  setLevel("0m");

  function input(){
    heli.vy-=220;
  }

  canvas.onpointerdown=input;

  window.onkeydown=e=>{
    if(e.code==="Space"||e.key==="ArrowUp"){
      e.preventDefault();
      input();
    }
  };

  function makeWall(){
    const gap=170;
    const center=randInt(100,canvas.height-100);
    walls.push({
      x:canvas.width+20,
      gapTop:center-gap/2,
      gapBottom:center+gap/2,
      w:80
    });
  }

  makeWall();
  setTimeout(makeWall,900);

  function loop(now){
    if(!running)return;

    const dt=Math.min(.03,(now-last)/1000);
    last=now;

    heli.vy+=430*dt;
    heli.vy*=.985;
    heli.y+=heli.vy*dt;

    if(Math.random()<.018)makeWall();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const bg=ctx.createLinearGradient(0,0,0,canvas.height);
    bg.addColorStop(0,"#08111b");
    bg.addColorStop(1,"#15102a");
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let i=walls.length-1;i>=0;i--){
      const w=walls[i];
      w.x-=220*dt;

      ctx.fillStyle="#1b2333";
      ctx.fillRect(w.x,0,w.w,w.gapTop);
      ctx.fillRect(w.x,w.gapBottom,w.w,canvas.height-w.gapBottom);

      if(w.x+w.w<0)walls.splice(i,1);

      if(
        heli.x+18>w.x &&
        heli.x-18<w.x+w.w &&
        (heli.y-15<w.gapTop||heli.y+15>w.gapBottom)
      ){
        running=false;
        setStatus("Absturz");
        setMessage("Distanz: "+Math.floor(distance)+" m");
        addRestartButton(startHeliCave);
        return;
      }
    }

    if(heli.y<0||heli.y>canvas.height){
      running=false;
      setStatus("Absturz");
      setMessage("Distanz: "+Math.floor(distance)+" m");
      addRestartButton(startHeliCave);
      return;
    }

    ctx.fillStyle="#7c3aed";
    ctx.beginPath();
    ctx.ellipse(heli.x,heli.y,24,15,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#c4b5fd";
    ctx.fillRect(heli.x-16,heli.y-25,32,5);

    distance+=dt*20;
    setScore(Math.floor(distance));
    setLevel(Math.floor(distance)+"m");

    animationFrame=requestAnimationFrame(loop);
  }

  animationFrame=requestAnimationFrame(loop);
}


function startFishDash(){
  const {canvas,ctx}=createCanvas();

  let fish={x:120,y:canvas.height/2,vy:0};
  let items=[];
  let score=0;
  let speed=180;
  let last=performance.now();

  setScore(0);
  setStatus("Sammle Blasen, meide Minen");
  setLevel("Meer 1");

  canvas.onpointermove=e=>{
    const p=pointerPosition(canvas,e);
    fish.y=clamp(p.y,30,canvas.height-30);
  };

  canvas.onpointerdown=canvas.onpointermove;

  function spawn(){
    const good=Math.random()<.72;
    items.push({
      x:canvas.width+30,
      y:randInt(35,canvas.height-35),
      good,
      r:good?11:17
    });
  }

  function loop(now){
    const dt=Math.min(.03,(now-last)/1000);
    last=now;

    if(Math.random()<.025)spawn();

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const sea=ctx.createLinearGradient(0,0,0,canvas.height);
    sea.addColorStop(0,"#06283d");
    sea.addColorStop(1,"#013049");
    ctx.fillStyle=sea;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<items.length;i++){
      const o=items[i];
      o.x-=speed*dt;

      const hit=Math.hypot(o.x-fish.x,o.y-fish.y)<o.r+18;

      if(hit){
        if(o.good){
          score++;
          setScore(score);
        }else{
          setStatus("Mine erwischt 💥");
          setMessage("Punkte: "+score);
          addRestartButton(startFishDash);
          return;
        }

        items.splice(i,1);
        i--;
        continue;
      }

      ctx.beginPath();
      ctx.arc(o.x,o.y,o.r,0,Math.PI*2);

      if(o.good){
        ctx.fillStyle="#5de4ff";
        ctx.fill();
        ctx.strokeStyle="#d7fbff";
        ctx.stroke();
      }else{
        ctx.fillStyle="#ff375f";
        ctx.fill();
        ctx.strokeStyle="#fff";
        ctx.stroke();

        ctx.strokeStyle="#ff8ba7";
        for(let j=0;j<8;j++){
          const a=j*Math.PI/4;
          ctx.beginPath();
          ctx.moveTo(o.x+Math.cos(a)*o.r,o.y+Math.sin(a)*o.r);
          ctx.lineTo(o.x+Math.cos(a)*(o.r+8),o.y+Math.sin(a)*(o.r+8));
          ctx.stroke();
        }
      }
    }

    ctx.fillStyle="#ff9f0a";
    ctx.beginPath();
    ctx.ellipse(fish.x,fish.y,28,16,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(fish.x-22,fish.y);
    ctx.lineTo(fish.x-42,fish.y-18);
    ctx.lineTo(fish.x-42,fish.y+18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(fish.x+10,fish.y-5,4,0,Math.PI*2);
    ctx.fill();

    speed+=dt*2;
    setLevel("Speed "+Math.round(speed));

    animationFrame=requestAnimationFrame(loop);
  }

  animationFrame=requestAnimationFrame(loop);
}


function startBasketShot(){
  const {canvas,ctx}=createCanvas();
  let ball={x:canvas.width*.15,y:canvas.height-60};
  let dragging=false;
  let start=null;
  let vx=0,vy=0;
  let flying=false;
  let score=0;
  let hoops=[
    {x:canvas.width*.74,y:canvas.height*.38,r:30}
  ];

  setScore(0);
  setStatus("Ziehe den Ball nach hinten und lasse los");

  canvas.onpointerdown=e=>{
    if(flying)return;
    const p=pointerPosition(canvas,e);

    if(Math.hypot(p.x-ball.x,p.y-ball.y)<40){
      dragging=true;
      start=p;
    }
  };

  canvas.onpointermove=e=>{
    if(!dragging)return;
    const p=pointerPosition(canvas,e);
    ball.x=p.x;
    ball.y=p.y;
  };

  canvas.onpointerup=e=>{
    if(!dragging)return;

    const p=pointerPosition(canvas,e);

    vx=(start.x-p.x)*3.2;
    vy=(start.y-p.y)*3.2;

    dragging=false;
    flying=true;
  };

  function reset(){
    ball.x=canvas.width*.15;
    ball.y=canvas.height-60;
    vx=0;
    vy=0;
    flying=false;
  }

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#79b6ff";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#58a64b";
    ctx.fillRect(0,canvas.height-90,canvas.width,90);

    const h=hoops[0];

    ctx.strokeStyle="#8c4a20";
    ctx.lineWidth=10;
    ctx.beginPath();
    ctx.moveTo(h.x+30,h.y);
    ctx.lineTo(h.x+30,h.y+110);
    ctx.stroke();

    ctx.strokeStyle="#ff4d00";
    ctx.lineWidth=8;
    ctx.beginPath();
    ctx.arc(h.x,h.y,h.r,0,Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle="white";
    ctx.lineWidth=3;
    for(let i=0;i<7;i++){
      const x=h.x-h.r+i*h.r/3;
      ctx.beginPath();
      ctx.moveTo(x,h.y+2);
      ctx.lineTo(x-5,h.y+35);
      ctx.stroke();
    }

    if(flying){
      vy+=500/60;
      ball.x+=vx/60;
      ball.y+=vy/60;
    }

    const scored=
      flying &&
      Math.hypot(ball.x-h.x,ball.y-h.y)<h.r;

    if(scored){
      score++;
      setScore(score);
      setStatus("Korb! 🏀");
      reset();
    }

    if(flying && (ball.y>canvas.height+60||ball.x>canvas.width+60||ball.x< -60)){
      reset();
    }

    ctx.fillStyle="#ff9f0a";
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,18,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#8a4300";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,18,0,Math.PI*2);
    ctx.stroke();

    if(!flying){
      ctx.fillStyle="rgba(0,0,0,.3)";
      ctx.beginPath();
      ctx.arc(ball.x,ball.y+20,14,0,Math.PI*2);
      ctx.fill();
    }

    animationFrame=requestAnimationFrame(loop);
  }

  animationFrame=requestAnimationFrame(loop);
}


function startGoalKeeper(){
  const {canvas,ctx}=createCanvas();
  let keeperX=canvas.width/2;
  let shots=10;
  let saved=0;
  let shot=null;
  let timer=0;

  setScore(0);

      zone===0?canvas.width*.22:
      zone===1?canvas.width*.5:
      canvas.width*.78;
  };

  function newShot(){
    const target=randInt(0,2);

    shot={
      x:canvas.width*.5,
      y:80,
      target,
      progress:0
    };
  }

  newShot();

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#17863b";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#0b6630";
    ctx.fillRect(20,50,canvas.width-40,canvas.height-80);

    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    ctx.fillStyle="#ffd60a";
    ctx.beginPath();
    ctx.arc(keeperX,canvas.height-95,30,0,Math.PI*2);
    ctx.fill();

    if(shot){
      shot.progress+=.015;

      const tx=
        shot.target===0?canvas.width*.22:
        shot.target===1?canvas.width*.5:
        canvas.width*.78;

      const ty=canvas.height-95;

      shot.x+=((tx-shot.x)*.055);
      shot.y+=((ty-shot.y)*.055);

      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.arc(shot.x,shot.y,13,0,Math.PI*2);
      ctx.fill();

      if(shot.progress>1){
        const keeperZone=
          keeperX<canvas.width/3?0:
          keeperX<canvas.width*2/3?1:2;

        if(keeperZone===shot.target){
          saved++;
          setScore(saved);
          setStatus("GEHALTEN 🧤");
        }else{
          setStatus("TOR ⚽");
        }

        shots--;
        setLevel(shots+" Schüsse übrig");

        if(shots<=0){
          setMessage("Gehalten: "+saved+" / 10");
          addRestartButton(startGoalKeeper);
          return;
        }

        timer=25;
        shot=null;
      }
    }else{
      timer--;
      if(timer<=0)newShot();
    }

    animationFrame=requestAnimationFrame(loop);
  }

  animationFrame=requestAnimationFrame(loop);
}


function startNeonRunner(){
  const {canvas,ctx}=createCanvas();

  let player={
    x:120,
    y:canvas.height-90,
    vy:0,
    grounded:true
  };

  let obstacles=[];
  let score=0;
  let speed=270;
  let last=performance.now();
  let running=true;

  setScore(0);
  setStatus("Tippe zum Springen");
  setLevel("Speed 270");

  function jump(){
    if(player.grounded){
      player.vy=-550;
      player.grounded=false;
    }
  }

  canvas.onpointerdown=jump;

  window.onkeydown=e=>{
    if(e.code==="Space"||e.key==="ArrowUp"){
      e.preventDefault();
      jump();
    }
  };

  function spawn(){
    obstacles.push({
      x:canvas.width+30,
      w:randInt(24,40),
      h:randInt(35,75)
    });
  }

  function loop(now){
    if(!running)return;

    const dt=Math.min(.03,(now-last)/1000);
    last=now;

    if(Math.random()<.018)spawn();

    player.vy+=1450*dt;
    player.y+=player.vy*dt;

    const ground=canvas.height-50;

    if(player.y>=ground){
      player.y=ground;
      player.vy=0;
      player.grounded=true;
    }

    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.x-=speed*dt;

      const px1=player.x-18;
      const px2=player.x+18;
      const py1=player.y-40;
      const py2=player.y;

      const ox1=o.x;
      const ox2=o.x+o.w;
      const oy1=ground-o.h;

      if(px2>ox1&&px1<ox2&&py2>oy1&&py1<ground){
        running=false;
        setStatus("Crash 💥");
        setMessage("Punkte: "+score);
        addRestartButton(startNeonRunner);
        return;
      }

      if(ox2<0){
        obstacles.splice(i,1);
        score++;
        setScore(score);
      }
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const sky=ctx.createLinearGradient(0,0,0,canvas.height);
    sky.addColorStop(0,"#070b1c");
    sky.addColorStop(1,"#241044");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#14142a";
    ctx.fillRect(0,ground,canvas.width,50);

    for(const o of obstacles){
      ctx.fillStyle="#ff2bd6";
      ctx.fillRect(o.x,ground-o.h,o.w,o.h);

      ctx.shadowColor="#ff2bd6";
      ctx.shadowBlur=20;
      ctx.fillRect(o.x,ground-o.h,o.w,o.h);
      ctx.shadowBlur=0;
    }

    ctx.fillStyle="#30d5ff";
    ctx.beginPath();
    ctx.roundRect(player.x-18,player.y-40,36,40,10);
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.fillRect(player.x-8,player.y-30,16,5);

    speed+=dt*5;
    setLevel("Speed "+Math.round(speed));

    animationFrame=requestAnimationFrame(loop);
  }

  animationFrame=requestAnimationFrame(loop);
}
