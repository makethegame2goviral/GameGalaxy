<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>GameGalaxy</title>

<style>
:root{
  --bg:#050816;
  --panel:#0b1328;
  --panel2:#101c35;
  --line:#263b61;
  --text:#f4f8ff;
  --muted:#8fa5c5;
  --cyan:#3de8ff;
  --blue:#4b72ff;
  --purple:#9b5cff;
  --pink:#ff4fd8;
  --green:#42ef88;
  --yellow:#ffd84a;
  --red:#ff5570;
  --shadow:0 25px 80px #0009;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 5%,#17437c55,transparent 30%),
    radial-gradient(circle at 90% 12%,#681d7650,transparent 28%),
    radial-gradient(circle at 50% 100%,#11395b40,transparent 35%),
    linear-gradient(180deg,#040711,#071124 55%,#040711);
}

/* texture */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.13;
  background:
    linear-gradient(90deg,#fff 1px,transparent 1px),
    linear-gradient(#fff 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(#000,transparent 85%);
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.045;
  background:repeating-linear-gradient(
    0deg,
    transparent 0,
    transparent 3px,
    #fff 4px
  );
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:1px solid #253b5d;
  background:#050816d9;
  backdrop-filter:blur(20px);
}

.nav{
  max-width:1450px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:23px;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo .glow{
  color:var(--cyan);
  text-shadow:0 0 22px #3de8ff;
}

.spacer{
  flex:1;
}

.btn{
  border:1px solid #304a70;
  border-radius:13px;
  padding:10px 14px;
  color:#fff;
  background:linear-gradient(180deg,#172944,#0a1628);
  box-shadow:0 8px 25px #0006;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:var(--cyan);
}

.btn.primary{
  background:linear-gradient(135deg,#147eff,#863cff);
  border-color:#6bcaff;
}

.hero{
  max-width:1450px;
  margin:auto;
  padding:55px 18px 25px;
}

.hero h1{
  margin:0;
  font-size:clamp(45px,8vw,86px);
  line-height:.88;
  letter-spacing:-6px;
}

.hero h1 span{
  color:var(--cyan);
  text-shadow:
    0 0 10px #3de8ff,
    0 0 40px #3de8ff66;
}

.hero p{
  max-width:800px;
  color:#a7bad5;
  font-size:18px;
  line-height:1.55;
}

.toolbar{
  max-width:1450px;
  margin:auto;
  padding:10px 18px 22px;
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.search{
  flex:1;
  min-width:220px;
  border:1px solid #2b4265;
  border-radius:13px;
  padding:13px 15px;
  outline:none;
  color:white;
  background:#091527;
}

.search:focus{
  border-color:var(--cyan);
  box-shadow:0 0 25px #3de8ff22;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.chip{
  border:1px solid #2a4264;
  background:#091527;
  color:#91a6c4;
  border-radius:999px;
  padding:9px 13px;
}

.chip.active{
  color:#fff;
  border-color:var(--cyan);
  background:#103149;
  box-shadow:0 0 20px #3de8ff22;
}

.grid{
  max-width:1450px;
  margin:auto;
  padding:0 18px 80px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(225px,1fr));
  gap:16px;
}

.card{
  position:relative;
  overflow:hidden;
  min-height:220px;
  padding:19px;
  border:1px solid #263d5d;
  border-radius:21px;
  background:
    linear-gradient(145deg,#122139ee,#08111fee);
  box-shadow:var(--shadow);
  transition:.18s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#3de8ff77;
}

.card:before{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-90px;
  top:-90px;
  border-radius:50%;
  background:var(--glow);
  filter:blur(55px);
  opacity:.16;
}

.card>*{
  position:relative;
}

.icon{
  font-size:43px;
  filter:drop-shadow(0 0 13px #fff5);
}

.card h3{
  margin:9px 0 3px;
}

.card p{
  color:#91a6c3;
  font-size:13px;
  min-height:36px;
  margin:0 0 11px;
}

.best{
  color:#91a6c3;
  font-size:12px;
  margin-bottom:10px;
}

.best b{
  color:var(--yellow);
}

#gameView{
  max-width:1250px;
  margin:auto;
  padding:20px 16px 80px;
}

.gameHead{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.gameHead h2{
  margin:0;
  font-size:29px;
}

.stage{
  position:relative;
  min-height:440px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid #2c4669;
  border-radius:24px;
  background:#040a14;
  box-shadow:
    0 30px 100px #000a,
    0 0 60px #3de8ff12;
}

canvas{
  display:block;
  max-width:100%;
  max-height:75vh;
  touch-action:none;
}

.hud{
  position:absolute;
  z-index:5;
  left:12px;
  top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.hudBox{
  padding:8px 12px;
  border:1px solid #2d496b;
  border-radius:12px;
  background:#06101ddd;
  backdrop-filter:blur(8px);
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:14px 0;
}

.touch{
  min-width:58px;
  min-height:52px;
  border:1px solid #355474;
  border-radius:15px;
  background:linear-gradient(180deg,#18304d,#0a1728);
  color:white;
  font-size:20px;
  box-shadow:0 9px 28px #0007;
  touch-action:manipulation;
  user-select:none;
}

.touch:active{
  transform:scale(.93);
  border-color:var(--cyan);
  box-shadow:0 0 25px #3de8ff33;
}

.panel{
  max-width:1000px;
  margin:20px auto;
  padding:20px;
  border:1px solid #29405f;
  border-radius:20px;
  background:#091322ed;
}

.authGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.authGrid input{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid #29405f;
  background:#06101d;
  color:#fff;
}

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:#02050bdc;
  backdrop-filter:blur(12px);
}

.modalBox{
  width:min(720px,100%);
  max-height:87vh;
  overflow:auto;
  padding:20px;
  border:1px solid #315275;
  border-radius:22px;
  background:#0a1424;
  box-shadow:0 30px 100px #000;
}

.modalBox table{
  width:100%;
  border-collapse:collapse;
}

.modalBox th,
.modalBox td{
  padding:10px;
  border-bottom:1px solid #233851;
  text-align:left;
}

.toast{
  position:fixed;
  z-index:150;
  left:50%;
  bottom:20px;
  transform:translate(-50%,25px);
  opacity:0;
  padding:12px 18px;
  border:1px solid #426080;
  border-radius:14px;
  background:#081423ee;
  box-shadow:0 15px 40px #0009;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.fullscreen{
  position:fixed;
  z-index:60;
  right:14px;
  bottom:14px;
}

@media(max-width:700px){
  .nav{
    padding:9px;
  }

  .nav .btn.hideMobile{
    display:none;
  }

  .hero{
    padding-top:36px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    padding-left:10px;
    padding-right:10px;
    gap:10px;
  }

  .card{
    min-height:195px;
    padding:15px;
  }

  .stage{
    min-height:390px;
    border-radius:18px;
  }

  .authGrid{
    grid-template-columns:1fr;
  }

  .gameHead h2{
    font-size:21px;
  }
}

@media(max-width:430px){
  .grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:50px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="nav">
    <div class="logo">🌌 Game<span class="glow">Galaxy</span></div>
    <div class="spacer"></div>
    <button class="btn hideMobile" onclick="openLeaderboard()">🏆 Rangliste</button>
    <button class="btn" onclick="toggleAuth()">👤 Konto</button>
  </div>
</header>

<section id="home">

  <div class="hero">
    <h1>PLAY.<br><span>GLOW.</span><br>REPEAT.</h1>
    <p>
      Deine Neon-Spielhalle mit 33 Games, Touch-Steuerung,
      Vollbild, lokalen Bestwerten und Online-Rangliste.
    </p>
  </div>

  <div class="toolbar">
    <input
      id="search"
      class="search"
      placeholder="🔎 Spiel suchen …"
      oninput="renderGames()"
    >
    <div id="chips" class="chips"></div>
  </div>

  <div id="gameGrid" class="grid"></div>

</section>

<section id="gameView" class="hidden">

  <div class="gameHead">
    <button class="btn" onclick="goHome()">← Zurück</button>
    <h2 id="gameTitle"></h2>
    <div class="spacer"></div>
    <button class="btn" onclick="toggleFullscreen()">⛶</button>
  </div>

  <div class="stage">
    <div id="hud" class="hud"></div>
    <canvas id="gameCanvas" width="900" height="560"></canvas>
  </div>

  <div id="controls" class="controls"></div>

</section>

<section id="authPanel" class="panel hidden">

  <h2>👤 GameGalaxy Konto</h2>

  <p style="color:#91a6c3">
    Deine lokalen Scores funktionieren immer.
    Für Online-Scores kannst du dich anmelden.
  </p>

  <div class="authGrid">
    <input id="playerName" placeholder="Spielername">
    <input id="email" type="email" placeholder="E-Mail">
    <input id="password" type="password" placeholder="Passwort">
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn primary" onclick="register()">Registrieren</button>
    <button class="btn" onclick="login()">Einloggen</button>
    <button class="btn" onclick="logout()">Logout</button>
  </div>

  <p id="authStatus" style="color:#91a6c3"></p>

</section>

<div id="leaderModal" class="modal"
     onclick="if(event.target===this)closeLeaderboard()">

  <div class="modalBox">

    <div style="display:flex;align-items:center;gap:10px">
      <h2 style="margin:0">🏆 Rangliste</h2>
      <div class="spacer"></div>
      <button class="btn" onclick="closeLeaderboard()">✕</button>
    </div>

    <select
      id="leaderGame"
      class="search"
      style="margin:15px 0"
      onchange="loadLeaderboard()">
    </select>

    <div id="leaderContent">Lade …</div>

  </div>
</div>

<div id="toast" class="toast"></div>

<button class="btn primary fullscreen" onclick="toggleFullscreen()">⛶</button>

<!-- Supabase ist optional. Wenn CDN ausfällt, funktionieren die Spiele trotzdem. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================================
   GAME DATABASE
========================================================= */

const GAMES = [

["galaxy","Galaxy Clicker","🚀","Baue Energie mit dem Kern.","arcade"],
["snake","Neon Snake
