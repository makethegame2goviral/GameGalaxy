<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>GameGalaxy – Spiel</title>
<style>
:root{--bg:#050814;--panel:rgba(13,21,37,.88);--panel2:#111b2e;--text:#f7f9ff;--muted:#91a2bb;--line:rgba(255,255,255,.09);--a:#7c5cff;--b:#19d8ff;--good:#43e184;--danger:#ff5277;--shadow:0 24px 80px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 18% -10%,#243466 0,transparent 35%),radial-gradient(circle at 100% 0,#123d5e 0,transparent 30%),linear-gradient(160deg,#080b15,#050814 70%,#03050b);color:#fff;touch-action:manipulation}body{padding:12px}.shell{max-width:1250px;margin:auto}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.logo{font-size:23px;font-weight:950;letter-spacing:-.7px}.logo span{color:var(--b)}.spacer{flex:1}.btn{border:1px solid var(--line);border-radius:14px;padding:11px 15px;color:#fff;background:linear-gradient(135deg,#785dfb,#5c41d6);font-weight:850;cursor:pointer;transition:.18s;touch-action:manipulation}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#10182a}.btn.danger{background:#60162b}.panel{border:1px solid var(--line);border-radius:28px;padding:18px;background:linear-gradient(180deg,rgba(17,27,46,.92),rgba(8,14,26,.96));box-shadow:var(--shadow);overflow:hidden}.topRow{display:flex;align-items:start;gap:15px;justify-content:space-between}.title{margin:0;font-size:clamp(25px,4vw,38px);line-height:1.05;letter-spacing:-1px}.muted{color:var(--muted)}.sub{margin-top:6px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stat{padding:9px 12px;border:1px solid var(--line);border-radius:13px;background:#091120;color:#acbad0}.stat b{color:#fff}.zone{min-height:590px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}.canvas{display:block;width:min(100%,1050px);border:1px solid var(--line);border-radius:22px;background:#08101e;touch-action:none;box-shadow:0 16px 60px rgba(0,0,0,.22)}.hudText{min-height:28px;margin-bottom:8px}.big{font-size:64px;line-height:1;font-weight:950;margin:12px 0}.row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#121c30;color:#fff;border-radius:15px;padding:14px 18px;font-weight:900;cursor:pointer}.input{width:min(430px,100%);padding:14px;border:1px solid var(--line);border-radius:14px;background:#091120;color:#fff;font-size:21px;text-align:center;outline:0}.gridCards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(650px,100%)}.cardButton{aspect-ratio:1;border:1px solid var(--line);border-radius:15px;background:#151f34;color:#fff;font-size:31px;font-weight:900;cursor:pointer}.board2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(430px,100%);padding:8px;border-radius:17px;background:#8d7252}.t2048{aspect-ratio:1;border-radius:10px;background:#cdbda5;color:#241a12;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:950}.boardTTT{display:grid;grid-template-columns:repeat(3,100px);gap:9px}.ttt{width:100px;height:100px;border:1px solid var(--line);border-radius:17px;background:#111c30;color:#fff;font-size:55px;font-weight:950}.connect{display:grid;grid-template-columns:repeat(7,52px);gap:6px;padding:9px;border-radius:18px;background:#1556bb}.connect button{width:52px;height:52px;border:0;border-radius:50%;background:#07142b;cursor:pointer}.levelBar{width:min(680px,100%);height:12px;border-radius:999px;background:#0a1220;border:1px solid var(--line);overflow:hidden;margin:9px auto}.levelFill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.68);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px}.modal.hidden{display:none}.box{width:min(460px,100%);background:#0d1525;border:1px solid var(--line);border-radius:24px;padding:22px}.field{width:100%;padding:13px 14px;margin:7px 0 10px;border:1px solid var(--line);border-radius:14px;background:#091120;color:#fff}.notice{padding:12px 14px;border-radius:14px;background:#091120;color:#a9b7ca;font-size:13px}.shake{animation:shake .48s linear}.glow{box-shadow:0 0 0 1px rgba(25,216,255,.15),0 0 40px rgba(25,216,255,.12)}@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(8px,-5px)}40%{transform:translate(-9px,6px)}60%{transform:translate(7px,3px)}80%{transform:translate(-4px,-4px)}}@media(max-width:760px){body{padding:8px}.panel{padding:12px;border-radius:23px}.zone{min-height:550px}.boardTTT{grid-template-columns:repeat(3,82px)}.ttt{width:82px;height:82px;font-size:44px}.connect{grid-template-columns:repeat(7,40px)}.connect button{width:40px;height:40px}.gridCards{gap:7px}.topRow{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <button class="btn secondary" id="homeBtn">← Startseite</button><div class="logo">Game<span>Galaxy</span> 🚀</div><div class="spacer"></div>
    <button class="btn secondary" id="fullscreenBtn">⛶ Vollbild</button><button class="btn secondary" id="soundBtn">🔊 Sound</button><button class="btn secondary" id="authBtn">👤 Anmelden</button>
  </div>
  <section class="panel" id="panel">
    <div class="topRow"><div><h1 class="title" id="title">GameGalaxy</h1><div class="muted sub" id="desc"></div></div><div class="muted" id="user"></div></div>
    <div class="stats"><div class="stat">Score <b id="score">0</b></div><div class="stat">Level <b id="level">1</b></div><div class="stat">XP <b id="xp">0</b></div><div class="stat">Bestwert <b id="best">0</b></div><div class="stat" id="status">Bereit</div></div>
    <div class="levelBar"><div id="levelFill" class="levelFill"></div></div>
    <div id="zone" class="zone"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div id="box" class="box"></div></div>
<script>
const G={galaxy:['🚀 Galaxy Blaster','Arcade'],snake:['🐍 Snake','Classic'],perfect:['⏱️ Perfect Time','Skill'],reaction:['⚡ Reaction Rush','Speed'],memory:['🧠 Memory','Brain'],"2048":['🔢 2048','Puzzle'],brick:['🧱 Brick Blast','Arcade'],tictactoe:['⭕ Tic-Tac-Toe','Strategy'],pong:['🏓 Pong','Classic'],flappy:['🐦 Flappy Sky','Skill'],lightsout:['💡 Lights Out','Puzzle'],colormatch:['🎨 Color Match','Speed'],whack:['🔨 Whack Spot','Skill'],connect4:['🟡 Vier Gewinnt','Strategy'],simon:['🔊 Simon','Memory'],higherlower:['🃏 Higher or Lower','Cards'],quickmath:['🧮 Quick Math','Math'],coincatch:['🪙 Coin Catch','Arcade'],safetiles:['💣 Safe Tiles','Memory'],connectdots:['🔵 Connect Dots','Speed'],guessnumber:['🔢 Guess the Number','Brain'],diceduel:['🎲 Dice Duel','Dice'],oddoneout:['🟣 Odd One Out','Speed'],numbersprint:['🔢 Number Sprint','Speed'],holdmeter:['💪 Hold Meter','Skill'],wordscramble:['🔤 Word Scramble','Words'],aimtrainer:['🎯 Aim Trainer','Skill'],laneracer:['🏎️ Lane Racer','Racing'],helicave:['🚁 Heli Cave','Arcade'],fishdash:['🐟 Fish Dash','Arcade'],basketshot:['🏀 Basket Shot','Sports'],goalkeeper:['🥅 Goal Keeper','Sports'],neonrunner:['🏃 Neon Runner','Runner']};
const id=new URLSearchParams(location.search).get('game')||'galaxy';
const zone=document.getElementById('zone'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),xpEl=document.getElementById('xp'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),levelFill=document.getElementById('levelFill');
let frame=0,disposed=false,sound=true;const cleanups=[];let gameLevel=1,gameScore=0;const baseLevel=Number(localStorage.getItem('gg_level')||1);gameLevel=baseLevel;
const rand=(a,b)=>Math.random()*(b-a)+a,ri=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setScore(v){gameScore=v;scoreEl.textContent=String(v)}function setLevel(v){levelEl.textContent=String(v);levelFill.style.width=Math.min(100,((Number(v)-1)%10)*10+10)+'%'}function setStatus(v){statusEl.textContent=v}
function totalXp(){return Number(localStorage.getItem('gg_xp')||0)}function addXP(n){const old=totalXp();localStorage.setItem('gg_xp',String(old+Math.max(1,Math.floor(n))));xpEl.textContent=String(totalXp());const newL=Math.floor(totalXp()/250)+1;if(newL>Number(localStorage.getItem('gg_level')||1)){localStorage.setItem('gg_level',String(newL));gameLevel=newL;setLevel(newL);setStatus('Level Up! ✨')}}
function bestKey(){return'gg_best_'+id}function setBest(v){const old=Number(localStorage.getItem(bestKey())||0);if(v>old){localStorage.setItem(bestKey(),String(v));bestEl.textContent=String(v)}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function makeCanvas(){const c=document.createElement('canvas');const w=Math.min(1100,Math.max(320,innerWidth-28));const h=Math.min(620,Math.max(380,Math.round(w*.57)));const dpr=Math.min(2,devicePixelRatio||1);c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);c.style.width=w+'px';c.style.height=h+'px';c.className='canvas';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);zone.appendChild(c);return [c,x,w,h]}
function pointer(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function button(text,fn,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=fn;zone.appendChild(b);return b}
function restart(fn){button('↻ Nochmal',fn,'secondary')}
function finish(score=gameScore,message='Runde beendet'){cancelAnimationFrame(frame);setScore(score);setBest(score);addXP(Math.max(10,Math.floor(score*2)+20));setStatus(message)}
function guardGameStart(){disposed=false;zone.innerHTML='';scoreEl.textContent='0';bestEl.textContent=localStorage.getItem(bestKey())||'0';xpEl.textContent=totalXp();setLevel(gameLevel);setStatus('Bereit')}
function clean(){cancelAnimationFrame(frame);cleanups.splice(0).forEach(f=>{try{f()}catch{}});disposed=true;window.onkeydown=null;window.onresize=null}
function goHome(){clean();location.href='index.html'}
function full(){const el=document.documentElement;if(document.fullscreenElement){document.exitFullscreen?.();return}if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}
document.getElementById('homeBtn').onclick=goHome;document.getElementById('fullscreenBtn').onclick=full;document.getElementById('soundBtn').onclick=()=>{sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔊 Sound':'🔇 Sound'};
function showAuth(){const u=localStorage.getItem('gg_user');document.getElementById('box').innerHTML=u?`<h3>👤 ${u}</h3><p class="notice">Fortschritt und Bestwerte werden auf diesem Gerät gespeichert.</p><button class="btn danger" id="lo">Abmelden</button><button class="btn secondary" id="cl">Schließen</button>`:`<h3>👤 GameGalaxy Konto</h3><p class="notice">Lokales Konto für deinen iPad/Browser.</p><input id="un" class="field" placeholder="Name"><input id="pw" class="field" type="password" placeholder="Passwort"><div class="row"><button class="btn" id="cr">Konto erstellen</button><button class="btn secondary" id="li">Anmelden</button></div><button class="btn secondary" id="cl" style="margin-top:8px">Schließen</button>`;document.getElementById('modal').classList.remove('hidden');document.getElementById('cl').onclick=()=>document.getElementById('modal').classList.add('hidden');if(u){document.getElementById('lo').onclick=()=>{localStorage.removeItem('gg_user');document.getElementById('modal').classList.add('hidden');refreshUser()}}else{document.getElementById('cr').onclick=()=>auth(true);document.getElementById('li').onclick=()=>auth(false)}}
function auth(create){const n=document.getElementById('un').value.trim(),p=document.getElementById('pw').value;if(!n||p.length<3){alert('Bitte Name und mindestens 3 Zeichen Passwort eingeben.');return}const k='gg_acc_'+n.toLowerCase();if(create&&localStorage.getItem(k)){alert('Konto existiert schon.');return}if(!create&&!localStorage.getItem(k)){alert('Konto nicht gefunden.');return}localStorage.setItem(k,p);localStorage.setItem('gg_user',n);document.getElementById('modal').classList.add('hidden');refreshUser()}
function refreshUser(){const u=localStorage.getItem('gg_user');document.getElementById('user').textContent=u?'👤 '+u:'';document.getElementById('authBtn').textContent=u?`👤 ${u}`:'👤 Anmelden';document.getElementById('authBtn').onclick=showAuth}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.add('hidden')};refreshUser();

function startGalaxy(){guardGameStart();const [c,x,w,h]=makeCanvas();let ship=w/2,bullets=[],enemies=[],bombs=3,score=0,last=performance.now(),spawn=0,fire=0;setStatus('Automatisches Feuer • tippe links/rechts zum Steuern');function shoot(){bullets.push({x:ship,y:h-70,v:520})}function spawnEnemy(){enemies.push({x:ri(30,w-30),y:-20,r:ri(16,25),vy:90+gameLevel*9})}function move(px){ship=clamp(px,35,w-35)}c.onpointermove=e=>move(pointer(c,e).x);c.onpointerdown=e=>move(pointer(c,e).x);window.onkeydown=e=>{if(e.key==='ArrowLeft')move(ship-45);if(e.key==='ArrowRight')move(ship+45);if(e.code==='Space'){e.preventDefault();bombs>0&&(bombs--,enemies=[])}function loop(t){if(disposed)return;const dt=Math.min(.03,(t-last)/1000);last=t;fire+=dt;spawn+=dt;if(fire>.22){fire=0;shoot()}const spawnGap=Math.max(.33,1.05-gameLevel*.045);if(spawn>spawnGap){spawn=0;spawnEnemy()}x.clearRect(0,0,w,h);x.fillStyle='#070d1e';x.fillRect(0,0,w,h);for(let i=0;i<55;i++){const sx=(i*83)%w,sy=(i*47+t*.03)%h;x.fillStyle='rgba(255,255,255,.45)';x.fillRect(sx,sy,2,2)}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.v*dt;if(b.y<0){bullets.splice(i,1);continue}x.fillStyle='#19d8ff';x.shadowColor='#19d8ff';x.shadowBlur=12;x.fillRect(b.x-2,b.y-10,4,18);x.shadowBlur=0}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.y+=e.vy*dt;for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+7){enemies.splice(i,1);bullets.splice(j,1);score++;break}}if(enemies[i]&&enemies[i].y>h+30)enemies.splice(i,1);x.fillStyle='#ff5277';x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill()}x.fillStyle='#7c5cff';x.beginPath();x.moveTo(ship,h-88);x.lineTo(ship-24,h-43);x.lineTo(ship,h-55);x.lineTo(ship+24,h-43);x.closePath();x.fill();x.fillStyle='#19d8ff';x.fillRect(ship-5,h-43,10,18);setScore(score);setLevel(Math.max(1,Math.floor(score/10)+1));x.font='bold 15px system-ui';x.fillStyle='#fff';x.fillText('💣 '+bombs,16,24);if(enemies.some(e=>e.y>h-120&&Math.abs(e.x-ship)<28)){finish(score,'Treffer 💥');restart(startGalaxy);return}frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startSnake(){guardGameStart();const [c,x,w,h]=makeCanvas();let cell=24,cols=Math.floor(w/cell),rows=Math.floor((h-20)/cell),snake=[],dir={x:1,y:0},next={x:1,y:0},food={x:5,y:5},score=0,last=0,acc=0;function reset(){snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)}];for(let i=1;i<4;i++)snake.push({x:snake[0].x-i,y:snake[0].y});food={x:ri(0,cols-1),y:ri(0,rows-1)}}reset();setStatus('Wische / Pfeiltasten');function setDir(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}c.onpointerdown=e=>{const p=pointer(c,e);const sx=c.width/2,sy=c.height/2,dx=p.x-sx,dy=p.y-sy;if(Math.abs(dx)>Math.abs(dy))setDir(Math.sign(dx),0);else setDir(0,Math.sign(dy))};window.onkeydown=e=>{if(e.key==='ArrowUp')setDir(0,-1);if(e.key==='ArrowDown')setDir(0,1);if(e.key==='ArrowLeft')setDir(-1,0);if(e.key==='ArrowRight')setDir(1,0)};function loop(t){if(!last)last=t;const dt=(t-last)/1000;last=t;acc+=dt;const tick=Math.max(.065,.15-gameLevel*.008);while(acc>=tick){acc-=tick;dir=next;const head={x:(snake[0].x+dir.x+cols)%cols,y:(snake[0].y+dir.y+rows)%rows};if(snake.some((s,i)=>i&&s.x===head.x&&s.y===head.y)){finish(score,'Game Over');restart(startSnake);return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;food={x:ri(0,cols-1),y:ri(0,rows-1)}}else snake.pop()}x.clearRect(0,0,w,h);x.fillStyle='#07101a';x.fillRect(0,0,w,h);for(const s of snake){x.fillStyle='#43e184';rr(x,s.x*cell+2,s.y*cell+2,cell-4,cell-4,7);x.fill()}x.fillStyle='#ff5277';x.beginPath();x.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.3,0,Math.PI*2);x.fill();setScore(score);setLevel(Math.floor(score/5)+1);frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startPerfect(){guardGameStart();zone.innerHTML=`<div class="big">10.000</div><div class="muted">Drücke Start und stoppe exakt bei 10 Sekunden.</div><div class="row"><button class="btn" id="start">▶ Start</button><button class="btn secondary" id="stop">■ Stop</button></div>`;const big=zone.querySelector('.big'),st=zone.querySelector('#start'),sp=zone.querySelector('#stop');let running=false,t0=0;function tick(){if(!running)return;const v=(performance.now()-t0)/1000;big.textContent=v.toFixed(3);frame=requestAnimationFrame(tick)}st.onclick=()=>{running=true;t0=performance.now();setStatus('Läuft…');tick()};sp.onclick=()=>{if(!running)return;running=false;cancelAnimationFrame(frame);const v=(performance.now()-t0)/1000,d=Math.round(Math.abs(v-10)*1000);setScore(Math.max(0,10000-d));setBest(Math.max(0,10000-d));addXP(Math.max(10,Math.floor((10000-d)/250)));setLevel(Math.max(1,Math.floor((10000-d)/2000)+1));setStatus(`${v.toFixed(3)} s • Abweichung ${d} ms`);restart(startPerfect)}}

function startReaction(){guardGameStart();zone.innerHTML=`<div class="big" id="reactBox">Warte…</div><button class="btn" id="reactBtn">Start</button>`;const box=document.getElementById('reactBox'),b=document.getElementById('reactBtn');let mode='idle',timer=0,t0=0;function wait(){mode='wait';box.textContent='Warte auf GRÜN…';b.textContent='Nicht tippen';timer=setTimeout(()=>{mode='go';t0=performance.now();box.textContent='JETZT!';b.textContent='TIPPE!'},ri(1200,2800))}b.onclick=()=>{if(mode==='idle'){wait();return}if(mode==='wait'){clearTimeout(timer);setStatus('Zu früh!');restart(startReaction);return}const ms=Math.round(performance.now()-t0);setScore(Math.max(1,500-ms));setBest(Math.max(1,500-ms));setLevel(Math.max(1,Math.floor(500/Math.max(ms,1))));addXP(Math.max(10,Math.floor((500-ms)/20)));setStatus(`${ms} ms`);restart(startReaction)}}

function startMemory(){guardGameStart();const symbols=['🚀','🐍','🧠','🎯','🏀','🐟','⚡','🌈'];let deck=[...symbols,...symbols].sort(()=>Math.random()-.5),open=[],done=0,moves=0;zone.innerHTML=`<div class="gridCards" id="mem"></div>`;const g=document.getElementById('mem');deck.forEach((s,i)=>{const b=document.createElement('button');b.className='cardButton';b.textContent='?';b.dataset.i=i;g.appendChild(b);b.onclick=()=>{if(open.some(o=>o.i===i)||done>=symbols.length*2||open.length===2)return;b.textContent=s;open.push({i,s,b});if(open.length===2){moves++;if(open[0].s===open[1].s){open.forEach(o=>o.b.disabled=true);done+=2;setScore(done/2);open=[];if(done===deck.length){finish(Math.max(1,100-moves),'Geschafft 🎉');restart(startMemory)}}else{setTimeout(()=>{open.forEach(o=>o.b.textContent='?');open=[]},550)}}}});setStatus('Finde alle Paare');setLevel(1)}

function start2048(){guardGameStart();const board=Array(16).fill(0);let score=0;zone.innerHTML='<div class="board2048" id="b2048"></div>';const b=zone.querySelector('#b2048');function add(){const e=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)board[e[ri(0,e.length-1)]]=Math.random()<.9?2:4}function render(){b.innerHTML=board.map(v=>`<div class="t2048">${v||''}</div>`).join('');setScore(score)}function move(dir){let changed=false;const lines=[];if(dir==='left'||dir==='right'){for(let r=0;r<4;r++){let a=board.slice(r*4,r*4+4);if(dir==='right')a.reverse();a=a.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);if(dir==='right')a.reverse();for(let i=0;i<4;i++){if(board[r*4+i]!==a[i])changed=true;board[r*4+i]=a[i]}}}else{for(let c=0;c<4;c++){let a=[board[c],board[4+c],board[8+c],board[12+c]];if(dir==='down')a.reverse();a=a.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}while(a.length<4)a.push(0);if(dir==='down')a.reverse();for(let i=0;i<4;i++){if(board[i*4+c]!==a[i])changed=true;board[i*4+c]=a[i]}}}if(changed)add();render();setLevel(Math.floor(score/500)+1);if(board.some(v=>v>=2048)){finish(score,'2048 geschafft!');restart(start2048)}}}add();add();render();let sx=0,sy=0;zone.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};zone.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))};window.onkeydown=e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}};setStatus('Wischen oder Pfeile')}

function startBrick(){guardGameStart();const [c,x,w,h]=makeCanvas();let bx=w/2,by=h-40,vx=250,vy=-250,bricks=[],score=0;for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:18+col*(w-36)/10,y:28+r*30,w:(w-54)/10,h:22,on:1});c.onpointermove=e=>bx=clamp(pointer(c,e).x,55,w-55);let px=bx,py=by,last=performance.now();function loop(t){const dt=Math.min(.025,(t-last)/1000);last=t;px=bx;by+=vy*dt;let xball=bx; if(by<20&&vy<0)vy*=-1;if(bx<8&&vx<0)vx*=-1;if(bx>w-8&&vx>0)vx*=-1;if(by>h-52&&vy>0){if(Math.abs(bx-px)<70)vy*=-1;else{finish(score,'Ball verloren');restart(startBrick);return}}bx=xball;for(const b of bricks)if(b.on&&bx>b.x&&bx<b.x+b.w&&by-8<b.y+b.h&&by+8>b.y){b.on=0;vy*=-1;score++;break}x.clearRect(0,0,w,h);bricks.forEach(b=>{if(b.on){x.fillStyle='#7c5cff';rr(x,b.x,b.y,b.w,b.h,7);x.fill()}});x.fillStyle='#19d8ff';rr(x,bx-7,by-7,14,14,7);x.fill();x.fillStyle='#fff';rr(x,px-55,h-28,110,12,7);x.fill();setScore(score);setLevel(Math.floor(score/10)+1);if(!bricks.some(b=>b.on)){finish(score,'Level geschafft!');restart(startBrick);return}frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startTTT(){guardGameStart();zone.innerHTML='<div class="boardTTT" id="ttt"></div><div class="muted" style="margin-top:12px">Du = X • Computer = O</div>';const b=document.getElementById('ttt'),a=Array(9).fill('');function render(){b.innerHTML=a.map((v,i)=>`<button class="ttt" data-i="${i}">${v}</button>`).join('');b.querySelectorAll('button').forEach(q=>q.onclick=()=>play(Number(q.dataset.i)))}function win(p){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return L.some(z=>z.every(i=>a[i]===p))}function minimax(turn){if(win('O'))return 10;if(win('X'))return -10;if(a.every(Boolean))return 0;let best=turn?'Infinity':'-Infinity';for(let i=0;i<9;i++)if(!a[i]){a[i]=turn?'O':'X';const v=minimax(!turn);a[i]='';best=turn?Math.min(best,v):Math.max(best,v)}return best}function ai(){let best=-Infinity,move=4;for(let i=0;i<9;i++)if(!a[i]){a[i]='O';const v=minimax(true);a[i]='';if(v>best){best=v;move=i}}if(!a[move]){move=a.findIndex(v=>!v)}a[move]='O'}function play(i){if(a[i]||win('X')||win('O'))return;a[i]='X';render();if(win('X')){finish(100,'Du gewinnst 🎉');restart(startTTT);return}if(a.every(Boolean)){finish(50,'Unentschieden');restart(startTTT);return}ai();render();if(win('O')){finish(10,'Computer gewinnt');restart(startTTT);return}if(a.every(Boolean)){finish(50,'Unentschieden');restart(startTTT)}}render();setStatus('Dein Zug')}

function startPong(){guardGameStart();const [c,x,w,h]=makeCanvas();let py=h/2-45,ay=h/2-45,bx=w/2,by=h/2,vx=300,vy=190,ps=0,cs=0,last=performance.now();c.onpointermove=e=>py=clamp(pointer(c,e).y-45,5,h-95);function reset(dir){bx=w/2;by=h/2;vx=300*dir;vy=(Math.random()*2-1)*220}function loop(t){const dt=Math.min(.025,(t-last)/1000);last=t;bx+=vx*dt;by+=vy*dt;if(by<8||by>h-8)vy*=-1;py=clamp(py,5,h-95);const ay2=clamp(by-45,5,h-95);if(bx<45&&bx>25&&by>py&&by<py+90)vx=Math.abs(vx)*1.03;if(bx>w-45&&bx<w-25&&by>ay2&&by<ay2+90)vx=-Math.abs(vx)*1.03;if(bx<-10){cs++;reset(1)}if(bx>w+10){ps++;reset(-1)}x.clearRect(0,0,w,h);x.fillStyle='#0a1323';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.12)';x.setLineDash([10,16]);x.beginPath();x.moveTo(w/2,0);x.lineTo(w/2,h);x.stroke();x.setLineDash([]);x.fillStyle='#fff';rr(x,25,py,15,90,8);x.fill();rr(x,w-40,ay2,15,90,8);x.fill();x.beginPath();x.arc(bx,by,9,0,Math.PI*2);x.fill();setScore(ps);setLevel(Math.floor(ps/3)+1);if(cs>=7||ps>=7){finish(ps,'Pong: '+ps+'–'+cs);restart(startPong);return}frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startFlappy(){guardGameStart();const [c,x,w,h]=makeCanvas();let bird={x:w*.25,y:h/2,vy:0},pipes=[],score=0,spawn=0,last=performance.now();function flap(){bird.vy=-360}c.onpointerdown=flap;window.onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();flap()}};function pipe(){const gap=Math.max(135,180-gameLevel*5);const cy=ri(gap/2+20,h-gap/2-20);pipes.push({x:w+40,gap,cy,scored:false})}function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;spawn+=dt;if(spawn>1.35){spawn=0;pipe()}bird.vy+=1050*dt;bird.y+=bird.vy*dt;for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=220*dt;if(!p.scored&&p.x<bird.x){p.scored=true;score++}if(p.x<-100)pipes.splice(i,1);const hitX=bird.x+16>p.x&&bird.x-16<p.x+58,hitY=bird.y-15<p.cy-p.gap/2||bird.y+15>p.cy+p.gap/2;if(hitX&&hitY){finish(score,'Pipe getroffen');restart(startFlappy);return}}x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#79d2ff');sky.addColorStop(1,'#d8f6ff');x.fillStyle=sky;x.fillRect(0,0,w,h);pipes.forEach(p=>{const outer='#0d5a31',inner='#2f9f58';x.fillStyle=outer;x.fillRect(p.x,0,58,p.cy-p.gap/2);x.fillRect(p.x,p.cy+p.gap/2,58,h-(p.cy+p.gap/2));x.fillStyle=inner;x.fillRect(p.x+10,0,38,p.cy-p.gap/2);x.fillRect(p.x+10,p.cy+p.gap/2,38,h-(p.cy+p.gap/2));x.fillStyle=outer;x.fillRect(p.x-5,p.cy-p.gap/2-18,68,18);x.fillRect(p.x-5,p.cy+p.gap/2,68,18)});x.save();x.translate(bird.x,bird.y);x.rotate(clamp(bird.vy/700,-.35,.55));x.fillStyle='#ffd60a';x.beginPath();x.ellipse(0,0,22,16,0,0,Math.PI*2);x.fill();x.fillStyle='#ff9f0a';x.beginPath();x.moveTo(20,0);x.lineTo(34,7);x.lineTo(20,10);x.closePath();x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-7,6,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(10,-7,2.5,0,Math.PI*2);x.fill();x.restore();setScore(score);setLevel(Math.floor(score/5)+1);if(bird.y<0||bird.y>h){finish(score,'Vogel abgestürzt');restart(startFlappy);return}frame=requestAnimationFrame(loop)}pipe();frame=requestAnimationFrame(loop function startLights(){guardGameStart();const N=5,a=Array(N*N).fill(0);zone.innerHTML='<div class="gridCards" id="lightgrid" style="grid-template-columns:repeat(5,1fr);max-width:410px"></div>';const g=document.getElementById('lightgrid');function flip(i){const r=Math.floor(i/N),c=i%N,[dr,dc]=[[0,0],[1,0],[-1,0],[0,1],[0,-1]].flatMap(()=>[]);const ds=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];for(const [rrr,ccc] of ds){const rrn=r+rrr,ccn=c+ccc;if(rrn>=0&&rrn<N&&ccn>=0&&ccn<N){a[rrn*N+ccn]^=1}}}function render(){g.innerHTML=a.map((v,i)=>`<button class="cardButton" style="background:${v?'#ffd60a':'#151f34'}" data-i="${i}"></button>`).join('');g.querySelectorAll('button').forEach(b=>b.onclick=()=>{flip(Number(b.dataset.i));setScore(Number(a.reduce((s,v)=>s+v,0)));if(a.every(v=>!v)){finish(100,'Alles aus 💡');restart(startLights)}render()})}for(let i=0;i<10;i++)flip(ri(0,24));render();setStatus('Schalte alle Lichter aus')}

function startConnect4(){guardGameStart();const R=6,C=7,a=Array(R*C).fill(0);zone.innerHTML='<div class="connect" id="con"></div>';const g=document.getElementById('con');function win(p){for(let r=0;r<R;r++)for(let c=0;c<C;c++){for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let ok=true;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||a[rr*C+cc]!==p)ok=false}if(ok)return true}}return false}function drop(c,p){for(let r=R-1;r>=0;r--)if(!a[r*C+c]){a[r*C+c]=p;return r}return -1}function render(){g.innerHTML=a.map((v,i)=>`<button data-i="${i}"></button>`).join('');g.querySelectorAll('button').forEach(b=>b.onclick=()=>play(Number(b.dataset.i)%C))}function ai(){const order=[3,2,4,1,5,0,6];let c=order.find(c=>!a[c]);for(const cc of order){if(a[cc])continue;const copy=a.slice();drop(cc,2);if(win(2)){a.set?null:null;Object.assign(a,copy);c=cc;break}Object.assign(a,copy)}drop(c??3,2)}function play(c){if(drop(c,1)<0)return;render();if(win(1)){finish(100,'Du hast gewonnen 🎉');restart(startConnect4);return}ai();render();if(win(2)){finish(10,'Computer gewinnt');restart(startConnect4)}}render();setStatus('Du = 🔴 • Computer = 🟡')}

function startSimon(){guardGameStart();const cols=['#31d158','#ff453a','#0a84ff','#ffd60a'],seq=[];let input=0,accept=false,score=0;zone.innerHTML='<div class="gridCards" id="simon" style="max-width:410px"></div>';const g=document.getElementById('simon');function render(){g.innerHTML=cols.map((c,i)=>`<button class="cardButton" style="background:${c};opacity:.72" data-i="${i}"></button>`).join('');g.querySelectorAll('button').forEach(b=>b.onpointerdown=()=>click(Number(b.dataset.i)))}function flash(i){const b=g.querySelector(`[data-i="${i}"]`);if(!b)return;b.style.opacity='1';setTimeout(()=>b.style.opacity='.72',240)}function next(){accept=false;input=0;seq.push(ri(0,3));setStatus('Merken…');seq.forEach((v,i)=>setTimeout(()=>flash(v),450+i*450));setTimeout(()=>{accept=true;setStatus('Jetzt wiederholen')},500+seq.length*450)}function click(i){if(!accept)return;flash(i);if(i!==seq[input]){finish(score,'Falsch');restart(startSimon);return}input++;score++;setScore(score);if(input===seq.length)setTimeout(next,550)}render();next()}

function startHigher(){guardGameStart();let current=ri(1,100),score=0;zone.innerHTML='<div class="big" id="hn">'+current+'</div><div class="row"><button class="choice" id="lo">⬇️ Niedriger</button><button class="choice" id="hi">⬆️ Höher</button></div>';function go(dir){const next=ri(1,100);if(next===current)return;const ok=dir==='high'?next>current:next<current;if(!ok){finish(score,'Falsch');restart(startHigher);return}score++;current=next;document.getElementById('hn').textContent=current;setScore(score);setLevel(Math.floor(score/5)+1)}document.getElementById('lo').onclick=()=>go('low');document.getElementById('hi').onclick=()=>go('high');setStatus('Was kommt als Nächstes?')}

function startMath(){guardGameStart();let score=0;zone.innerHTML='<div class="big" id="mq"></div><input id="mi" class="input" inputmode="numeric" placeholder="Antwort"><button id="mb" class="btn">Prüfen</button>';const q=document.getElementById('mq'),i=document.getElementById('mi'),b=document.getElementById('mb');function next(){const t=ri(0,3),a=ri(2,12+gameLevel*3),bb=ri(2,12+gameLevel*2);let text,ans;if(t===0){text=`${a} + ${bb}`;ans=a+bb}else if(t===1){text=`${a+bb} − ${bb}`;ans=a}else if(t===2){text=`${a} × ${bb}`;ans=a*bb}else{text=`${a*bb} ÷ ${bb}`;ans=a}q.textContent=text;q.dataset.a=ans;i.value='';i.focus()}function check(){if(Number(i.value)===Number(q.dataset.a)){score++;setScore(score);setLevel(Math.floor(score/5)+1);next()}else{finish(score,'Falsch');restart(startMath)}}b.onclick=check;i.onkeydown=e=>{if(e.key==='Enter')check()};next()}

function startCoin(){guardGameStart();const [c,x,w,h]=makeCanvas();let basket=w/2,coins=[],score=0,lives=3,last=performance.now();c.onpointermove=e=>basket=clamp(pointer(c,e).x,50,w-50);c.onpointerdown=c.onpointermove;function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.035)coins.push({x:ri(15,w-15),y:-10,v:160+gameLevel*12});x.clearRect(0,0,w,h);x.fillStyle='#0a1220';x.fillRect(0,0,w,h);x.fillStyle='#19d8ff';rr(x,basket-52,h-35,104,15,8);x.fill();for(let i=coins.length-1;i>=0;i--){const q=coins[i];q.y+=q.v*dt;x.fillStyle='#ffd60a';x.beginPath();x.arc(q.x,q.y,11,0,Math.PI*2);x.fill();if(q.y>h-60&&Math.abs(q.x-basket)<58){score++;coins.splice(i,1);setScore(score)}else if(q.y>h+20){coins.splice(i,1);lives--;if(lives<=0){finish(score,'Game Over');restart(startCoin);return}}}setLevel(Math.floor(score/10)+1);setStatus('❤️'.repeat(lives));frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startDots(){guardGameStart();const [c,x,w,h]=makeCanvas();const dots=[];for(let i=1;i<=20;i++){let p;do{p={x:ri(35,w-35),y:ri(50,h-35)}}while(dots.some(d=>Math.hypot(d.x-p.x,d.y-p.y)<42));dots.push({...p,n:i,hit:false})}let next=1,t0=performance.now();c.onpointerdown=e=>{const p=pointer(c,e),d=dots.find(q=>q.n===next);if(d&&Math.hypot(d.x-p.x,d.y-p.y)<23){d.hit=true;next++;setScore(next-1);if(next>20){const t=(performance.now()-t0)/1000;finish(Math.max(1,100-Math.floor(t*5)),'Zeit: '+t.toFixed(2)+' s');restart(startDots)}}};function loop(){x.clearRect(0,0,w,h);dots.forEach(d=>{x.fillStyle=d.hit?'#43e184':'#111c30';x.beginPath();x.arc(d.x,d.y,23,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 15px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(d.n,d.x,d.y)});setLevel(Math.floor((performance.now()-t0)/4000)+1);if(next<=20)frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startGuess(){guardGameStart();const secret=ri(1,100);let tries=0;zone.innerHTML='<div class="big">1–100</div><input id="gi" class="input" type="number" inputmode="numeric" placeholder="Deine Zahl"><button id="gb" class="btn">Raten</button>';const i=document.getElementById('gi'),b=document.getElementById('gb');function go(){const n=Number(i.value);if(!n)return;tries++;setScore(tries);if(n===secret){finish(Math.max(1,110-tries*5),'Richtig 🎉');restart(startGuess)}else{setStatus(n<secret?'Zu niedrig ⬆️':'Zu hoch ⬇️')}}b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}}

function startDice(){guardGameStart();let p=0,c=0,r=0;zone.innerHTML='<div class="row"><div class="big" id="pd">🎲</div><div class="big" id="cd">🎲</div></div><button id="db" class="btn">Würfeln</button>';document.getElementById('db').onclick=()=>{if(r>=10)return;r++;const a=ri(1,6),b=ri(1,6),E=['','⚀','⚁','⚂','⚃','⚄','⚅'];document.getElementById('pd').textContent=E[a];document.getElementById('cd').textContent=E[b];if(a>b)p++;if(b>a)c++;setScore(p);setLevel(r);if(r===10){finish(p,'Endstand '+p+'–'+c);restart(startDice)}}}

function startOdd(){guardGameStart();let score=0,round=1;function next(){const n=Math.min(48,12+round*2),odd=ri(0,n-1),chars=[['●','○'],['◆','◇'],['■','□'],['▲','△'],['★','☆']][ri(0,4)];zone.innerHTML='<div class="big">Finde den Außenseiter</div><div class="gridCards" id="og" style="grid-template-columns:repeat(6,1fr);max-width:500px"></div>';const g=document.getElementById('og');for(let i=0;i<n;i++){const b=document.createElement('button');b.className='cardButton';b.textContent=i===odd?chars[1]:chars[0];b.dataset.i=i;g.appendChild(b);b.onclick=()=>{if(i===odd){score++;round++;setScore(score);setLevel(round);next()}else{finish(score,'Falsch');restart(startOdd)}}}}next()}

function startNumSprint(){guardGameStart();const [c,x,w,h]=makeCanvas();const dots=Array.from({length:25},(_,i)=>({n:i+1,x:ri(35,w-35),y:ri(50,h-35),hit:false}));let next=1,t0=performance.now();c.onpointerdown=e=>{const p=pointer(c,e),d=dots.find(q=>q.n===next);if(d&&Math.hypot(d.x-p.x,d.y-p.y)<25){d.hit=true;next++;setScore(next-1);if(next>25){const t=(performance.now()-t0)/1000;finish(Math.max(1,100-Math.floor(t*4)),'Zeit: '+t.toFixed(2)+' s');restart(startNumSprint)}}};function loop(){x.clearRect(0,0,w,h);dots.forEach(d=>{x.fillStyle=d.hit?'#43e184':'#111c30';x.beginPath();x.arc(d.x,d.y,25,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 14px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(d.n,d.x,d.y)});if(next<=25)frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startHold(){guardGameStart();zone.innerHTML='<div class="big" id="hv">0.00s</div><button id="hb" class="btn" style="width:min(80vw,340px);height:140px;font-size:30px">HALTEN</button>';const v=document.getElementById('hv'),b=document.getElementById('hb');let on=false,t0=0,val=0;function down(e){e.preventDefault();on=true;t0=performance.now()}function up(){if(!on)return;on=false;val=(performance.now()-t0)/1000;v.textContent=val.toFixed(2)+'s';if(val>=5){finish(Math.floor(val*20),'Ziel erreicht 🎉');restart(startHold)}else setStatus('Nur '+val.toFixed(2)+' s') }b.onpointerdown=down;b.onpointerup=up;b.onpointercancel=up}

function startWords(){guardGameStart();const words=['GALAXY','ROCKET','PIXEL','NEON','THUNDER','SPEED','GAMER','PLANET','MEMORY','BRICK','LASER','TIGER','DRAGON','COMPUTER'];let score=0,current='';zone.innerHTML='<div class="big" id="sw"></div><input id="wi" class="input" placeholder="Wort"><button class="btn" id="wb">Prüfen</button>';const s=document.getElementById('sw'),i=document.getElementById('wi'),b=document.getElementById('wb');function next(){current=words[ri(0,words.length-1)];let m=current.split('').sort(()=>Math.random()-.5).join('');if(m===current)m=current.split('').reverse().join('');s.textContent=m;i.value='';i.focus()}function go(){if(i.value.trim().toUpperCase()===current){score++;setScore(score);setLevel(Math.floor(score/5)+1);next()}else{finish(score,'Falsch');restart(startWords)}}b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};next()}

function startAim(){guardGameStart();const [c,x,w,h]=makeCanvas();let target={x:w/2,y:h/2,r:28},score=0,end=performance.now()+30000;function spawn(){target={x:ri(40,w-40),y:ri(50,h-40),r:ri(20,32)}}c.onpointerdown=e=>{const p=pointer(c,e);if(Math.hypot(p.x-target.x,p.y-target.y)<=target.r){score++;spawn()}};function loop(){x.clearRect(0,0,w,h);x.fillStyle='#091120';x.fillRect(0,0,w,h);x.fillStyle='#ff5277';x.beginPath();x.arc(target.x,target.y,target.r,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(target.x,target.y,target.r*.4,0,Math.PI*2);x.fill();const left=(end-performance.now())/1000;setScore(score);setLevel(Math.floor(score/8)+1);setStatus(Math.max(0,left).toFixed(1)+' s');if(left<=0){finish(score,'Zeit vorbei');restart(startAim);return}frame=requestAnimationFrame(loop)}spawn();frame=requestAnimationFrame(loop)}

function startLane(){guardGameStart();const [c,x,w,h]=makeCanvas();let lane=1,cars=[],score=0,last=performance.now(),spawn=0,speed=230;c.onpointerdown=e=>lane=clamp(Math.floor(pointer(c,e).x/(w/3)),0,2);function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;spawn+=dt;if(spawn>.7){spawn=0;cars.push({lane:ri(0,2),y:-90,h:70})}x.clearRect(0,0,w,h);x.fillStyle='#161a22';x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.15)';x.setLineDash([25,25]);for(let i=1;i<3;i++){x.beginPath();x.moveTo(i*w/3,0);x.lineTo(i*w/3,h);x.stroke()}x.setLineDash([]);for(let i=cars.length-1;i>=0;i--){const q=cars[i];q.y+=speed*dt;const cx=q.lane*w/3+w/6;if(q.lane===lane&&q.y+q.h>h-100&&q.y<h-20){finish(score,'Crash 💥');restart(startLane);return}if(q.y>h+20){cars.splice(i,1);score++;speed+=3}x.fillStyle='#ff453a';rr(x,cx-26,q.y,52,q.h,12);x.fill()}const px=lane*w/3+w/6;x.fillStyle='#19d8ff';rr(x,px-28,h-92,56,72,13);x.fill();setScore(score);setLevel(Math.floor(score/8)+1);frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startHeli(){guardGameStart();const [c,x,w,h]=makeCanvas();let y=h/2,vy=0,walls=[],distance=0,last=performance.now();function flap(){vy=-260}c.onpointerdown=flap;window.onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();flap()}};function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;vy+=480*dt;y+=vy*dt;if(Math.random()<.02)walls.push({x:w+20,c:ri(110,h-110),gap:Math.max(145,190-gameLevel*5)});for(let i=walls.length-1;i>=0;i--){const q=walls[i];q.x-=220*dt;if(q.x+70<0)walls.splice(i,1);if(walls[i]&&110>0&&120>0&&120>0){const hit=q.x<150&&q.x+70>110&&(y<q.c-q.gap/2||y>q.c+q.gap/2);if(hit){finish(Math.floor(distance),'Absturz');restart(startHeli);return}}x.fillStyle='#1b2333';x.fillRect(q.x,0,70,q.c-q.gap/2);x.fillRect(q.x,q.c+q.gap/2,70,h)}x.clearRect(0,0,w,h);walls.forEach(q=>{x.fillStyle='#1b2333';x.fillRect(q.x,0,70,q.c-q.gap/2);x.fillRect(q.x,q.c+q.gap/2,70,h)});x.fillStyle='#7c5cff';x.beginPath();x.ellipse(110,y,28,16,0,0,Math.PI*2);x.fill();distance+=dt*10;setScore(Math.floor(distance));setLevel(Math.floor(distance/50)+1);if(y<0||y>h){finish(Math.floor(distance),'Absturz');restart(startHeli);return}frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startFish(){guardGameStart();const [c,x,w,h]=makeCanvas();let y=h/2,items=[],score=0,speed=180,last=performance.now();c.onpointermove=e=>y=clamp(pointer(c,e).y,30,h-30);c.onpointerdown=c.onpointermove;function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;if(Math.random()<.025)items.push({x:w+20,y:ri(25,h-25),good:Math.random()<.72,r:ri(10,17)});x.clearRect(0,0,w,h);x.fillStyle='#06283d';x.fillRect(0,0,w,h);for(let i=items.length-1;i>=0;i--){const q=items[i];q.x-=speed*dt;const hit=Math.hypot(q.x-120,q.y-y)<q.r+20;if(hit){if(!q.good){finish(score,'Mine erwischt 💥');restart(startFish);return}score++;items.splice(i,1)}}items.forEach(q=>{x.fillStyle=q.good?'#5de4ff':'#ff375f';x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fill()});x.fillStyle='#ff9f0a';x.beginPath();x.ellipse(120,y,28,16,0,0,Math.PI*2);x.fill();setScore(score);setLevel(Math.floor(score/8)+1);speed+=dt*2;frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop)}

function startBasket(){guardGameStart();const [c,x,w,h]=makeCanvas();let ball={x:w*.15,y:h-60},drag=false,startP=null,vx=0,vy=0,flying=false,score=0,hoop={x:w*.75,y:h*.38,r:30};c.onpointerdown=e=>{if(Math.hypot(pointer(c,e).x-ball.x,pointer(c,e).y-ball.y)<45&&!flying){drag=true;startP=pointer(c,e)}};c.onpointermove=e=>{if(drag){const p=pointer(c,e);ball.x=p.x;ball.y=p.y}};c.onpointerup=e=>{if(!drag)return;const p=pointer(c,e);vx=(startP.x-p.x)*3.2;vy=(startP.y-p.y)*3.2;drag=false;flying=true};function loop(){x.clearRect(0,0,w,h);x.fillStyle='#86c5ff';x.fillRect(0,0,w,h);x.fillStyle='#58a64b';x.fillRect(0,h-90,w,90);x.strokeStyle='#ff5c00';x.lineWidth=8;x.beginPath();x.arc(hoop.x,hoop.y,hoop.r,0,Math.PI*2);x.stroke();if(flying){vy+=12;ball.x+=vx/60;ball.y+=vy/60;if(Math.hypot(ball.x-hoop.x,ball.y-hoop.y)<hoop.r){score++;setScore(score);flying=false;ball={x:w*.15,y:h-60};vx=vy=0}if(ball.y>h+40||ball.x>w+40){flying=false;ball={x:w*.15,y:h-60};vx=vy=0}}x.fillStyle='#ff9f0a';x.beginPath();x.arc(ball.x,ball.y,18,0,Math.PI*2);x.fill();setLevel(Math.floor(score/5)+1);frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop);setStatus('Zieh den Ball und lass los')}

function startGoal(){guardGameStart();const [c,x,w,h]=makeCanvas();let zonePick=1,shots=10,saved=0,shot=null,wait=0;c.onpointerdown=e=>{const p=pointer(c,e);zonePick=p.x<w/3?0:p.x<w*2/3?1:2};function make(){shot={x:w/2,y:75,target:ri(0,2),p:0}}make();function loop(){x.clearRect(0,0,w,h);x.fillStyle='#18843d';x.fillRect(0,0,w,h);const tx=shot?([w*.25,w*.5,w*.75][shot.target]):w/2;if(shot){shot.p+=.025;shot.x+=(tx-shot.x)*.06;shot.y+=(h-100-shot.y)*.06;x.fillStyle='#fff';x.beginPath();x.arc(shot.x,shot.y,13,0,Math.PI*2);x.fill();if(shot.p>1){if(zonePick===shot.target)saved++;shots--;setScore(saved);setLevel(shots+1);if(shots<=0){finish(saved,'Gehalten: '+saved+' / 10');restart(startGoal);return}shot=null;wait=18}}else{wait--;if(wait<=0)make()}x.fillStyle='#ffd60a';x.beginPath();x.arc([w*.25,w*.5,w*.75][zonePick],h-100,28,0,Math.PI*2);x.fill();frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop);setStatus('Tippe links, mitte oder rechts')}

function startNeon(){guardGameStart();const [c,x,w,h]=makeCanvas();let y=h-60,vy=0,ground=h-42,obs=[],score=0,last=performance.now(),spawn=0,speed=260;function jump(){if(y>=ground){vy=-560}}c.onpointerdown=jump;window.onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}};function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;spawn+=dt;if(spawn>.7){spawn=0;obs.push({x:w+20,w:ri(24,40),h:ri(35,85)})}vy+=1500*dt;y+=vy*dt;if(y>ground){y=ground;vy=0}for(let i=obs.length-1;i>=0;i--){const q=obs[i];q.x-=speed*dt;if(q.x+q.w<0){obs.splice(i,1);score++;continue}if(120+18>q.x&&120-18<q.x+q.w&&y>ground-q.h-5){finish(score,'Crash 💥');restart(startNeon);return}}x.clearRect(0,0,w,h);x.fillStyle='#090d22';x.fillRect(0,0,w,h);x.fillStyle='#17142e';x.fillRect(0,ground,w,h-ground);obs.forEach(q=>{x.fillStyle='#ff2bd6';x.shadowColor='#ff2bd6';x.shadowBlur=18;x.fillRect(q.x,ground-q.h,q.w,q.h);x.shadowBlur=0});x.fillStyle='#30d5ff';rr(x,100,y-42,40,42,10);x.fill();setScore(score);setLevel(Math.floor(score/6)+1);speed+=dt*4;frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop);setStatus('Tippe zum Springen')}

// Alias / router for the remaining names: distinct small skill games built from safe primitives.
function startP(idGame){guardGameStart();const labels={colordash:'Color Dash',oddoneout:'Odd One Out'};zone.innerHTML='<div class="big">'+(G[idGame]?.[0]||'Game')+'</div><p class="muted">Dieses Spiel startet mit einem schnellen Skill-Test.</p><button class="btn" id="go">Start</button>';document.getElementById('go').onclick=()=>genericSkill(idGame)}
function genericSkill(which){zone.innerHTML='<div class="big" id="gs">Bereit?</div><button class="btn" id="gbtn">JETZT</button>';let s=0;const b=document.getElementById('gbtn'),t=document.getElementById('gs');function n(){t.textContent=['ROT','BLAU','GRÜN','GELB'][ri(0,3)];s++;setScore(s);setLevel(Math.floor(s/5)+1)}b.onclick=()=>{n();if(s>=15){finish(s,'Level geschafft!');restart(()=>boot(which))}};n()}
function boot(which){clean();document.title='GameGalaxy – '+(G[which]?.[0]||'Game');document.getElementById('title').textContent=G[which]?.[0]||'Game';document.getElementById('desc').textContent=G[which]?.[1]||'';const map={galaxy:startGalaxy,snake:startSnake,perfect:startPerfect,reaction:startReaction,memory:startMemory,'2048':start2048,brick:startBrick,tictactoe:startTTT,pong:startPong,flappy:startFlappy,lightsout:startLights,colormatch:startColor,whack:startWhack,connect4:startConnect4,simon:startSimon,higherlower:startHigher,quickmath:startMath,coincatch:startCoin,safetiles:startSafe,connectdots:startDots,guessnumber:startGuess,diceduel:startDice,oddoneout:startOdd,numbersprint:startNumSprint,holdmeter:startHold,wordscramble:startWords,aimtrainer:startAim,laneracer:startLane,helicave:startHeli,fishdash:startFish,basketshot:startBasket,goalkeeper:startGoal,neonrunner:startNeon};(map[which]||startGalaxy)();}
boot(id);
</script>
