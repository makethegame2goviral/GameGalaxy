<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>GameGalaxy – Browser Games</title>
<style>
:root{--bg:#050814;--panel:rgba(15,23,42,.82);--panel2:#111b2e;--text:#f7f9ff;--muted:#91a2bb;--line:rgba(255,255,255,.09);--a:#7c5cff;--b:#19d8ff;--good:#43e184;--danger:#ff5277;--shadow:0 24px 80px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,#26376d 0,transparent 32%),radial-gradient(circle at 100% 0,#123d5e 0,transparent 28%),linear-gradient(160deg,#080b15 0,#050814 65%,#03050b 100%);overflow-x:hidden}button,input{font:inherit}button{touch-action:manipulation}.top{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:rgba(5,8,20,.78);backdrop-filter:blur(18px)}.topin{max-width:1380px;margin:auto;padding:14px 18px;display:flex;gap:12px;align-items:center}.logo{font-weight:950;font-size:25px;letter-spacing:-.8px;white-space:nowrap}.logo span{color:var(--b)}.spacer{flex:1}.searchWrap{position:relative;flex:1;max-width:520px}.search{width:100%;padding:13px 44px 13px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(16,25,43,.92);color:#fff;outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:.2s}.search:focus{border-color:rgba(25,216,255,.5);box-shadow:0 0 0 4px rgba(25,216,255,.07)}.searchIcon{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.65}.btn{border:1px solid var(--line);border-radius:14px;padding:11px 15px;color:#fff;background:linear-gradient(135deg,#785dfb,#5c41d6);font-weight:850;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(108,92,231,.25);border-color:rgba(255,255,255,.17)}.btn.secondary{background:#10182a}.btn.ghost{background:rgba(255,255,255,.04)}.profileBtn{display:flex;align-items:center;gap:8px}.wrap{max-width:1380px;margin:auto;padding:24px 18px 40px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;padding:30px;background:linear-gradient(135deg,rgba(30,40,80,.82),rgba(10,17,31,.88));box-shadow:var(--shadow)}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(4px);pointer-events:none}.hero:before{width:250px;height:250px;right:-80px;top:-100px;background:rgba(25,216,255,.16)}.hero:after{width:220px;height:220px;left:-100px;bottom:-120px;background:rgba(124,92,255,.18)}.heroContent{position:relative;z-index:1}.eyebrow{color:#8eeeff;font-weight:850;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.hero h1{margin:8px 0 8px;font-size:clamp(32px,5vw,58px);line-height:1.03;letter-spacing:-1.7px}.hero p{margin:0;color:#b3c0d4;max-width:760px;font-size:17px}.heroActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.heroStats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(8,14,26,.58);color:#c7d1df}.stat b{color:#fff}.sectionHead{display:flex;gap:16px;align-items:end;justify-content:space-between;margin:30px 0 12px}.sectionHead h2{margin:0;font-size:27px;letter-spacing:-.7px}.sectionHead span{color:var(--muted);font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#b9c6d8;padding:9px 12px;border-radius:999px;cursor:pointer}.filter.active{background:rgba(124,92,255,.2);color:#fff;border-color:rgba(124,92,255,.5)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{position:relative;min-height:195px;padding:17px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(17,27,46,.96),rgba(9,15,26,.96));box-shadow:0 12px 36px rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}.card:before{content:"";position:absolute;inset:-1px;background:radial-gradient(circle at 100% 0,rgba(25,216,255,.08),transparent 35%),radial-gradient(circle at 0 100%,rgba(124,92,255,.1),transparent 32%);pointer-events:none}.card:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.35);box-shadow:0 20px 46px rgba(0,0,0,.27)}.cardTop{display:flex;justify-content:space-between;gap:10px}.icon{font-size:42px;line-height:1}.heart{opacity:.7;cursor:pointer;font-size:20px}.heart.on{opacity:1}.card h3{margin:13px 0 3px;font-size:19px}.tag{font-size:12px;color:#8fa1b9}.cardBottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.playMini{flex:1}.best{color:#aebbd0;font-size:12px}.empty{padding:35px;border:1px dashed var(--line);border-radius:22px;text-align:center;color:var(--muted);grid-column:1/-1}.footer{padding:38px 0 8px;color:#72839b;text-align:center}.modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(14px)}.modal.hidden{display:none}.box{width:min(480px,100%);border:1px solid var(--line);border-radius:25px;padding:22px;background:#0d1525;box-shadow:var(--shadow)}.box h3{margin-top:0}.field{width:100%;padding:13px 14px;margin:7px 0 10px;border:1px solid var(--line);border-radius:14px;background:#091120;color:#fff;outline:0}.field:focus{border-color:rgba(25,216,255,.5);box-shadow:0 0 0 4px rgba(25,216,255,.07)}.notice{padding:12px 14px;border-radius:14px;background:#0a1220;color:#a9b7ca;font-size:13px}.codeList{display:grid;gap:8px}.codeRow{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#0a1220}.codeRow code{color:#8eeeff}.fadeIn{animation:fadeIn .45s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.topin{flex-wrap:wrap}.searchWrap{order:3;flex-basis:100%;max-width:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:23px;border-radius:24px}}@media(max-width:500px){.grid{gap:10px}.card{min-height:170px;padding:13px}.icon{font-size:34px}.card h3{font-size:16px}.hero h1{font-size:38px}.hero p{font-size:15px}.heroActions .btn{flex:1}.sectionHead{align-items:flex-start;flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="logo">Game<span>Galaxy</span> 🚀</div><div class="spacer"></div>
  <div class="searchWrap"><input id="search" class="search" placeholder="🔎 Spiel oder Secret-Code suchen …" autocomplete="off"><span class="searchIcon">⌕</span></div>
  <button class="btn secondary profileBtn" id="loginBtn">👤 Anmelden</button>
</div></header>
<main class="wrap">
  <section class="hero fadeIn"><div class="heroContent">
    <div class="eyebrow">Dein Browser-Arcade</div><h1>Smooth Games.<br>Null Download.</h1>
    <p>33 schnelle Spiele, Levelmodus, Fullscreen, iPad-Steuerung und Secret Codes – direkt im Browser.</p>
    <div class="heroActions"><button class="btn" onclick="openFirstGame()">🎮 Spielen</button><button class="btn secondary" id="secretBtn">🔐 Secret Codes</button></div>
    <div class="heroStats"><div class="stat">⭐ Level <b id="heroLevel">1</b></div><div class="stat">✨ XP <b id="heroXp">0</b></div><div class="stat">❤️ Favoriten <b id="heroFav">0</b></div></div>
  </div></section>

  <section class="sectionHead"><div><h2>Alle Spiele</h2><span id="resultInfo">33 Spiele</span></div><div class="filters" id="filters"></div></section>
  <section id="grid" class="grid"></section>

  <footer class="footer">Yusuf 7d Creator</footer>
</main>
<div id="modal" class="modal hidden"><div id="box" class="box"></div></div>
<script>
const games=[
['galaxy','🚀','Galaxy Blaster','Arcade',['rocket','space','galaxy']],['snake','🐍','Snake','Classic',['snake','schlange']],['perfect','⏱️','Perfect Time','Skill',['time','zeit']],['reaction','⚡','Reaction Rush','Speed',['reaction','reaktion']],['memory','🧠','Memory','Brain',['memory','paare']],['2048','🔢','2048','Puzzle',['zahlen','puzzle']],['brick','🧱','Brick Blast','Arcade',['brick','breakout']],['tictactoe','⭕','Tic-Tac-Toe','Strategy',['tic','tac','nought']],['pong','🏓','Pong','Classic',['pong']],['flappy','🐦','Flappy Sky','Skill',['flappy','bird','vogel']],['lightsout','💡','Lights Out','Puzzle',['lights']],['colormatch','🎨','Color Match','Speed',['farbe','color']],['whack','🔨','Whack Spot','Skill',['whack','hammer']],['connect4','🟡','Vier Gewinnt','Strategy',['connect','4','vier']],['simon','🔊','Simon','Memory',['simon']],['higherlower','🃏','Higher or Lower','Cards',['higher','lower','cards']],['quickmath','🧮','Quick Math','Math',['math','rechnen']],['coincatch','🪙','Coin Catch','Arcade',['coin','münzen']],['safetiles','💣','Safe Tiles','Memory',['bomb','mine','safe']],['connectdots','🔵','Connect Dots','Speed',['dots','punkte']],['guessnumber','🔢','Guess the Number','Brain',['guess','zahlen']],['diceduel','🎲','Dice Duel','Dice',['dice','würfel']],['oddoneout','🟣','Odd One Out','Speed',['odd','anders']],['numbersprint','🔢','Number Sprint','Speed',['number','sprint']],['holdmeter','💪','Hold Meter','Skill',['hold','halten']],['wordscramble','🔤','Word Scramble','Words',['word','wort']],['aimtrainer','🎯','Aim Trainer','Skill',['aim','ziel']],['laneracer','🏎️','Lane Racer','Racing',['racer','rennen']],['helicave','🚁','Heli Cave','Arcade',['helicopter','höhle']],['fishdash','🐟','Fish Dash','Arcade',['fish','fisch']],['basketshot','🏀','Basket Shot','Sports',['basket','basketball']],['goalkeeper','🥅','Goal Keeper','Sports',['goal','torwart']],['neonrunner','🏃','Neon Runner','Runner',['runner','neon']]
];
const categories=['Alle','Arcade','Classic','Skill','Speed','Brain','Puzzle','Strategy','Cards','Math','Memory','Sports','Runner','Racing','Dice','Words'];
const secrets={
 '6 7':'6/7-Effekt: Bildschütteln + 6/7-Animation','low taper fade':'Langsame Rasierklingen-Animation','minecraft':'TNT-Animation mit Explosion','yusufcreater':'Zeigt alle Secret-Codes','galaxyghost':'Geistermodus','neonparty':'Neon-Party','pixelstorm':'Pixel-Sturm','moonwalk':'Mondlauf-Effekt','rainbow':'Regenbogenmodus','indiebox':'Indie-Box-Effekt'
};
let category='Alle';
const grid=document.getElementById('grid'),search=document.getElementById('search');
const favs=()=>JSON.parse(localStorage.getItem('gg_favs')||'[]');
function saveFavs(a){localStorage.setItem('gg_favs',JSON.stringify(a));updateHero()}
function xp(){return Number(localStorage.getItem('gg_xp')||0)}
function playerLevel(){return Math.floor(xp()/250)+1}
function updateHero(){document.getElementById('heroLevel').textContent=playerLevel();document.getElementById('heroXp').textContent=xp();document.getElementById('heroFav').textContent=favs().length}
function addXP(n){localStorage.setItem('gg_xp',String(xp()+Math.max(0,Math.floor(n))));updateHero()}
function openGame(id){localStorage.setItem('gg_last',id);location.href='game.html?game='+encodeURIComponent(id)}
function openFirstGame(){openGame(localStorage.getItem('gg_last')||'galaxy')}
function renderFilters(){document.getElementById('filters').innerHTML=categories.map(c=>`<button class="filter ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()})}
function render(){renderFilters();const q=search.value.trim().toLowerCase();let list=games.filter(g=>category==='Alle'||g[3]===category);if(q)list=list.filter(g=>(g[2]+' '+g[3]+' '+g[4].join(' ')).toLowerCase().includes(q));document.getElementById('resultInfo').textContent=`${list.length} Spiel${list.length===1?'':'e'}`;if(!list.length){grid.innerHTML='<div class="empty">Kein Spiel gefunden. Probier einen anderen Suchbegriff oder einen Secret-Code.</div>';return}grid.innerHTML=list.map((g,i)=>{const on=favs().includes(g[0]);const best=Number(localStorage.getItem('gg_best_'+g[0])||0);return `<article class="card fadeIn" style="animation-delay:${Math.min(i*18,180)}ms"><div><div class="cardTop"><div class="icon">${g[1]}</div><button class="heart ${on?'on':''}" data-fav="${g[0]}" aria-label="Favorit">${on?'⭐':'☆'}</button></div><h3>${g[2]}</h3><div class="tag">${g[3]}${best?` • Bestwert ${best}`:''}</div></div><div class="cardBottom"><div class="best">Level ${playerLevel()}</div><button class="btn playMini" data-play="${g[0]}">Spielen</button></div></article>`}).join('');grid.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>openGame(b.dataset.play));grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav,a=favs(),idx=a.indexOf(id);idx>=0?a.splice(idx,1):a.push(id);saveFavs(a);render()})}
search.oninput=()=>{const raw=search.value.trim().toLowerCase();if(secrets[raw])showSecretEffect(raw);render()};
function openModal(html){document.getElementById('box').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function showAuth(){const user=localStorage.getItem('gg_user');if(user){openModal(`<h3>👤 ${escapeHtml(user)}</h3><p class="notice">Dein Fortschritt wird auf diesem Gerät gespeichert.</p><button class="btn danger" id="logout">Abmelden</button> <button class="btn secondary" id="closeM">Schließen</button>`);document.getElementById('logout').onclick=()=>{localStorage.removeItem('gg_user');closeModal();refreshAuth()};document.getElementById('closeM').onclick=closeModal;return}openModal(`<h3>Willkommen bei GameGalaxy</h3><p class="notice">Anmelden oder kostenloses lokales Konto erstellen.</p><input id="loginName" class="field" placeholder="Name"><input id="loginPass" class="field" type="password" placeholder="Passwort"><div class="heroActions"><button class="btn" id="create">Konto erstellen</button><button class="btn secondary" id="login">Anmelden</button></div><button class="btn ghost" id="closeM" style="margin-top:8px;width:100%">Schließen</button>`);document.getElementById('closeM').onclick=closeModal;document.getElementById('create').onclick=()=>auth(true);document.getElementById('login').onclick=()=>auth(false)}
function auth(create){const n=document.getElementById('loginName').value.trim(),p=document.getElementById('loginPass').value;if(!n||p.length<3){alert('Bitte Name und mindestens 3 Zeichen Passwort eingeben.');return}const key='gg_account_'+n.toLowerCase();if(create&&localStorage.getItem(key)){alert('Dieses Konto gibt es schon.');return}if(!create&&!localStorage.getItem(key)){alert('Konto nicht gefunden.');return}localStorage.setItem(key,p);localStorage.setItem('gg_user',n);closeModal();refreshAuth()}
function refreshAuth(){const u=localStorage.getItem('gg_user');document.getElementById('loginBtn').textContent=u?`👤 ${u}`:'👤 Anmelden';document.getElementById('loginBtn').onclick=showAuth}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]))}
function showSecrets(){openModal(`<h3>🔐 Secret-Codes</h3><div class="codeList">${Object.entries(secrets).map(([c,d])=>`<div class="codeRow"><code>${c}</code><span>${d}</span></div>`).join('')}</div><p class="notice">Du kannst einen Code direkt oben ins Suchfeld schreiben.</p><button class="btn secondary" id="closeM">Schließen</button>`);document.getElementById('closeM').onclick=closeModal}
document.getElementById('secretBtn').onclick=showSecrets;
function showSecretEffect(code){if(code==='yusufcreater'){showSecrets();return}const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:2000;pointer-events:none;overflow:hidden';document.body.appendChild(o);if(code==='6 7'){document.body.animate([{transform:'translate(0,0)'},{transform:'translate(8px,-5px)'},{transform:'translate(-9px,6px)'},{transform:'translate(5px,3px)'},{transform:'translate(0,0)'}],{duration:700});[6,7,6,7,7,6].forEach((n,i)=>{const e=document.createElement('div');e.textContent=n;e.style.cssText=`position:absolute;left:${12+i*14}%;bottom:-80px;font-size:${36+i*5}px;font-weight:900;color:${i%2?'#19d8ff':'#7c5cff'};text-shadow:0 0 20px currentColor;transition:transform 1.8s cubic-bezier(.2,.8,.2,1),opacity 1.8s`;o.appendChild(e);requestAnimationFrame(()=>{e.style.transform=`translateY(-${220+i*42}px) rotate(${i%2?-20:18}deg)`;e.style.opacity='0'});});}else{const e=document.createElement('div');e.style.cssText='position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(32px,8vw,90px);font-weight:950;text-align:center';if(code==='low taper fade'){e.textContent='🪒 LOW TAPER FADE';e.animate([{transform:'translateY(100vh)'},{transform:'translateY(0)'},{transform:'translateY(-100vh)'}],{duration:2200,easing:'ease-in-out'});}else if(code==='minecraft'){e.textContent='🧨 TNT';e.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(2.8)',opacity:0}],{duration:1300});setTimeout(()=>{e.textContent='💥';e.style.fontSize='180px'},900)}else if(code==='yusufcreater'){e.textContent='🔐 SECRET CODES';}else if(code==='rainbow'){e.textContent='🌈 RAINBOW';document.documentElement.animate([{filter:'hue-rotate(0deg)'},{filter:'hue-rotate(360deg)'}],{duration:1800});}else{e.textContent='✨ '+code.toUpperCase();e.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1)',opacity:1},{transform:'scale(1.08)',opacity:0}],{duration:1600});}o.appendChild(e)}setTimeout(()=>o.remove(),2400)}
updateHero();render();refreshAuth();
</script>
</body>
</html>
