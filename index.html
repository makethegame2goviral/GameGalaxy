<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>GameGalaxy – Browser Games</title>
<style>
:root{--bg:#050814;--panel:#0e1627;--panel2:#101b30;--text:#f7faff;--muted:#95a7c0;--line:rgba(255,255,255,.09);--a:#7c5cff;--b:#19d8ff;--good:#43e184;--danger:#ff5277;--shadow:0 25px 70px rgba(0,0,0,.36)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% -10%,#26376d 0,transparent 35%),radial-gradient(circle at 100% 0,#123b58 0,transparent 30%),linear-gradient(160deg,#080b15,#050814 70%,#03050b);overflow-x:hidden;transition:filter .5s}button,input{font:inherit}button{touch-action:manipulation}.rainbowMode{background:linear-gradient(120deg,#ff3158,#ff9f0a,#ffe600,#2fe477,#19d8ff,#7c5cff,#ff3bd4,#ff3158);background-size:900% 900%;animation:rainbowBg 9s linear infinite}.top{position:sticky;top:0;z-index:50;background:rgba(5,8,20,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:1450px;margin:auto;padding:13px 18px;display:flex;gap:10px;align-items:center}.logo{font-size:25px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--b)}.spacer{flex:1}.searchWrap{position:relative;flex:1;max-width:560px}.search{width:100%;padding:13px 48px 13px 16px;border-radius:16px;border:1px solid var(--line);background:#10192a;color:#fff;outline:0}.search:focus{border-color:rgba(25,216,255,.5);box-shadow:0 0 0 4px rgba(25,216,255,.08)}.searchIcon{position:absolute;right:15px;top:50%;transform:translateY(-50%);opacity:.6}.btn{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 15px;color:#fff;background:linear-gradient(135deg,#785dfb,#5c41d6);font-weight:900;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(108,92,231,.28)}.btn.secondary{background:#10182a}.btn.ghost{background:rgba(255,255,255,.04)}.btn.danger{background:#60162b}.wrap{max-width:1450px;margin:auto;padding:22px 18px 40px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;padding:31px;background:linear-gradient(135deg,rgba(29,41,81,.82),rgba(9,16,29,.9));box-shadow:var(--shadow)}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(3px);pointer-events:none}.hero:before{width:300px;height:300px;right:-100px;top:-120px;background:rgba(25,216,255,.16)}.hero:after{width:260px;height:260px;left:-120px;bottom:-150px;background:rgba(124,92,255,.18)}.heroContent{position:relative;z-index:1}.eyebrow{font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#8eeeff}.hero h1{margin:8px 0;font-size:clamp(36px,5.3vw,62px);line-height:1;letter-spacing:-2px}.hero p{margin:0;max-width:820px;color:#b4c3d8;font-size:17px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.stat{padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(7,14,26,.58);color:#b5c2d5}.stat b{color:#fff}.sectionHead{display:flex;gap:15px;align-items:end;justify-content:space-between;margin:28px 0 11px}.sectionHead h2{margin:0;font-size:28px;letter-spacing:-.7px}.sectionHead span{color:var(--muted);font-size:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#b9c6d8;padding:9px 12px;border-radius:999px;cursor:pointer}.filter.active{background:rgba(124,92,255,.21);color:#fff;border-color:rgba(124,92,255,.5)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{position:relative;min-height:205px;padding:17px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(17,27,46,.97),rgba(8,14,25,.97));box-shadow:0 12px 38px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .22s,border-color .22s,box-shadow .22s}.card:before{content:"";position:absolute;inset:-1px;background:radial-gradient(circle at 100% 0,rgba(25,216,255,.08),transparent 35%),radial-gradient(circle at 0 100%,rgba(124,92,255,.09),transparent 33%);pointer-events:none}.card:hover{transform:translateY(-5px);border-color:rgba(124,92,255,.35);box-shadow:0 24px 55px rgba(0,0,0,.27)}.cardTop{display:flex;justify-content:space-between;gap:8px}.icon{font-size:42px;line-height:1}.heart,.rankIcon{border:0;background:transparent;color:#fff;cursor:pointer;font-size:21px;opacity:.72;padding:0}.heart.on{opacity:1}.card h3{margin:14px 0 3px;font-size:19px}.tag{color:#90a2bb;font-size:12px}.cardBottom{display:flex;gap:8px;align-items:center;margin-top:17px}.play{flex:1}.tiny{color:#a7b5ca;font-size:12px}.empty{grid-column:1/-1;padding:38px;text-align:center;border:1px dashed var(--line);border-radius:22px;color:var(--muted)}.footer{text-align:center;color:#6e8099;padding:38px 0 10px}.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.68);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px}.modal.hidden{display:none}.box{width:min(560px,100%);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:25px;padding:22px;background:#0c1424;box-shadow:var(--shadow)}.field{width:100%;padding:13px 14px;margin:7px 0 10px;border:1px solid var(--line);border-radius:14px;background:#081120;color:#fff;outline:0}.notice{padding:12px 14px;border-radius:14px;background:#081120;color:#a9b8cc;font-size:13px}.codeList{display:grid;gap:8px}.codeRow{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#091221}.codeRow code{color:#8eeeff;font-weight:900}.leader{display:grid;gap:7px}.leaderRow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#0a1322}.leaderRow:first-child{border-color:rgba(255,214,10,.35);box-shadow:0 0 30px rgba(255,214,10,.06)}.secretHint{margin-top:10px;color:#768aa5;font-size:12px}@keyframes rainbowBg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.topin{flex-wrap:wrap}.searchWrap{order:3;flex-basis:100%;max-width:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:23px;border-radius:24px}}@media(max-width:500px){.wrap{padding:12px 10px 30px}.grid{gap:10px}.card{min-height:175px;padding:13px}.icon{font-size:34px}.card h3{font-size:16px}.hero h1{font-size:38px}.sectionHead{align-items:flex-start;flex-direction:column}.actions .btn{flex:1}}
/* Secret overlays */
.secretLayer{position:fixed;inset:0;z-index:2500;pointer-events:none;overflow:hidden}.s67{position:absolute;bottom:-100px;font-weight:1000;text-shadow:0 0 22px currentColor;animation:rise67 2.25s cubic-bezier(.15,.75,.2,1) forwards}.verticalPulse{animation:verticalPulse .8s ease-in-out 2}.razor{position:absolute;left:50%;bottom:-150px;transform:translateX(-50%);font-size:min(22vw,150px);animation:razorRise 3.2s ease-in-out forwards}.tnt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(25vw,180px);animation:tntBlast 1.7s ease-in-out forwards}.rainbowText,.indieBox{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,9vw,105px);font-weight:1000;text-align:center}.pixel{position:absolute;width:12px;height:12px;animation:pixelFall 1.8s linear forwards}.foot{position:absolute;bottom:20%;font-size:54px;animation:moonWalk 3.2s linear forwards}.indiePiece{position:absolute;font-size:38px;animation:indieFloat 2s ease-in-out infinite}@keyframes rise67{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-115vh) rotate(12deg);opacity:0}}@keyframes verticalPulse{0%,100%{transform:translateY(0)}25%{transform:translateY(-28px)}50%{transform:translateY(28px)}75%{transform:translateY(-18px)}}@keyframes razorRise{0%{transform:translate(-50%,30vh) rotate(-18deg)}45%{transform:translate(-50%,-15vh) rotate(12deg)}100%{transform:translate(-50%,-125vh) rotate(-10deg)}}@keyframes tntBlast{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}55%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(3.6);opacity:0}}@keyframes pixelFall{to{transform:translateY(120vh) rotate(360deg);opacity:0}}@keyframes moonWalk{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}@keyframes indieFloat{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-30px) rotate(7deg)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo">Game<span>Galaxy</span> 🚀</div><div class="spacer"></div><div class="searchWrap"><input id="search" class="search" placeholder="🔎 Spiel oder Secret-Code …" autocomplete="off"><span class="searchIcon">⌕</span></div><button class="btn secondary" id="loginBtn">👤 Anmelden</button><button class="btn secondary" id="leaderBtn">🏆 Rangliste</button></div></header>
<main class="wrap">
<section class="hero"><div class="heroContent"><div class="eyebrow">BROWSER GAMES • GAMEGALAXY</div><h1>Smooth. Schnell. <span style="color:#19d8ff">Galaxy.</span></h1><p>33 Browser-Spiele, Levelsystem, Bestwerte, Favoriten, Ranglisten, Sound und echte Secret-Codes.</p><div class="actions"><button class="btn" id="playLast">▶ Weiterspielen</button><button class="btn secondary" id="secretBtn">🔐 Secret-Codes</button><button class="btn secondary" id="rainbowBtn">🌈 Rainbow</button></div><div class="stats"><div class="stat">Level <b id="levelOut">1</b></div><div class="stat">XP <b id="xpOut">0</b></div><div class="stat">Favoriten <b id="favOut">0</b></div><div class="stat">Spiele <b>33</b></div></div></div></section>
<div class="sectionHead"><div><h2>Spiele</h2><span id="resultInfo">33 Spiele</span></div><div class="filters" id="filters"></div></div>
<section class="grid" id="grid"></section>
<footer class="footer">Yusuf 7d Creator</footer>
</main>
<div class="modal hidden" id="modal"><div class="box" id="box"></div></div>
<script>
const GAMES=[
['galaxy','🚀','Galaxy Blaster','Arcade',['rocket','space','galaxy']],['snake','🐍','Snake','Classic',['snake','schlange']],['perfect','⏱️','Perfect Time','Skill',['time','zeit']],['reaction','⚡','Reaction Rush','Speed',['reaction','reaktion']],['memory','🧠','Memory','Brain',['memory','paare']],['2048','🔢','2048','Puzzle',['zahlen','puzzle']],['brick','🧱','Brick Blast','Arcade',['brick','breakout']],['tictactoe','⭕','Tic-Tac-Toe','Strategy',['tic','tac','ttt']],['pong','🏓','Pong','Classic',['pong']],['flappy','🐦','Flappy Sky','Skill',['flappy','bird','vogel']],['lightsout','💡','Lights Out','Puzzle',['lights','licht']],['colormatch','🎨','Color Match','Speed',['farbe','color']],['whack','🔨','Whack Spot','Skill',['whack','hammer']],['connect4','🟡','Vier Gewinnt','Strategy',['connect','vier']],['simon','🔊','Simon','Memory',['simon']],['higherlower','🃏','Higher or Lower','Cards',['higher','lower']],['quickmath','🧮','Quick Math','Math',['math','rechnen']],['coincatch','🪙','Coin Catch','Arcade',['coin','münzen']],['safetiles','💣','Safe Tiles','Memory',['mine','safe']],['connectdots','🔵','Connect Dots','Speed',['dots','punkte']],['guessnumber','🔢','Guess the Number','Brain',['guess','zahl']],['diceduel','🎲','Dice Duel','Dice',['dice','würfel']],['oddoneout','🟣','Odd One Out','Speed',['odd','anders']],['numbersprint','🔢','Number Sprint','Speed',['number','sprint']],['holdmeter','💪','Hold Meter','Skill',['hold','halten']],['wordscramble','🔤','Word Scramble','Words',['word','wort']],['aimtrainer','🎯','Aim Trainer','Skill',['aim','ziel']],['laneracer','🏎️','Lane Racer','Racing',['lane','racing','rennen']],['helicave','🚁','Heli Cave','Arcade',['heli','höhle']],['fishdash','🐟','Fish Dash','Arcade',['fish','fisch']],['basketshot','🏀','Basket Shot','Sports',['basket','basketball']],['goalkeeper','🥅','Goal Keeper','Sports',['goal','torwart']],['neonrunner','🏃','Neon Runner','Runner',['runner','neon']]
];
const CATS=['Alle','Arcade','Classic','Skill','Speed','Brain','Puzzle','Strategy','Cards','Math','Memory','Sports','Runner','Racing','Dice','Words'];
const SECRET_INFO={
'6 7':'Vertikaler 6/7-Boost: Bildschirm von unten nach oben + 6/7 steigen hoch','low taper fade':'Rasierer fährt langsam von unten nach oben','minecraft':'TNT-Platzierung + Explosion','yusufcreater':'Zeigt diese komplette Code-Liste','galaxyghost':'Geister-Sternenmodus','neonparty':'Neon-Party mit Farbimpulsen','pixelstorm':'Pixelregen','moonwalk':'Mond + Fußspuren laufen durchs Bild','rainbow':'Schaltet einen dauerhaften Rainbow-Modus an/aus','indiebox':'Retro-Indie-Box mit Pixel-Icons'
};
let cat='Alle',lastSearch='';const $=id=>document.getElementById(id),favKey='gg_favs';
const favs=()=>JSON.parse(localStorage.getItem(favKey)||'[]');const xp=()=>Number(localStorage.getItem('gg_xp')||0);const lvl=()=>Math.floor(xp()/250)+1;
function setHero(){ $('levelOut').textContent=lvl();$('xpOut').textContent=xp();$('favOut').textContent=favs().length }
function saveFav(a){localStorage.setItem(favKey,JSON.stringify(a));setHero()}
function go(id){localStorage.setItem('gg_last',id);location.href='game.html?game='+encodeURIComponent(id)}
function best(id){return Number(localStorage.getItem('gg_best_'+id)||0)}
function renderFilters(){$('filters').innerHTML=CATS.map(c=>`<button class="filter ${c===cat?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()})}
function render(){renderFilters();const q=$('search').value.trim().toLowerCase();let list=GAMES.filter(g=>cat==='Alle'||g[3]===cat);if(q)list=list.filter(g=>(g[1]+' '+g[2]+' '+g[3]+' '+g[4].join(' ')).toLowerCase().includes(q));$('resultInfo').textContent=list.length+' Spiel'+(list.length===1?'':'e');$('grid').innerHTML=list.length?list.map((g,i)=>{const on=favs().includes(g[0]);return `<article class="card" style="animation:fade .35s ease ${Math.min(i*0.02,.16)}s both"><div><div class="cardTop"><div class="icon">${g[1]}</div><div><button class="heart ${on?'on':''}" data-fav="${g[0]}" title="Favorit">${on?'⭐':'☆'}</button> <button class="rankIcon" data-rank="${g[0]}" title="Rangliste">🏆</button></div></div><h3>${g[2]}</h3><div class="tag">${g[3]}${best(g[0])?` • Bestwert ${best(g[0])}`:''}</div></div><div class="cardBottom"><span class="tiny">Level ${lvl()}</span><button class="btn play" data-play="${g[0]}">Spielen</button></div></article>`}).join(''):`<div class="empty">Kein Treffer. Suche nach einem Spiel oder einem Secret-Code.</div>`;document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>go(b.dataset.play));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=favs(),id=b.dataset.fav,i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);saveFav(a);render()});document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>leaderboard(b.dataset.rank))}
async function hash(v){const data=new TextEncoder().encode(v);const buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function modal(html){$('box').innerHTML=html;$('modal').classList.remove('hidden')};function close(){ $('modal').classList.add('hidden')};$('modal').onclick=e=>{if(e.target.id==='modal')close()};
async function auth(create){const n=$('an').value.trim(),p=$('ap').value;if(!n||p.length<3){alert('Bitte Name + mindestens 3 Zeichen Passwort.');return}const k='gg_acc_'+n.toLowerCase(),h=await hash(p);if(create&&localStorage.getItem(k)){alert('Name ist schon angelegt.');return}if(!create&&localStorage.getItem(k)!==h){alert('Name oder Passwort falsch.');return}localStorage.setItem(k,h);localStorage.setItem('gg_user',n);close();refreshAuth()}
function authModal(){const u=localStorage.getItem('gg_user');if(u){modal(`<h3>👤 ${esc(u)}</h3><p class="notice">Name: ${esc(u)}<br>Level: ${lvl()}<br>XP: ${xp()}<br><small>GitHub Pages speichert dieses Konto nur auf diesem Gerät.</small></p><div class="actions"><button class="btn danger" id="logout">Abmelden</button><button class="btn secondary" id="close">Schließen</button></div>`);$('logout').onclick=()=>{localStorage.removeItem('gg_user');close();refreshAuth()};$('close').onclick=close;return}modal(`<h3>👤 GameGalaxy Konto</h3><p class="notice">Erstelle einen Namen, damit dein Score in den lokalen Ranglisten unter deinem Namen gespeichert wird.</p><input id="an" class="field" placeholder="Name"><input id="ap" class="field" type="password" placeholder="Passwort"><div class="actions"><button class="btn" id="create">Konto erstellen</button><button class="btn secondary" id="login">Anmelden</button></div><button class="btn ghost" id="close" style="width:100%;margin-top:8px">Schließen</button>`);$('create').onclick=()=>auth(true);$('login').onclick=()=>auth(false);$('close').onclick=close}
function refreshAuth(){const u=localStorage.getItem('gg_user');$('loginBtn').textContent=u?'👤 '+u:'👤 Anmelden';$('loginBtn').onclick=authModal}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function leaderboard(id){const g=GAMES.find(x=>x[0]===id);let data=JSON.parse(localStorage.getItem('gg_lb_'+id)||'[]').sort((a,b)=>b.score-a.score).slice(0,10);modal(`<h3>🏆 ${g?esc(g[2]):'Rangliste'}</h3>${data.length?`<div class="leader">${data.map((x,i)=>`<div class="leaderRow"><b>#${i+1}</b><span>${esc(x.name)}</span><strong>${x.score}</strong></div>`).join('')}</div>`:'<p class="notice">Noch keine Einträge auf diesem Gerät.</p>'}<p class="notice" style="margin-top:10px">Die lokale Version speichert Ranglisten auf diesem Gerät. Eine echte Online-Rangliste braucht einen Server.</p><button class="btn secondary" id="close">Schließen</button>`);$('close').onclick=close}
function allLeaderboard(){const id=localStorage.getItem('gg_last')||'galaxy';leaderboard(id)}
function showCodes(){modal(`<h3>🔐 Secret-Codes</h3><div class="codeList">${Object.entries(SECRET_INFO).map(([c,d])=>`<div class="codeRow"><code>${c}</code><span>${d}</span></div>`).join('')}</div><p class="secretHint">Code ins Suchfeld schreiben und Enter drücken.</p><button class="btn secondary" id="close">Schließen</button>`);$('close').onclick=close}
function normCode(v){return v.trim().toLowerCase().replace(/\s+/g,' ')}
function activateCode(raw){let c=normCode(raw);if(c==='six seven'||c==='sex seven')c='6 7';if(!SECRET_INFO[c])return false;if(c==='yusufcreater'){showCodes();return true}secretVisual(c);return true}
function secretVisual(code){const layer=document.createElement('div');layer.className='secretLayer';document.body.appendChild(layer);if(code==='rainbow'){const on=document.body.classList.toggle('rainbowMode');layer.innerHTML=on?'<div class="rainbowText">🌈 RAINBOW ON</div>':'<div class="rainbowText">🌈 RAINBOW OFF</div>';if(!on)setTimeout(()=>layer.remove(),900);else setTimeout(()=>layer.remove(),1500);return}
if(code==='6 7'){document.body.classList.add('verticalPulse');for(let i=0;i<8;i++){const e=document.createElement('div');e.className='s67';e.textContent=i%2?'7':'6';e.style.left=(8+i*12)+'%';e.style.color=i%2?'#19d8ff':'#7c5cff';e.style.fontSize=(42+i*4)+'px';e.style.animationDelay=(i*.09)+'s';layer.appendChild(e)}setTimeout(()=>{document.body.classList.remove('verticalPulse');layer.remove()},2350);return}
if(code==='low taper fade'){const e=document.createElement('div');e.className='razor';e.textContent='🪒';layer.appendChild(e);setTimeout(()=>layer.remove(),3300);return}
if(code==='minecraft'){const e=document.createElement('div');e.className='tnt';e.textContent='🧨';layer.appendChild(e);setTimeout(()=>{e.textContent='💥';e.style.animation='none';e.style.transform='translate(-50%,-50%) scale(2.5)';e.style.filter='drop-shadow(0 0 35px #ff4d00)';},900);setTimeout(()=>layer.remove(),1750);return}
if(code==='galaxyghost'){layer.innerHTML='<div class="rainbowText">👻✨ GALAXY GHOST ✨👻</div>';const chars='✦✧·•'.repeat(22);for(let i=0;i<60;i++){const e=document.createElement('div');e.className='pixel';e.textContent=chars[i%chars.length];e.style.left=Math.random()*100+'%';e.style.top=Math.random()*30+'%';e.style.background='transparent';e.style.color='#c7b7ff';e.style.animationDelay=Math.random()*1.2+'s';layer.appendChild(e)}setTimeout(()=>layer.remove(),2300);return}
if(code==='neonparty'){layer.innerHTML='<div class="rainbowText">🪩 NEON PARTY 🪩</div>';document.body.animate([{filter:'hue-rotate(0deg) saturate(1)'},{filter:'hue-rotate(180deg) saturate(2)'},{filter:'hue-rotate(360deg) saturate(1)'}],{duration:1800});setTimeout(()=>layer.remove(),1900);return}
if(code==='pixelstorm'){for(let i=0;i<90;i++){const e=document.createElement('div');e.className='pixel';e.style.left=Math.random()*100+'%';e.style.top='-20px';e.style.background=['#19d8ff','#7c5cff','#ff5277','#43e184','#ffd60a'][i%5];e.style.animationDelay=Math.random()*.9+'s';layer.appendChild(e)}setTimeout(()=>layer.remove(),2600);return}
if(code==='moonwalk'){const moon=document.createElement('div');moon.className='foot';moon.textContent='🌙';layer.appendChild(moon);for(let i=0;i<10;i++){const f=document.createElement('div');f.className='foot';f.textContent='👣';f.style.left=(-10+i*11)+'%';f.style.animationDelay=(i*.15)+'s';layer.appendChild(f)}setTimeout(()=>layer.remove(),3500);return}
if(code==='indiebox'){layer.innerHTML='<div class="indieBox">📦<br><span style="font-size:.36em;color:#8eeeff">INDIE BOX</span></div>';['🎮','🕹️','👾','💿','⭐','🧩','⚡','🌟'].forEach((v,i)=>{const e=document.createElement('div');e.className='indiePiece';e.textContent=v;e.style.left=(10+i*11)+'%';e.style.top=(25+(i%3)*20)+'%';e.style.animationDelay=(i*.12)+'s';layer.appendChild(e)});setTimeout(()=>layer.remove(),2800);return}}
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&activateCode(e.target.value)){e.target.select();return}if(e.key==='Enter')render()});$('search').addEventListener('input',render);

setHero();render();refreshAuth();
