<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GameGalaxy – Browser Games</title>
<meta name="theme-color" content="#070b14">
<style>
:root{--bg:#070b14;--panel:#101827;--panel2:#151e30;--text:#fff;--muted:#93a4bd;--accent:#6c5ce7;--accent2:#00d4ff;--border:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at top,#101b33 0,#070b14 52%,#05070d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
body{padding-bottom:30px}.wrap{max-width:1300px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(7,11,20,.78);border-bottom:1px solid var(--border)}.topin{max-width:1300px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.logo{font-size:24px;font-weight:900;letter-spacing:.3px}.logo span{color:var(--accent2)}.spacer{flex:1}.search{min-width:170px;max-width:430px;flex:1;padding:12px 14px;border-radius:14px;background:#0d1422;border:1px solid var(--border);color:#fff;outline:0}.btn{border:1px solid var(--border);background:linear-gradient(135deg,#6c5ce7,#8b5cf6);color:#fff;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer}.btn.secondary{background:#121b2b}.btn.danger{background:linear-gradient(135deg,#ff375f,#ff6b6b)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}.card{background:linear-gradient(180deg,#121b2b,#0c1320);border:1px solid var(--border);border-radius:20px;padding:14px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.18);transition:.18s transform,.18s border-color;cursor:pointer}.card:hover{transform:translateY(-4px);border-color:rgba(108,92,231,.55)}.icon{font-size:38px}.name{font-size:18px;font-weight:850;margin-top:8px}.tag{font-size:12px;color:var(--muted);margin-top:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section{margin-top:24px}.section h2{margin:0 0 6px;font-size:24px}.muted{color:var(--muted)}footer{text-align:center;color:var(--muted);padding:35px 0 10px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.box{width:min(440px,100%);background:#101827;border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:#0c1422;color:#fff;margin:7px 0 12px;outline:0}.notice{padding:12px 14px;border-radius:14px;background:#0c1422;color:var(--muted);font-size:13px;margin:10px 0}.profile{display:flex;align-items:center;gap:8px;color:#dfe7f3;font-weight:700}.secret{margin-left:auto}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:740px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topin{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.logo{font-size:21px}}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{min-height:135px;padding:12px}.icon{font-size:32px}.name{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="logo">Game<span>Galaxy</span> 🚀</div>
  <div class="spacer"></div>
  <div id="profile" class="profile"></div>
  <button class="btn secondary" id="loginBtn">Anmelden</button>
  <input id="search" class="search" placeholder="🔎 Spiel suchen …" autocomplete="off">
</div></header>
<main class="wrap">
  <section class="section"><h2>Alle Spiele</h2><div class="muted">Kostenlos • iPad • Handy • Computer</div></section>
  <div id="grid" class="grid"></div>
  <div class="section"><h2>Geheime Codes</h2><div class="muted">Drücke den Button und gib einen Code ein.</div><div class="row" style="margin-top:12px"><button class="btn" id="secretBtn">🔐 Secret Codes</button></div></div>
  <footer>Yusuf 7d Creator</footer>
</main>
<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<script>
const games=[
['galaxy','🚀','Galaxy Blaster','Arcade'],['snake','🐍','Snake','Classic'],['perfect','⏱️','Perfect Time','Skill'],['reaction','⚡','Reaction Rush','Speed'],['memory','🧠','Memory','Brain'],['2048','🔢','2048','Puzzle'],['brick','🧱','Brick Blast','Arcade'],['tictactoe','⭕','Tic-Tac-Toe','Strategy'],['pong','🏓','Pong','Classic'],['flappy','🐦','Flappy Sky','Skill'],['lightsout','💡','Lights Out','Puzzle'],['colormatch','🎨','Color Match','Speed'],['whack','🔨','Whack Spot','Skill'],['connect4','🟡','Vier Gewinnt','Strategy'],['simon','🔊','Simon','Memory'],['higherlower','🃏','Higher or Lower','Cards'],['quickmath','🧮','Quick Math','Math'],['coincatch','🪙','Coin Catch','Arcade'],['safetiles','💣','Safe Tiles','Memory'],['connectdots','🔵','Connect Dots','Speed'],['guessnumber','🔢','Guess the Number','Brain'],['diceduel','🎲','Dice Duel','Dice'],['oddoneout','🟣','Odd One Out','Speed'],['numbersprint','🔢','Number Sprint','Speed'],['holdmeter','💪','Hold Meter','Skill'],['wordscramble','🔤','Word Scramble','Words'],['aimtrainer','🎯','Aim Trainer','Skill'],['laneracer','🏎️','Lane Racer','Racing'],['helicave','🚁','Heli Cave','Arcade'],['fishdash','🐟','Fish Dash','Arcade'],['basketshot','🏀','Basket Shot','Sports'],['goalkeeper','🥅','Goal Keeper','Sports'],['neonrunner','🏃','Neon Runner','Runner']
];
const grid=document.getElementById('grid');const search=document.getElementById('search');
function render(){const q=search.value.toLowerCase().trim();grid.innerHTML=games.filter(g=>(g[2]+' '+g[3]).toLowerCase().includes(q)).map(g=>`<article class="card" onclick="openGame('${g[0]}')"><div><div class="icon">${g[1]}</div><div class="name">${g[2]}</div><div class="tag">${g[3]}</div></div><button class="btn" onclick="event.stopPropagation();openGame('${g[0]}')">Spielen</button></article>`).join('')}
search.oninput=render;render();
function openGame(id){location.href='game.html?game='+encodeURIComponent(id)}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
async function hash(s){const b=new TextEncoder().encode(s);const d=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function refreshUser(){const u=localStorage.getItem('gg_user');const p=document.getElementById('profile');const b=document.getElementById('loginBtn');if(u){p.textContent='👤 '+u;b.textContent='Abmelden';b.onclick=()=>{localStorage.removeItem('gg_user');refreshUser()}}else{p.textContent='';b.textContent='Anmelden';b.onclick=showAuth}}
async function register(){const u=document.getElementById('authUser').value.trim();const pw=document.getElementById('authPw').value;if(!u||pw.length<4){document.getElementById('authMsg').textContent='Bitte Name und mindestens 4 Zeichen Passwort eingeben.';return}const h=await hash(u.toLowerCase()+':'+pw);localStorage.setItem('gg_account_'+u.toLowerCase(),h);localStorage.setItem('gg_user',u);closeModal();refreshUser()}
async function login(){const u=document.getElementById('authUser').value.trim();const pw=document.getElementById('authPw').value;const saved=localStorage.getItem('gg_account_'+u.toLowerCase());const h=await hash(u.toLowerCase()+':'+pw);if(saved&&saved===h){localStorage.setItem('gg_user',u);closeModal();refreshUser()}else document.getElementById('authMsg').textContent='Anmeldung fehlgeschlagen.'}
function showAuth(){openModal(`<h2>Anmelden</h2><div class="muted">Dein Konto wird lokal auf diesem Gerät gespeichert.</div><input id="authUser" class="input" placeholder="Benutzername" autocomplete="username"><input id="authPw" class="input" type="password" placeholder="Passwort" autocomplete="current-password"><div id="authMsg" class="notice"></div><div class="row"><button class="btn" onclick="login()">Anmelden</button><button class="btn secondary" onclick="register()">Konto erstellen</button><button class="btn danger" onclick="closeModal()">Schließen</button></div>`)}
document.getElementById('secretBtn').onclick=()=>openModal(`<h2>🔐 Secret Codes</h2><input id="secretInput" class="input" placeholder="Code eingeben"><div class="notice">Bekannte Codes: 6 7 • low taper fade • minecraft • yusufcreater • galaxyghost • neonparty • pixelstorm • moonwalk • rainbow • indiebox</div><button class="btn" onclick="runSecret()">Ausführen</button> <button class="btn danger" onclick="closeModal()">Schließen</button>`);
function runSecret(){const c=document.getElementById('secretInput').value.trim().toLowerCase();closeModal();if(c==='yusufcreater'){openModal('<h2>Codes</h2><div class="notice">6 7 = Shake/67-Effekt<br>low taper fade = Razor-Effekt<br>minecraft = TNT-Effekt<br>yusufcreater = Code-Liste<br>galaxyghost = Geister-Modus<br>neonparty = Neon-Modus<br>pixelstorm = Pixel-Modus<br>moonwalk = Rückwärts-Bewegung<br>rainbow = Regenbogen<br>indiebox = Indie-Modus</div><button class="btn" onclick="closeModal()">OK</button>');return}localStorage.setItem('gg_secret',c);document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.7)'},{filter:'brightness(1)'}],{duration:700});if(c==='6 7')document.body.animate([{transform:'translateX(0)'},{transform:'translateX(-12px)'},{transform:'translateX(12px)'},{transform:'translateX(0)'}],{duration:450});if(c==='low taper fade'||c==='minecraft'||c==='galaxyghost'||c==='neonparty'||c==='pixelstorm'||c==='moonwalk'||c==='rainbow'||c==='indiebox')alert('Code aktiviert: '+c)}
refreshUser();
</script>
</body></html>
